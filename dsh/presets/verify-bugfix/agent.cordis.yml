- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: !!js >-
      process.getBuiltinModule('node:fs').readFileSync(
        (process.env.DSH_HOME ||
         process.getBuiltinModule('node:os').homedir() + '/.dsh') +
        '/presets/verify-bugfix.prompt.md',
        'utf8'
      )
