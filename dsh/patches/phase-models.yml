# Shared phase model bundle. Profiles list dsh-phase-models before their local patch.
# The llm row is executable because dsh-base supplies the target row first; each
# profile patch then replaces it with the same phase-specific bridge.
- id: llm
  config:
    model: !!js process.env.PROJECT_LOOP_MODEL ?? 'default'
    env:
      model: PROJECT_LOOP_MODEL
      credentials: !!js process.env.DSH_HOME + '/.credentials.yaml'

# Shared phase matrix retained in this bundle source for auditability:
# ANALYZE: PROJECT_LOOP_ANALYZE_MODEL
# IMPLEMENT: PROJECT_LOOP_IMPLEMENT_MODEL
# QA: PROJECT_LOOP_QA_MODEL
# DECOMPOSE: PROJECT_LOOP_DECOMPOSE_MODEL
# PLAN: PROJECT_LOOP_PLAN_MODEL
# CREATIVE: PROJECT_LOOP_CREATIVE_MODEL
# AUDIT: PROJECT_LOOP_AUDIT_MODEL
# BUGFIX: PROJECT_LOOP_BUGFIX_MODEL
# REFLECT: PROJECT_LOOP_REFLECT_MODEL

- id: agent-default-model
  config:
    provider: !!js process.env.PROJECT_LOOP_DSH_PROVIDER ?? 'omniroute'
    model: !!js process.env.PROJECT_LOOP_DSH_MODEL ?? 'default'

- id: agent-instructions
  config:
    maxBytes: 65536
    instructionFileCandidates:
      - AGENTS.md
    localInstructionFileCandidates: []

- id: settings
  disabled: true

- id: llm-pi-ai
  config:
    providers:
      omniroute:
        apiKeyEnv: ANTHROPIC_AUTH_TOKEN
        api: anthropic-messages
        baseURL: !!js process.env.OMNIROUTE_BASE_URL ?? 'http://localhost:20128'
        models:
          - id: !!js process.env.PROJECT_LOOP_DSH_MODEL ?? 'default'
            name: !!js process.env.PROJECT_LOOP_DSH_MODEL ?? 'default'

- id: skill-filesystem
  disabled: true

- id: tool-skill
  disabled: true
