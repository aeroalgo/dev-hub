# dsh-phase-models is applied before this profile patch.
# QA profile patch layer: reviewer preset and phase model bridge.
- insert:
    - id: preset-reviewer
      name: '@deepseek-ai/dsh-agent-presets'
      config:
        id: reviewer
        systemPrompt:
          file: ../../presets/reviewer.prompt.md
    - id: agent-presets
      name: '@deepseek-ai/dsh-agent-presets'
      config:
        default: reviewer
        roots:
          - path: ../../presets
            trust: system
        includeUserRoot: false

- id: llm
  config:
    model: !!js process.env.PROJECT_LOOP_QA_MODEL ?? 'default'
    env:
      model: PROJECT_LOOP_QA_MODEL
      credentials: !!js process.env.DSH_HOME + '/.credentials.yaml'

- insert:
    - id: cc-hooks-bridge
      name: '@deepseek-ai/cordis-plugin-include'
      config:
        path: ../../patches/cc-hooks-bridge.yml

- insert:
    - id: epic-gate
      name: '@dev-hub/dsh-epic-gate'
      config:
        python: !!js process.env.PYTHON ?? 'python3'
        validator: !!js process.env.DSH_SPAWN_VALIDATE ?? '.claude/hooks/spawn_validate.py'
      required: true
