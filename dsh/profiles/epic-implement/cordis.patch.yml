# Profile patch layer: register the phase model and Claude Code compatibility.
# The dsh loader resolves relative file references from this profile directory.
- insert:
    - id: agent-presets
      name: '@deepseek-ai/dsh-agent-presets'
      config:
        default: verify-implement
        roots:
          - path: ../../presets
            trust: system
        includeUserRoot: false

# dsh-phase-models is applied before this profile patch.
# This profile owns only the IMPLEMENT bridge.
# The base bundle's llm service reads the phase-selected model through this row.
- id: llm
  config:
    model: !!js process.env.PROJECT_LOOP_IMPLEMENT_MODEL ?? 'default'
    env:
      model: PROJECT_LOOP_IMPLEMENT_MODEL
      credentials: !!js process.env.DSH_HOME + '/.credentials.yaml'

- insert:
    - id: cc-skills
      name: 'dsh-cc-skills'
      config:
        enableSkills: true
        enableRules: true
        enableGlobal: true
    - id: cc-permissions
      name: 'dsh-cc-permissions'
      config:
        enabled: true
        hideDeniedTools: true
    - id: cc-agents
      name: 'dsh-cc-agents'
      config:
        provider: spawn
        toolName: cc_agent
        injectCatalog: true
    - id: cc-hooks-bridge
      name: 'dsh-cc-hooks'
      config:
        enabled: true
        enableGlobal: true
    - id: cc-mcp
      name: 'dsh-cc-mcp'
      config:
        enableProject: true
        pluginRoots: []
        idleTimeoutMs: 300000
        toolCallTimeoutMs: 60000
        watchProject: true
    - id: tool-name-compat
      name: '@dev-hub/dsh-tool-name-compat'

- insert:
    - id: epic-gate
      name: '@dev-hub/dsh-epic-gate'
      config:
        python: !!js process.env.PYTHON ?? 'python3'
        validator: !!js process.env.DSH_SPAWN_VALIDATE ?? '.claude/hooks/spawn_validate.py'
      required: true
