# dsh-phase-models is applied before this profile patch.
# DECOMPOSE profile patch layer: explorer preset and phase model bridge.
- insert:
    - id: preset-explorer
      name: '@deepseek-ai/dsh-agent-presets'
      config:
        id: explorer
        systemPrompt:
          file: ../../presets/explorer.prompt.md
    - id: agent-presets
      name: '@deepseek-ai/dsh-agent-presets'
      config:
        default: explorer
        roots:
          - path: ../../presets
            trust: system
        includeUserRoot: false

- id: llm
  config:
    model: !!js process.env.PROJECT_LOOP_DECOMPOSE_MODEL ?? 'default'
    env:
      model: PROJECT_LOOP_DECOMPOSE_MODEL
      credentials: !!js process.env.DSH_HOME + '/.credentials.yaml'
