# T-HUB-007 stub; refine in a future epic.
# dsh-phase-models is applied before this profile patch.
- insert:
    - id: preset-verify
      name: '@deepseek-ai/dsh-agent-presets'
      config:
        id: verify
        systemPrompt:
          file: ../../presets/verify.prompt.md
    - id: preset-explorer
      name: '@deepseek-ai/dsh-agent-presets'
      config:
        id: explorer
        systemPrompt:
          file: ../../presets/explorer.prompt.md
    - id: agent-presets
      name: '@deepseek-ai/dsh-agent-presets'
      config:
        default: verify
        roots:
          - path: ../../presets
            trust: system
        includeUserRoot: false

- id: llm
  config:
    model: !!js process.env.PROJECT_LOOP_BUGFIX_MODEL ?? 'default'
    env:
      model: PROJECT_LOOP_BUGFIX_MODEL
      credentials: !!js process.env.DSH_HOME + '/.credentials.yaml'
