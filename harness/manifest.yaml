schema_version: "harness-manifest/v1"
agents:
  verify-implement:
    description: "Pre-FINISH verify gate for IMPLEMENT"
    source: "harness/agents/verify-implement.md"
    runtimes:
      claude:
        copy_to: ".claude/agents/verify-implement.md"
      codex:
        materialize: true
        target: ".codex/agents/verify-implement.toml"
  gate-repair:
    description: "Fix verify FAIL blockers in-scope (write-only)"
    source: "harness/agents/gate-repair.md"
    runtimes:
      claude:
        copy_to: ".claude/agents/gate-repair.md"
      codex:
        materialize: true
        target: ".codex/agents/gate-repair.toml"
  verify-bugfix:
    description: "Pre-FINISH verify gate for BUGFIX"
    source: "harness/agents/verify-bugfix.md"
    runtimes:
      claude:
        copy_to: ".claude/agents/verify-bugfix.md"
      codex:
        materialize: true
        target: ".codex/agents/verify-bugfix.toml"
  verify-qa:
    description: "QA/review gate after parent suite"
    source: "harness/agents/verify-qa.md"
    runtimes:
      claude:
        copy_to: ".claude/agents/verify-qa.md"
      codex:
        materialize: true
        target: ".codex/agents/verify-qa.toml"
  verify-decompose:
    description: "Pre-FINISH verify gate for DECOMPOSE"
    source: "harness/agents/verify-decompose.md"
    runtimes:
      claude:
        copy_to: ".claude/agents/verify-decompose.md"
      codex:
        materialize: true
        target: ".codex/agents/verify-decompose.toml"
  analyze-verify:
    description: "Post-ANALYZE fix verify gate"
    source: "harness/agents/analyze-verify.md"
    runtimes:
      claude:
        copy_to: ".claude/agents/analyze-verify.md"
      codex:
        materialize: true
        target: ".codex/agents/analyze-verify.toml"
  explorer:
    description: "Mandatory codebase search subagent"
    source: "harness/agents/explorer.md"
    runtimes:
      claude:
        copy_to: ".claude/agents/explorer.md"
      codex:
        materialize: true
        target: ".codex/agents/explorer.toml"
  sunset-inventory:
    description: "Sunset inventory extraction agent"
    source: "harness/agents/sunset-inventory.md"
    runtimes:
      claude:
        copy_to: ".claude/agents/sunset-inventory.md"
      codex:
        materialize: true
        target: ".codex/agents/sunset-inventory.toml"
  verify-script:
    description: "Pre-FINISH verify gate for SCRIPT phase"
    source: "harness/agents/verify-script.md"
    runtimes:
      claude:
        copy_to: ".claude/agents/verify-script.md"
      codex:
        materialize: true
        target: ".codex/agents/verify-script.toml"
  verify-edit:
    description: "Pre-FINISH verify gate for EDIT phase"
    source: "harness/agents/verify-edit.md"
    runtimes:
      claude:
        copy_to: ".claude/agents/verify-edit.md"
      codex:
        materialize: true
        target: ".codex/agents/verify-edit.toml"
  verify-publish:
    description: "Pre-FINISH verify gate for PUBLISH phase"
    source: "harness/agents/verify-publish.md"
    runtimes:
      claude:
        copy_to: ".claude/agents/verify-publish.md"
      codex:
        materialize: true
        target: ".codex/agents/verify-publish.toml"
hooks:
  session-start:
    source: "harness/hooks/session-start.py"
    runtimes:
      claude:
        settings_key: "hooks.SessionStart"
      codex:
        hooks_json_entry: true
  user-prompt:
    source: "harness/hooks/user-prompt.py"
    runtimes:
      claude:
        settings_key: "hooks.UserPromptSubmit"
      codex:
        hooks_json_entry: true
  agent-pretool:
    source: "harness/hooks/agent-pretool.py"
    runtimes:
      claude:
        settings_key: "hooks.PreToolUse"
      codex:
        hooks_json_entry: true
  bash-pretool:
    source: "harness/hooks/bash-pretool.py"
    runtimes:
      claude:
        settings_key: "hooks.PreToolUse"
      codex:
        hooks_json_entry: true
  write-pretool:
    source: "harness/hooks/write-pretool.py"
    runtimes:
      claude:
        settings_key: "hooks.PreToolUse"
      codex:
        hooks_json_entry: true
  agent-posttool:
    source: "harness/hooks/agent-posttool.py"
    runtimes:
      claude:
        settings_key: "hooks.PostToolUse"
      codex:
        hooks_json_entry: true
  bash-output-cap:
    source: "harness/hooks/bash-output-cap.py"
    runtimes:
      claude:
        settings_key: "hooks.PostToolUse"
      codex:
        hooks_json_entry: true
  subagent-start:
    source: "harness/hooks/subagent-start.py"
    runtimes:
      claude:
        settings_key: "hooks.SubagentStart"
      codex:
        hooks_json_entry: true
  subagent-stop:
    source: "harness/hooks/subagent-stop.py"
    runtimes:
      claude:
        settings_key: "hooks.SubagentStop"
      codex:
        hooks_json_entry: true
  stop-gate:
    source: "harness/hooks/stop-gate.py"
    runtimes:
      claude:
        settings_key: "hooks.StopGate"
      dsh:
        adapter_hook: true
      codex:
        hooks_json_entry: true
  # Out of scope (FR-012 compliance): session-end, permission-request, pre-compact, post-compact
instructions:
  main:
    source: "harness/instructions/main.md"
    runtimes:
      claude:
        target: "CLAUDE.md"
      dsh:
        target: "DSH.md"
      codex:
        target: "AGENTS.md"
