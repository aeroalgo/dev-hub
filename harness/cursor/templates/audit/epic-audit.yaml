schema: epic-audit/v2
role: back
epic_id: <epic_id>
plan_id: <plan_id>
date: YYYY-MM-DD
auditor: BACK AUDIT

# HARD: derive from plan.md (WHAT / Product probe Reframe / Контекст) — not from decompose titles.
plan_intent:
  epic_goal: <verbatim epic goal from plan — what success looks like>
  source: plan.md#WHAT

summary:
  total_steps: 0
  implemented: 0
  not_implemented: 0
  deviations: 0
  findings: 0

# Intent coverage — IDs MUST match plan-*.md FR/SC/US verbatim (no remapped audit FR-00N).
intent_checked:
  fr_total: 0
  fr_satisfied: 0
  sc_checked: 0
  layout_paths_total: 0
  layout_paths_closed: 0
  constitution_checked: false

# Triple assess (HARD):
# 1) plan_vs_runtime — каждый plan FR/US/AC/layout vs runtime evidence
# 2) step_matrix — каждый sNN|eNN ✅/❌/⚠️ vs implement
# 3) architecture_parity — Target layout / HOW target vs as-built tree
plan_vs_runtime:
  - source_ref: FR-###
    status: satisfied | partial | missing | deferred
    evidence: <behavior evidence or path>
    remaining_work: ""

architecture_parity:
  - layout_path: harness/example/
    status: present | missing | deferred
    follow_up: ""   # required if deferred; ID must be in roadmap-*.queue.yaml
    evidence: ""

# Findings ordered CRITICAL, HIGH, MEDIUM, LOW, then by stable id.
# Dual-write: actionable missing → not_implemented[]; partial/contradicts → deviations[].
findings:
  - id: F1
    gap_type: missing | partial | contradicts | unrequested | layout_dilution | dilution
    severity: CRITICAL | HIGH | MEDIUM | LOW
    source_ref: FR-### | layout:<path> | plan:<section>
    evidence: <file/area observed>
    remaining_work: <actionable remediation or review decision>

converged: false

implemented:
  - step_id: sNN
    implement_file: implement-<epic_id>/sNN-<slug>.yaml

not_implemented:
  - step_id: sNN
    plan_title: <title from plan — not remapped>
    new_shard: decompose-<epic_id>/sNN-audit-<slug>.yaml

deviations:
  - step_id: sNN
    implement_file: implement-<epic_id>/sNN-<slug>.yaml
    plan_intent: <what plan said>
    actual: <what was actually done>
    impact: low | medium | high

# Brownfield replace / cutover (shared/workflow-legacy-fallback-cleanup.mdc §4):
sunset_inventory_scan:
  scanned_at: YYYY-MM-DD
  plan_ref: plan-<epic_id>.md#replacement--sunset
  rows:
    - symbol: path/or/FunctionName
      kind: A
      command: 'rg -n "FunctionName" <scope> --glob "*.py" | rg -v "test_|/archive/"'
      result: pass | fail
      prod_callers: []
      notes: ""
legacy_surfaces_remaining: []
fallback_remaining: []
instruction_remaining: []
purge_step_present: true
sot_enforce_scan:
  scanned_at: YYYY-MM-DD
  rows:
    - boundary: <boundary-id>
      enforce_evidence: 'rg / test command…'
      result: pass | fail
      notes: ""

blocked_reason: ""
