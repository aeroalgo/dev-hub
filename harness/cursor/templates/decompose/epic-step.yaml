schema: epic-decompose/v1
role: back
step_id: sNN
plan_id: <plan_id>
title: <title>
next_phase: BACK IMPLEMENT
needs_creative: "no"

goal: |
  одна-две строки: user/system outcome + связь с Goal/NFR плана (не только «создать файл X»).
  # Outcome preserve: см. workflow-*-decompose.mdc — intent плана не ужимать до scaffolding

# Plan contract (HARD) — bake plan WHAT into shard so IMPLEMENT не слеп
# IMPLEMENT читает ЭТО (+ plan_jumps), не весь plan.
plan_contract:
  fr_ids: [] # FR-### / SC-### / US-### закрываемые этим sNN
  nouns: [] # runtime surfaces из plan FR (agent file, CLI, hook, layout path…)
  layout_paths: [] # Target layout paths, которые этот шаг создаёт/трогает (например: plan/<epic_id>/yaml/, implement/<epic_id>/yaml/steps/sNN-*.yaml)
  ac_quotes: [] # короткие цитаты AC± / Independent Test (1–3 строки)
  plan_jumps: [] # "plan/<epic_id>/md/plan.md:120-160" — Read offset; line 120-160 = 160-120 = 40 * 2 => 100% к изначальному scope; jump 120-200
  # vertical_slice: closing wire/enforce shard must name the production entrypoint,
  # caller and failure HALT in context.produces/delta/checkpoints. Resolver/CLI-only
  # closes a capability only when CLI is the promised outcome; foundation_only needs
  # explicit user approval and a follow_up epic ID already in roadmap queue.

context:
  consumes: []
  produces: []
  plan_refs: []
  # Для sNN-audit-* / eNN-audit-* обязательно указывать source_ref находки
  # (например FR-### / SC-###) в goal и plan_refs.
  files: []
  # files = create/edit paths; удаления — только в top-level deletes (не дублировать сюда)

# Delta layer (HARD for brownfield / «already wired»)
as_built: []
# что уже в коде до этого sNN/eNN (пути + 1 факт)

delta: []
# только что меняем в этом шаге (add/edit/wire). Удаление замены — в deletes + cp verify

deletes: []
# пути/символы, которые ЭТОТ sNN|eNN обязан удалить (не shim «на потом»).
# [] только если шаг ничего не вытесняет. Replace X→Y без deletes у владельца cutover = FAIL.
# Цепочка OK: sN add → sN+1 migrate callers → sN+2 deletes старого. Delete-шаг в очереди обязателен.
# Checkpoint: ≥1 verify с `rg`/import-audit — старый путь/символ без живых callers.
# Brownfield: финальный шаг slug *-legacy-fallback-purge — остаток A+B+C+I + ПОЛНЫЙ inventory scan.
# Шаблон purge: @.cursor/templates/decompose/legacy-purge-step.yaml (sunset_inventory + grep_control + cp-inventory-a/b/c/i).
# Machine-boundary steps: set wire_complete_required: true → ladder wire→enforce→purge;
# IMPLEMENT must ship wire_complete + deny_old_proven (behavior-first §9 / anti-minimal-done).
# wire_complete_required: false
wire_complete_required: false

# Sunset Scope (optional — для шагов, требующих bounded sunset-inventory scan)
# sunset_scope:
#   required: false              # true если шаг требует явного запуска sunset-inventory
#   boundary_id: <boundary_id>   # идентификатор границы / подсистемы
#   new_sot: <new_sot_path>      # новый Single Source of Truth
#   allow_read:                  # glob-список разрешенных для чтения путей
#     - "path/to/files/**"
#   kind_hint:                   # optional: A | B | C | I
#     - A
#     - B

out_of_scope: []
# соседние sNN/eNN, full suite → QA, не трогать.
# «оставить legacy/shim» / deferred / partial — ТОЛЬКО с `follow_up: T-HUB-…` (ID уже в roadmap-*.queue.yaml).
# Bare «deferred» / «leave for later» без follow_up ID = FAIL (validate-traceability CRITICAL).

skills:
  # HARD gate: code_surface ≠ docs → Core ∪ situational; docs → impl: [] only.
  # Copy-paste empty impl on api/service/sql/… = DECOMPOSE FAIL (validate-decompose-tree).
  code_surface: api  # api|service|sql|ws|model|infra|test|ui|docs
  impl:
    - .agents/skills/tdd/SKILL.md
    - .agents/skills/python-testing-patterns/SKILL.md
    - .agents/skills/modern-python/SKILL.md
    - .agents/skills/python-anti-patterns/SKILL.md
    - .agents/skills/fastapi-templates/SKILL.md
    - .agents/skills/async-python-patterns/SKILL.md
    - .agents/skills/python-error-handling/SKILL.md
    # Adjust situational to surface; omit via omit_justification with reason (cap situational ≤6)
  # omit_justification:
  #   fastapi-templates: "no HTTP routes in this step"

checkpoints:
  - id: cp1
    criterion: атомарный AC (не весь goal)
    verify: "bin/pytest path/to/test -q  # Hub (dev-hub self-test); managed: capability_checks: [test.targeted]"
  - id: cp2
    criterion: ...
    verify: "..."

# Test scope (HARD): только targeted проверки по files/delta этого шага.
# Full suite без path/nodeid/-k — только в QA-артефакте после IMPLEMENT.

verify: []
tdd: []

# needs_creative (BACK/FRONT): no | yes (CR-…) | yes (CR-…) — **closed**
#
# role: front — next_phase: FRONT IMPLEMENT; code_surface: ui
#   deletes: legacy components/hooks/clients; rg/import-audit cp обязателен если непустой
#
# role: integ — дополнительно:
# element_id: eNN
# ui: { route, components, user_sees }
# data_need: ...
# api_today: [{ status, detail }]
# contract: { method_path, query_keys, response_shape, front_client }
# db: ...
# back: []
# front: []
# deletes: []  # mock/legacy client paths — HARD при ⚠️ mock→live
# grep_control: [{ back, front }]
# goal / as_built / delta / deletes / out_of_scope / plan_contract — обязательны как у BACK/FRONT
# checkpoints[] — 2–4 cp; у каждого criterion + verify (dev-hub bin/pytest / FRONT vitest parent-only / managed capability_checks / rg)
