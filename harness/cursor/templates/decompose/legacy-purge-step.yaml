schema: epic-decompose/v1
role: back
step_id: sNN
plan_id: <plan_id>
title: sNN — legacy-fallback-purge — full sunset inventory scan + deletes
next_phase: BACK IMPLEMENT
needs_creative: "no"

goal: |
  Финальный cutover purge: удалить весь остаток plan `## Replacement / sunset` A+B+C+I.
  Нулевые prod-callers по каждой строке inventory; obsolete tests на старый контракт —
  delete или rewrite; Kind I instructions переписаны; suite green без restore legacy.
  Канон: @.cursor/rules/shared/workflow-legacy-fallback-cleanup.mdc §2.2–§2.4

context:
  consumes:
    - plan §Replacement / sunset (таблицы A, B, C, I)
    - decompose index §Replacement cleanup (все строки)
  produces:
    - удалённые символы/entrypoints/fallbacks/instructions
    - удалённые/переписанные obsolete tests
    - evidence rg/inventory в implement shard
  plan_refs:
    - plan-<plan_id>.md#replacement--sunset
  files: []

as_built: []
delta: []

# HARD: каждая строка plan sunset A/B/C/I + index Replacement cleanup — одна запись.
# Policy `shim+follow-up` допустим только если follow_up_epic в roadmap queue; иначе delete here.
# Obsolete tests (assert старый контракт) — отдельные строки kind=A или entries в deletes:.
# Kind I — prompts/rules/context_loop/spawn text, требующие старый machine format.
sunset_inventory:
  - symbol: path/or/FunctionName
    kind: A
    replacement: new.module.path
    policy: delete in-epic
    rg_scope: loop/ .claude/
    expect: zero prod callers; no live asserts on old contract
  - symbol: tests/.../test_legacy_contract.py::test_old_behavior
    kind: A
    replacement: tests on new contract / delete case
    policy: delete in-epic
    rg_scope: loop/tests/ harness/hooks/tests/
    expect: case absent or rewritten
  - symbol: docker-compose service / CLI flag / npm script
    kind: B
    replacement: new entrypoint
    policy: delete in-epic
    rg_scope: docker-compose*.yml Dockerfile* package.json Makefile bin/
    expect: zero matches in command/CMD/scripts
  - symbol: 'or "http://127.0.0.1:…"' # pattern from plan C
    kind: C
    replacement: fail-closed settings
    policy: delete in-epic
    rg_scope: <prod paths from plan>
    expect: zero fallback/dual-path matches
  - symbol: '<old-machine-format instruction pattern>'
    kind: I
    replacement: instruction for new SoT
    policy: delete in-epic
    rg_scope: <prompts/rules/packed-prompt paths from plan I>
    expect: zero old machine-format instructions

deletes: []
# = весь остаток A+B+C+I + obsolete test paths/nodeids, не удалённый предыдущими sNN|eNN.
# FORBIDDEN оставлять: public shim с prod callers, router → deprecated public API,
# «alias period» без follow-up ID, тесты/instructions которые чинятся только restore legacy.

out_of_scope: []

# Mirror sunset_inventory — executable rg per row (FINISH evidence обязана).
grep_control:
  - id: inv-a-01
    kind: A
    symbol: path/or/FunctionName
    command: 'rg -n "FunctionName" loop/ .claude/ --glob "*.py" | rg -v "/archive/|deprecated|_legacy_warn"'
    expect: no prod callers; test hits only if rewritten to new contract
  - id: inv-a-tests-01
    kind: A
    symbol: obsolete test asserting old contract
    command: 'rg -n "<old-contract-assert-pattern>" <test-paths> || true'
    expect: no output (obsolete cases deleted/rewritten)
  - id: inv-b-01
    kind: B
    symbol: legacy-service-cmd
    command: 'rg -n "legacy-service" docker-compose*.yml Dockerfile* package.json Makefile bin/ || true'
    expect: no output
  - id: inv-c-01
    kind: C
    symbol: 'or "http://127.0.0.1'
    command: 'rg -n "or \"http://" <prod-paths> --glob "*.py"'
    expect: no fallback/dual-path in prod (tests on old fallback also purged)
  - id: inv-i-01
    kind: I
    symbol: old machine-format instruction
    command: 'rg -n "<old-instruction-pattern>" <instruction-scope> || true'
    expect: no old machine-format instructions in scope

skills:
  code_surface: api
  impl: []

checkpoints:
  - id: cp-inventory-a
    criterion: |
      Kind A — rg по КАЖДОЙ строке sunset_inventory kind=A (не выборочно):
      0 prod callers. Matches в tests/ допустимы ТОЛЬКО если кейс уже на новом контракте.
      Asserts на sunset-поведение / импорт удалённого API = FAIL (deletes/rewrite).
      Shim с ≥1 prod caller = FAIL. Router импортирует deprecated public symbol = FAIL.
    verify: |
      for row in sunset_inventory kind=A; run grep_control command; capture output in implement evidence
  - id: cp-inventory-b
    criterion: |
      Kind B — entrypoint inventory: docker-compose*/Dockerfile*/CLI/scripts из plan B —
      нет legacy command/CMD/target.
    verify: |
      rg/inventory per grep_control kind=B rows
  - id: cp-inventory-c
    criterion: |
      Kind C — anti-fallback rg: dual-path / soft default / silent stub patterns из plan C —
      0 matches в prod paths; obsolete fallback tests purged.
    verify: |
      rg per grep_control kind=C rows
  - id: cp-inventory-i
    criterion: |
      Kind I — instruction surfaces: prompts/rules/context_loop/spawn —
      0 hits старого machine format из plan I.
    verify: |
      rg per grep_control kind=I rows
  - id: cp-obsolete-tests
    criterion: |
      Obsolete tests на старый контракт удалены или переписаны; suite green без restore legacy.
    verify: |
      rg per grep_control inv-a-tests-* ; then targeted pytest green
  - id: cp-suite-regression
    criterion: Targeted + epic regression suite green после deletes (без возврата sunset-кода)
    verify: "bin/pytest loop/tests/ -q --tb=line -k '<epic-or-area>'"

verify: []
tdd: []
