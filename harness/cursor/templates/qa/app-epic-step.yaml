schema: app-qa/v1
role: app
task_id: T-xxx
plan_id: <plan_id-or-adhoc>
epic_id: <plan_id-or-empty>
date: YYYY-MM-DD
reviewer: APP QA
verdict: pass
checklist_sha256: <from Frozen QA checklist>
verify_scope: full
mode: diff_aware

charter:
  code_under_test:
    base: main
    paths: []
  surfaces_required: [backend, frontend_build, browser, live_smoke]
  surfaces_optional: [exploratory, wire_journey]
  surfaces_skipped: []
  stack_profile: "docs/testing/front-stack-profile.md"

# Scope-driven test obligations. Keep names/IDs from test-catalog.yaml; concrete
# commands and runtime details belong to implement shards, stack profiles, and lanes.
test_plan:
  catalog: ".cursor/templates/qa/test-catalog.yaml"
  source: [implement_shards, plan_contract, diff, prior_blockers]
  mode: diff_aware
  scope_signals: []
  selected: []
  not_applicable: []
  not_run: []

lanes:
  - id: backend
    required: true
    status: pass
    command: "timeout -k 10s 300s .venv/bin/pytest -q --tb=line"
    evidence: ""
    notes: ""
  - id: frontend_build
    required: true
    status: pass
    command: "npm --prefix frontend ci && npm --prefix frontend run build"
    evidence: ""
    notes: ""
  - id: browser
    required: true
    status: pass
    command: "NEFTEGAZ_BROWSER=chromium timeout -k 10s 300s .venv/bin/python scripts/run_browser_qa.py --smoke-only"
    evidence: "browser-artifacts/"
    notes: ""
  - id: live_smoke
    required: true
    status: pass
    command: "timeout -k 10s 300s bash scripts/live_smoke.sh"
    evidence: ""
    notes: ""
  - id: leftover_sot
    required: false
    status: n/a
    command: ""
    evidence: ""
    notes: ""
  - id: behavior_smoke
    required: false
    status: n/a
    command: ""
    evidence: ""
    notes: ""
  - id: wire_journey
    required: false
    status: skipped
    command: ""
    evidence: ""
    notes: "covered by browser P0"
  - id: exploratory
    required: false
    status: skipped
    command: ""
    evidence: ""
    notes: "no live app / time-box n/a"

scope:
  - "task: T-xxx"
  - "files: …"

ac_plus: []
ac_minus: []
section_011: []

coverage_map:
  - id: AC-001
    kind: AC
    scenario: "<browser/API scenario or n/a>"
    evidence: "<path, URL, screenshot, command>"
    status: pass

review:
  status: pass
  scope: "<diff/runtime surface>"
  findings: []

test_audit:
  status: pass
  checks:
    - "assertions exercise outcome, not only status/build"
    - "no global API mocking hides production wire"
    - "skips/xfails and route.fulfill bounded"
    - "browser/API test included in declared CI job"
  findings: []

browser:
  status: pass
  stack_profile: "<profile path>"
  evidence_file: ""
  last_run_at: ""
  journeys: []
  artifacts: []

retro:
  status: done
  defect_missed: "none"
  redundant_gate: "none"
  flaky_test: "none"
  next_cycle_change: "none"

sunset_inventory_scan:
  status: n/a
  scanned_at: ""
  rows: []
legacy_surfaces_remaining: []
fallback_remaining: []
instruction_remaining: []
sot_enforce_scan:
  status: n/a
  rows: []

checks:
  - "all required lanes pass"
  - "charter announced before probes"
  - "live_smoke is live HTTP, not ASGI mocks"
  - "verify-qa PASS"

issues: []
blockers: []
fix_plan: []
limitations: []

live_smoke:
  status: pass
  command: "timeout -k 10s 300s bash scripts/live_smoke.sh"
  evidence_file: ""
  last_run_at: ""
  base_url: "http://127.0.0.1:8000"
  level: health
  notes: ""
