plan_intent:
  epic_goal: Оператор включает проекцию на выбранный таскборд. После успешного finish/halt
    loop создаёт или двигает карточку эпика в колонку, соответствующую фазе. Смена
    трекера — смена provider в конфиге (с безопасным mapping). Loop остаётся SoT;
    доска — зеркало для людей.
  source: memory-bank/back/plan/T-HUB-108-loop-board-projection/md/plan.md#WHAT
