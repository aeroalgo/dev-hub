findings:
  - id: F1
    gap_type: partial
    severity: HIGH
    source_ref: FR-017
    evidence: loop/board_sync/scan_gates.py:119-138 returns no WorkItem for lifecycle phase DONE; loop/board_sync/sync.py:48-65 only computes archive for mb-* IDs absent from desired and has no epic-scoped DONE archive signal; no test covers test_done_epic_archive_all.
    remaining_work: Add an explicit DONE/archive-all projection carrying workspace, role, and epic identity, make sync archive all matching mb-* cards for that epic while preserving non-mb cards, and add a focused regression test.
  - id: F2
    gap_type: partial
    severity: HIGH
    source_ref: FR-010
    evidence: loop/board_sync/sync.py:50-57 increments sync_generation on every run; loop/board_sync/diff.py:133-135 compares full BoardTask including sync_generation, so unchanged repeat sync produces update operations rather than no-op.
    remaining_work: Exclude sync_generation from equality comparison (or preserve generation on equal content) and add a regression assertion that the second unchanged sync has zero operations while retaining generation semantics required by metadata.
  - id: F3
    gap_type: partial
    severity: MEDIUM
    source_ref: "FR-004 / Constitution MUST-2"
    evidence: loop/board_sync/scan_gates.py:264-269 swallows ImportError/OSError/ValueError/KeyError from roadmap_queue.select_next_epic and returns an empty gate list with no error channel; malformed/missing roadmap state is indistinguishable from no ROADMAP tip.
    remaining_work: Surface a diagnostic/error result for roadmap selection failures or define a typed fail-closed exception consumed by CLI, and add tests for invalid/missing queue behavior; do not silently suppress required configuration errors.

