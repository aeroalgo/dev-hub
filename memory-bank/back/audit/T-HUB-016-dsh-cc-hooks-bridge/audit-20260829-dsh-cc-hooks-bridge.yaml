findings:
  - id: F1
    gap_type: partial
    severity: HIGH
    source_ref: FR-008 / SC-001 / AC+SC-001
    evidence: tests/test_cc_hooks_bridge_config.py:15-32 checks YAML fields and profile text only; s07 implement evidence explicitly records static smoke and no live `dsh --profile epic-implement --dump-config` output.
    remaining_work: Add a bounded dump-config smoke using the installed/pinned DSH profile, assert the bridge plugin appears in the emitted configuration, and record the command/result; retain the static YAML test as a fast check.
  - id: F2
    gap_type: partial
    severity: HIGH
    source_ref: FR-009 / SC-004 / AC−-002 / NFR-2
    evidence: s07 records `.claude/hooks/tests/ -q -k 'not dsh_self_limit'` with 4 deselected, so no Claude-path test executed; no Claude loop result or byte-stability assertion for .claude/settings.json is recorded.
    remaining_work: Run the actual Claude-path hook regression subset (excluding only DSH-specific tests), add/assert a byte-stability or hash check for .claude/settings.json, and record non-zero executed-test evidence plus the Claude loop smoke result.
  - id: F3
    gap_type: partial
    severity: MEDIUM
    source_ref: AC+US-003 / FR-005 / NFR-5
    evidence: dsh/patches/cc-claude-compat.yml and optionalDependencies configure the mount, but no `.claude/skills` fixture or runtime listing check proves the plugin exposes a skill.
    remaining_work: Add an isolated compat fixture smoke that creates a representative `.claude/skills` entry, loads the epic-implement configuration, and asserts the skill is listed; separately verify missing-package behavior remains fail-soft.
  - id: F4
    gap_type: contradicts
    severity: MEDIUM
    source_ref: plan:AC+ (line 111) / FR-007 / SC-003
    evidence: plan AC+ requires a configurable consecutive-Stop limit with default 8, while .claude/hooks/stop-gate.py:79 hard-codes DSH_SELF_LIMIT_MAX = 3 and no configuration input is implemented; s05 tests only the hard-coded threshold.
    remaining_work: Reconcile the plan/decompose contract, expose a validated configuration value with the agreed default (8 unless the plan is explicitly revised), and add tests for default, valid override, and invalid override fail-closed behavior.
  - id: F5
    gap_type: partial
    severity: LOW
    source_ref: AC−-004 / Constitution MUST-2 / Constitution MUST-5
    evidence: cordis.patch.yml:34-40 sets required:true for epic-implement and README:207 describes loud failure, but no bounded smoke feeds a missing/invalid configPath through the bridge to verify an observable diagnostic rather than a silent fallback.
    remaining_work: Add a configuration-level failure smoke for the required epic-implement bridge path and record the emitted diagnostic; preserve required:false only for the intentionally optional shared/compat mounts.

