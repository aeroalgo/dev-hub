findings:
  - id: F1
    gap_type: missing
    severity: HIGH
    source_ref: FR-007
    evidence: loop/board_launch/loop_run.py:20-27,89-102 returns ExecutionResult with a local log_path; loop/board_sync/client.py has no execution-record operation and no launch caller updates a board task.
    remaining_work: Add an explicit Host/client execution-record contract carrying status, exit_code, diagnostic_code, and bounded log_path; invoke it for success, failure, timeout, and spawn-error outcomes, with tests proving the board record is updated.
  - id: F2
    gap_type: contradicts
    severity: HIGH
    source_ref: FR-005 / AC−7 / SC-003
    evidence: dsh/plugins/mb-bridge/src/intercept-run.ts:29-57 defines interceptStockRun/denyStockRun, while dsh/plugins/mb-bridge/src/index.ts:18-24 registers only the route and string injections; no live stock-run event handler calls either function.
    remaining_work: Wire the Path B Host/UI stock-run surface so every mb-* stock Run is redirected to arm-loop or fails with mb_card_requires_loop_run; preserve non-mb passthrough and add an import/rg control proving no direct mb stock caller remains.
  - id: F3
    gap_type: partial
    severity: MEDIUM
