    evidence: "Модули harness/hooks/context_telemetry.py и loop/mb_finish/finish_implement.py формируют FinishReceipt с unique_reads, duplicate_reads, bytes/ranges, monolith_plan_attempts, search_exceptions и highest_repeat_path."
    verify: "pytest harness/hooks/tests/test_context_telemetry.py"

  - source_ref: "FR-006"
