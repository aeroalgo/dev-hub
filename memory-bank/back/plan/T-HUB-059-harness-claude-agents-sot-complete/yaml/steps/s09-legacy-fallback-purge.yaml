  - "Возможны остатки: test comments с .claude/commands как real SoT; assertions на .agents реальный dir"

delta:
  - "rg sweep: найти и удалить/переписать тесты, asserting real-dir SoT .claude/commands|skills|rules или .agents/skills"
  - "rg sweep Kind A: нет prod callers к реальным dirs как SoT"
  - "rg sweep Kind B: нет entrypoints/Makefile/docs говорящих .agents tree = SoT"
  - "rg sweep Kind C: нет dual-path fallback или silent skip при mv"
  - "rg sweep Kind I: нет runtime instructions (не archive) с .claude/commands или .agents/skills как SoT"

deletes:
