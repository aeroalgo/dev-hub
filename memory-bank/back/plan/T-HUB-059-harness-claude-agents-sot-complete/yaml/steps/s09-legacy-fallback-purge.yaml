sunset_inventory:
  - symbol: ".claude/commands (real directory SoT)"
    kind: A
    replacement: "harness/claude/commands + symlink"
    policy: delete in-epic
    rg_scope: "bin/ loop/ harness/"
    expect: "test -L .claude/commands passes; real dir absent"
  - symbol: ".claude/skills (real directory SoT)"
    kind: A
    replacement: "harness/claude/skills + symlink"
    policy: delete in-epic
    rg_scope: "bin/ loop/ harness/"
    expect: "test -L .claude/skills passes; real dir absent"
  - symbol: ".claude/rules (real directory SoT)"
    kind: A
    replacement: "harness/claude/rules + symlink"
    policy: delete in-epic
    rg_scope: "bin/ loop/ harness/"
    expect: "test -L .claude/rules passes; real dir absent"
  - symbol: ".agents/skills (real directory SoT)"
    kind: A
    replacement: "harness/skills + symlink"
    policy: delete in-epic
    rg_scope: "bin/ loop/ harness/"
    expect: "test -L .agents/skills passes; real dir absent"
  - symbol: "tests asserting .agents/.claude/commands must be real SoT dirs"
    kind: A
    replacement: "tests asserting symlink + harness resolve"
    policy: delete/rewrite in-epic
    rg_scope: "loop/tests/"
    expect: "no assert requiring real dir SoT at shell path"
  - symbol: "hub-link full link_one \".agents\" $DEV_HUB/.agents (whole .agents as SoT)"
    kind: B
    replacement: "link_one \".agents/skills\" $DEV_HUB/harness/skills"
    policy: delete in-epic
    rg_scope: "bin/"
    expect: "no match for link_one .agents without /skills suffix in full mode"
  - symbol: "hub-link full product links to hub real .claude/commands (not harness)"
    kind: B
    replacement: "links to $DEV_HUB/harness/claude/commands"
    policy: delete in-epic
    rg_scope: "bin/"
    expect: "harness/claude path present in full mode logic"
  - symbol: "Makefile/docs implying .agents tree SoT"
    kind: B
    replacement: "harness/skills wording"
    policy: delete in-epic
    rg_scope: "bin/ harness/ docs/"
    expect: "no .agents SoT wording in entrypoint docs"
  - symbol: "«skills stay in .agents if mv hard» silent skip"
    kind: C
    replacement: "fail-closed / complete mv"
    policy: delete in-epic
    rg_scope: "bin/ loop/"
    expect: "no silent skip on mv failure"
  - symbol: "dual keep copy in .claude and harness"
    kind: C
    replacement: "sole harness + symlink"
    policy: delete in-epic
    rg_scope: "bin/ loop/"
    expect: "no dual-path fallback"
  - symbol: "alongside auto full skills on conflict (no exit 2)"
    kind: C
    replacement: "exit 2 fail-closed"
    policy: delete in-epic
    rg_scope: "bin/hub-link"
    expect: "conflict → exit 2 (s06)"
  - symbol: "README/AGENTS stub «Skills: .agents/skills» as SoT"
    kind: I
    replacement: "harness/skills/*/SKILL.md (+ shell note)"
    policy: delete in-epic
    rg_scope: "harness/ bin/"
    expect: "no .agents/skills SoT mention in AGENTS stub or README"
  - symbol: "architecture/services.md shells omitting claude commands/rules"
    kind: I
    replacement: "update shells table"
    policy: delete in-epic
    rg_scope: "memory-bank/architecture/"
    expect: "harness/claude/commands present in shells table (s08)"
  - symbol: "test comments requiring real .claude/commands SoT"
    kind: I
    replacement: "harness paths"
    policy: delete in-epic
    rg_scope: "loop/tests/"
    expect: "no comments asserting .claude/commands = real SoT"

grep_control:
  - id: inv-a-01
    kind: A
    symbol: ".claude/commands real dir"
    command: "test -L .claude/commands && echo 'OK symlink' || echo 'FAIL: real dir or missing'"
    expect: "OK symlink"
  - id: inv-a-02
    kind: A
    symbol: ".claude/skills real dir"
    command: "test -L .claude/skills && echo 'OK symlink' || echo 'FAIL'"
    expect: "OK symlink"
  - id: inv-a-03
    kind: A
    symbol: ".claude/rules real dir"
    command: "test -L .claude/rules && echo 'OK symlink' || echo 'FAIL'"
    expect: "OK symlink"
  - id: inv-a-04
    kind: A
    symbol: ".agents/skills real dir"
    command: "test -L .agents/skills && echo 'OK symlink' || echo 'FAIL'"
    expect: "OK symlink"
  - id: inv-a-tests-01
    kind: A
    symbol: "obsolete test asserting .claude/commands real dir SoT"
    command: "rg -n 'assert.*\\.claude/commands.*real\\|isdir.*\\.claude/commands' loop/tests/ || true"
    expect: "no output (cases rewritten)"
  - id: inv-b-01
    kind: B
    symbol: "link_one .agents without /skills in full mode"
    command: "rg -n 'link_one \".agents\"' bin/hub-link || true"
    expect: "no output or only .agents/skills variant"
  - id: inv-c-01
    kind: C
    symbol: "silent skip on mv failure"
    command: "rg -n 'skip\\|silently.*skip\\|if.*mv.*fail' bin/hub-link || true"
    expect: "no silent skip"
  - id: inv-i-01
    kind: I
    symbol: ".agents/skills as SoT in runtime docs"
    command: "rg -rn '\\.agents/skills' harness/README.md bin/hub-link | grep -v 'symlink\\|shell\\|→' || true"
    expect: "no SoT wording; only shell/symlink context"

