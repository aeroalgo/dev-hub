  code_surface: shell
  impl:
    - tdd
    - python-testing-patterns
    - modern-python
    - python-anti-patterns

checkpoints:
  - id: cp1
    criterion: Kind A — все 4 real dirs replaced by symlinks; no obsolete test asserts on real SoT
    verify: |
      test -L .claude/commands && test -L .claude/skills && test -L .claude/rules && test -L .agents/skills && echo "ALL SYMLINKS OK"
  - id: cp2
    criterion: Kind B — hub-link full не содержит link_one .agents как целого; docs обновлены (s08)
    verify: "rg 'link_one \".agents\"' bin/hub-link || echo 'OK: no whole-agents link'"
  - id: cp3
    criterion: Kind C — нет dual-path fallback; alongside conflict → exit 2
    verify: "rg 'skip\\|dual.*copy\\|both.*claude.*harness' bin/hub-link || echo 'OK: no fallback'"
  - id: cp4
    criterion: Kind I — runtime docs/instructions используют harness paths; нет .agents/skills SoT wording
    verify: "rg '\\.agents/skills' harness/README.md bin/hub-link | grep -v 'symlink\\|shell\\|→' || echo 'OK'"
  - id: cp5
    criterion: Suite green после всех purge deletes
    verify: "bin/pytest loop/tests/test_harness_paths.py loop/tests/test_hub_link_harness.py loop/tests/test_hub_link_alongside.py -q --tb=line 2>&1 | tail -5"

verify: []
tdd:
