goal: |
  Реализовать сервис проекции BoardProjectionService, сайдкар маппинга .loop/board-epic-map.yaml,
  защиту от смены провайдера (provider mismatch fail-closed до любых сетевых запросов),
  lazy create карточки при первом появлении эпика, поиск только по external_id (без поиска по названию),
  и soft-fail поведение (логирование в stderr и фиксацию sync_error в маппинге без отката перехода loop).

