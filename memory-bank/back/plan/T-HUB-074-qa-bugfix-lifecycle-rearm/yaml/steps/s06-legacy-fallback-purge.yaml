  - "confirm Independent Test: fail yaml cannot DONE; re-QA new yaml; rg finish_reflect 0"

sunset_scope:
  required: true
  boundary_id: qa-bugfix-lifecycle
  new_sot: finish_qa BUGFIX-on-fail + parse_qa_verdict fail-closed + qa_fail_blocks_handoff/advance
  allow_read:
    - "loop/mb_finish/**"
    - "loop/roadmap_queue.py"
    - "harness/hooks/epic/**"
    - "harness/hooks/epic_resolve.py"
    - "harness/hooks/tests/test_mb_finish_*.py"
    - "loop/tests/test_mb_finish_transaction.py"
    - "loop/tests/test_qa_finish_handoff.py"
    - "loop/tests/test_roadmap_queue.py"
    - "loop/tests/test_finish_bugfix.py"
  kind_hint:
    - A
    - B
    - C
    - I

sunset_inventory:
  - symbol: finish_reflect
    kind: A
    replacement: finish_qa
    policy: delete in-epic
    rg_scope: loop/ harness/hooks
    expect: zero prod defs/imports/calls (exclude T-HUB-060 historical)
  - symbol: find_reflection_artifact
    kind: A
    replacement: gone
    policy: delete in-epic
    rg_scope: loop/ harness/hooks
    expect: zero prod defs/imports
  - symbol: tests importing finish_reflect
    kind: A
    replacement: finish_qa tests
    policy: delete in-epic
    rg_scope: harness/hooks/tests loop/tests
    expect: no live import finish_reflect
  - symbol: DONE on qa fail
    kind: A
    replacement: BUGFIX
    policy: delete in-epic
    rg_scope: loop/mb_finish/impl.py
    expect: fail/blocked never next_mode DONE
  - symbol: parse_qa_verdict if qa_art else pass
    kind: A
    replacement: missing ≠ pass
    policy: delete in-epic
    rg_scope: loop/mb_finish/impl.py
    expect: no else "pass"
  - symbol: roadmap_advance mark-done on qa fail
    kind: A
    replacement: qa_fail_blocks_advance
    policy: delete in-epic
    rg_scope: loop/roadmap_queue.py
    expect: advance denied when latest qa fail
  - symbol: mb-finish reflect subcommand / MCP
    kind: B
    replacement: removed
    policy: delete in-epic
    rg_scope: loop/mb_finish harness/hooks/epic_resolve.py
    expect: zero reflect CLI/MCP
  - symbol: finish_handoff DONE despite fail yaml
    kind: C
    replacement: qa_fail_blocks_handoff
    policy: delete in-epic
    rg_scope: loop/mb_finish/impl.py
    expect: ok False on DONE+fail yaml
  - symbol: ImportError catch continue
    kind: C
    replacement: purge symbol
    policy: delete in-epic
    rg_scope: loop/mb_finish harness/hooks/epic
    expect: no catch-continue on missing reflect
  - symbol: ALLOW_QA_FAIL_DONE
    kind: C
    replacement: delete in-epic
    policy: delete in-epic
    rg_scope: loop/ harness/hooks
    expect: zero matches
  - symbol: QA FINISH → REFLECT Python comments
    kind: I
    replacement: BUGFIX/DONE
    policy: delete in-epic
    rg_scope: loop/mb_finish harness/hooks/epic
    expect: zero QA→REFLECT instructions in Python finish_*
  - symbol: bugfix.md 1942 passed as verdict SoT
    kind: I
    replacement: parse_qa_verdict yaml enum
    policy: delete in-epic
    rg_scope: loop/mb_finish harness/hooks/epic
    expect: verdict SoT is qa yaml only

grep_control:
  - id: inv-a-reflect
    kind: A
    symbol: finish_reflect
    command: "! rg -n 'def finish_reflect|from .* import finish_reflect|finish_reflect\\(' loop/ harness/hooks --glob '*.py' --glob '!**/T-HUB-060/**'"
  - id: inv-a-find
    kind: A
    symbol: find_reflection_artifact
    command: "! rg -n 'find_reflection_artifact' loop/ harness/hooks --glob '*.py' --glob '!**/T-HUB-060/**'"
  - id: inv-a-done-fail
    kind: A
    symbol: DONE on qa fail
    command: "rg -n 'next_mode = \"DONE\"|EPIC_DONE' loop/mb_finish/impl.py"
  - id: inv-a-else-pass
    kind: A
    symbol: else pass
    command: "! rg -n 'if qa_art else \"pass\"' loop/mb_finish/impl.py"
  - id: inv-a-advance
    kind: A
    symbol: qa_fail_blocks_advance
    command: "rg -n 'qa_fail_blocks_advance' loop/roadmap_queue.py"
  - id: inv-b-cli
    kind: B
    symbol: mb-finish reflect
    command: "! rg -n 'finish_reflect|mb-finish reflect' loop/mb_finish harness/hooks/epic_resolve.py"
  - id: inv-c-handoff
    kind: C
    symbol: qa_fail_blocks_handoff
    command: "rg -n 'qa_fail_blocks_handoff' loop/mb_finish/impl.py"
  - id: inv-c-flag
    kind: C
    symbol: ALLOW_QA_FAIL_DONE
    command: "! rg -n 'ALLOW_QA_FAIL_DONE' loop/ harness/hooks"
  - id: inv-i-comments
    kind: I
    symbol: QA → REFLECT comments
    command: "! rg -n 'next QA = REFLECT|QA FINISH.*REFLECT|next_mode.*REFLECT' loop/mb_finish harness/hooks/epic --glob '*.py'"

deletes:
  - "leftover finish_reflect / find_reflection_artifact prod callers"
  - "leftover else \"pass\" / DONE-on-fail / ALLOW_QA_FAIL_DONE"
  - "leftover finish_handoff DONE despite fail yaml"
  - "leftover Kind I QA→REFLECT comments in Python finish_*"
  - "leftover tests importing finish_reflect or asserting DONE-on-fail success"

out_of_scope:
