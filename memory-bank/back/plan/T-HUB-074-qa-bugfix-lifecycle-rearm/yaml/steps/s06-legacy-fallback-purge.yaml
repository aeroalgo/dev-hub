goal: |
  Финальный cutover purge: удалить весь остаток plan Replacement A+B+C+I.
  Нулевые prod-callers по finish_reflect, find_reflection_artifact, DONE-on-fail,
  else-pass missing verdict, finish_handoff DONE despite fail yaml, ALLOW_QA_FAIL_DONE,
  Kind I QA→REFLECT comments, mb-finish reflect entrypoint. Obsolete tests on
  reflect import / DONE-as-success-on-fail delete or rewrite. Suite green without
  restore legacy. Independent Test PASS: fail yaml cannot DONE; re-QA needs new yaml;
  rg finish_reflect 0. Канон: workflow-legacy-fallback-cleanup §2.2–2.4.

