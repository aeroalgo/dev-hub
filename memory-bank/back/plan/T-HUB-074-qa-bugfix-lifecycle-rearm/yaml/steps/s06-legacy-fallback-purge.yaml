checkpoints:
  - id: cp1
    criterion: |
      Kind A — finish_reflect / find_reflection_artifact gone; else pass gone;
      fail never DONE; qa_fail_blocks_advance present. rg per grep_control A rows.
    verify: "! rg -n 'def finish_reflect|find_reflection_artifact|if qa_art else \"pass\"|ALLOW_QA_FAIL_DONE' loop/ harness/hooks --glob '*.py' --glob '!**/T-HUB-060/**'"
  - id: cp2
    criterion: Kind B — no mb-finish reflect CLI/MCP
    verify: "! rg -n 'finish_reflect|mb-finish reflect' loop/mb_finish harness/hooks/epic_resolve.py"
  - id: cp3
    criterion: Kind C — qa_fail_blocks_handoff live; no ImportError catch-continue; no ALLOW_QA_FAIL_DONE
    verify: "rg -n 'qa_fail_blocks_handoff' loop/mb_finish/impl.py && ! rg -n 'ALLOW_QA_FAIL_DONE' loop/mb_finish/impl.py loop/roadmap_queue.py"
  - id: cp4
    criterion: Kind I — 0 hits QA FINISH → REFLECT in Python finish_*; verdict SoT is yaml
    verify: "! rg -n 'next QA = REFLECT|QA FINISH.*REFLECT' loop/mb_finish harness/hooks/epic --glob '*.py'"
  - id: cp5
    criterion: Obsolete tests deleted/rewritten; targeted pytest green without restore reflect/DONE-on-fail
    verify: "bin/pytest harness/hooks/tests/test_mb_finish_qa.py harness/hooks/tests/test_mb_finish_handoff.py loop/tests/test_qa_finish_handoff.py loop/tests/test_mb_finish_transaction.py loop/tests/test_finish_bugfix.py -q --tb=line"
  - id: cp6
    criterion: Independent Test PASS — fail yaml cannot DONE; re-QA new yaml; rg finish_reflect 0
    verify: "bin/pytest harness/hooks/tests/test_mb_finish_qa.py harness/hooks/tests/test_mb_finish_handoff.py -q --tb=line -k 'fail or artifact or handoff or BUGFIX'"

verify:
  - "! rg -n 'def finish_reflect|if qa_art else \"pass\"' loop/ harness/hooks --glob '*.py'"
  - "bin/pytest harness/hooks/tests/test_mb_finish_qa.py harness/hooks/tests/test_mb_finish_handoff.py -q --tb=line"
tdd:
  - "purge leftover; keep s01–s05 tests green without restore DONE-on-fail or finish_reflect"
