sunset_inventory:
  - symbol: IncidentTracker.clear_open_on_start
    kind: A
    replacement: operator CLI incident-clear-open
    policy: delete in-epic
    rg_scope: loop/
    expect: zero prod callers; no symbol in class
  - symbol: loop/tests/test_runner_orchestrator.py::clear_open_on_start
    kind: A
    replacement: test_orchestrator_preserves_open_incidents_on_start
    policy: delete in-epic
    rg_scope: loop/tests/
    expect: zero mock expectations on clear_open_on_start
  - symbol: loop restart clears incidents behavior
    kind: B
    replacement: operator CLI incident-clear-open
    policy: delete in-epic
    rg_scope: loop/
    expect: zero implicit auto-clear entrypoints
  - symbol: except Exception return ok/cleared_count 0 auto-clear swallow
    kind: C
    replacement: fail-closed operator error handling
    policy: delete in-epic
    rg_scope: loop/runner/orchestrator.py
    expect: zero auto-clear try/except swallow blocks
  - symbol: loop process start auto-clear instructions
    kind: I
    replacement: explicit operator recovery instructions
    policy: delete in-epic
    rg_scope: loop/
    expect: zero auto-clear instruction matches

