    command: 'rg -n "cleared = self.incident_tracker.clear_open_on_start" loop/ || true'
    expect: no output
  - id: inv-c-01
    kind: C
    symbol: auto-clear error swallow
    command: 'rg -n "IncidentTracker" loop/runner/orchestrator.py -A 25 | rg "clear_open_on_start" || true'
    expect: no output
  - id: inv-i-01
    kind: I
    symbol: loop process start
    command: 'rg -n "Resolve all open incidents \(loop process start\)" loop/ || true'
    expect: no output

