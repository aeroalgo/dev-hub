goal: |
  Реализовать три публичные функции в `loop/workflow/registry.py`:
  `load_registry(hub_root)` — yaml → WorkflowPackRegistry (pydantic validate),
  `get_pack(registry, id)` — None если не найден,
  `resolve_workflow_pack(cwd)` — env WORKFLOW_PACK → project.yaml workflow_pack → default.
  Loader кешируется (functools.cache или аналог) (FR-004, US-001, US-002).

