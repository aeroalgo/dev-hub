checkpoints:
  - id: cp1
    criterion: rg audit — нет frozenset pack ids в _lib.py (кроме ROLE_PREFIXES)
    verify: "rg 'frozenset' harness/hooks/_lib.py | rg -v 'ROLE_PREFIXES' | wc -l | python3 -c \"import sys; n=int(sys.stdin.read()); assert n==0, f'{n} pack frozensets found'\""
  - id: cp2
    criterion: loop.sh не содержит if/else с hardcoded pack id strings
    verify: "rg 'dev-hub-software|WORKFLOW_PACK.*=.*dev' loop/loop.sh | wc -l | python3 -c \"import sys; n=int(sys.stdin.read()); assert n==0, f'{n} hardcoded pack refs in loop.sh'\""
  - id: cp3
    criterion: instruction prose updated - Kind I rewrite если применимо
    verify: "rg 'захардкожены.*BACK' harness/claude/rules/ || echo 'no legacy prose - ok'"
  - id: cp4
    criterion: rg по 'implicit.*software.*domain' в harness/ пусто
    verify: "rg -i 'implicit.*software.*domain|single.*software.*domain' harness/ || echo 'clean - ok'"

