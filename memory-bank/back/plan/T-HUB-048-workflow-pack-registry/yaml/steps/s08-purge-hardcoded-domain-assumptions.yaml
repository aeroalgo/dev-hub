goal: |
  Вытеснить implicit «single software domain» допущения из кодовой базы и документации:
  1. Code (Kind A): `loop/context_loop.py` / сессионные скрипты — убрать hardcoded
     domain strings если добавились.
  2. Instruction surface (Kind I): session-start prose / harness rules / mainrule.mdc
     — заменить явные «BACK/FRONT/INTEG only» упоминания на «configurable via pack».
  3. Финальный rg audit: нет живых callers старых singleton-паттернов.
  (SC-004, AC−4 — no pack-specific if/else in loop.sh).

plan_contract:
  fr_ids: [SC-004]
  nouns:
    - rg audit implicit domain strings
    - session-start instruction prose
    - harness/claude/rules/ — doc rewrites
    - loop.sh pack-specific branches (AC−4)
    - Replacement/sunset §A + §C from plan
  layout_paths:
    - loop/context_loop.py       # cleanup only if drift found
    - harness/claude/rules/      # instruction rewrites (Kind I)
    - loop/loop.sh               # audit only — no if/else branches per AC−4
  ac_quotes:
    - "SC-004: No hardcoded pack frozenset in _lib (rg audit)"
    - "AC−4: No pack-specific logic in loop.sh if/else branches"
    - "plan §Replacement/sunset A: Implicit single software domain → resolve_workflow_pack() — delete in-epic"
    - "plan §Replacement/sunset C: Any silent default when WORKFLOW_PACK invalid → fail-closed exit 2 — delete in-epic"
  plan_jumps:
    - "memory-bank/back/plan/T-HUB-048-workflow-pack-registry/md/plan.md:218-237"
    - "memory-bank/back/plan/T-HUB-048-workflow-pack-registry/md/plan.md:97-101"

