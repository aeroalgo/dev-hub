grep_control:
  - id: inv-a-01
    kind: A
    symbol: _read_project_yaml_pack
    command: "rg -n '_read_project_yaml_pack' loop/ harness/ --glob '*.py' || true"
    expect: no prod callers; test hits only if rewritten to new contract
  - id: inv-a-02
    kind: A
    symbol: untyped project.yaml pack read
    command: "rg -n 'cwd / \"project.yaml\"|Path\\(.*\\) / \"project.yaml\"|\\.dev-hub\" / \"project.yaml\"' loop/workflow/registry.py || true"
    expect: no output
  - id: inv-a-tests-01
    kind: A
    symbol: obsolete tests writing project.yaml as pack SoT without TM-011 reject
    command: "rg -n '\\(tmp_path / \"project.yaml\"\\)\\.write_text' loop/tests/test_workflow_pack_registry.py loop/tests/test_workflow_pack_video_e2e.py loop/tests/test_cli_tool_gate.py loop/tests/test_mb_finish_pack_write.py || true"
    expect: no output (rewritten to dev-hub.project.yaml or negative detect/reject)
  - id: inv-a-keep-01
    kind: A
    symbol: hub self-test pytest canon
    command: "rg -n 'BIN_PYTEST_PREFIX|bin/pytest' harness/hooks/test_run_canon.py loop/incidents/tier1_verify.py"
    expect: still present (keep n/a)
  - id: inv-b-01
    kind: B
    symbol: live SoT docs for project.yaml
    command: "rg -n 'project.yaml|\\.dev-hub/project.yaml' README.md harness/README.md harness/templates/ || true"
    expect: mentions only as sunset/migration, not as current SoT
  - id: inv-b-02
    kind: B
    symbol: .dev-hub as config directory
    command: "rg -n '\\.dev-hub.*(yaml|config directory|project.yaml)' README.md harness/README.md bin/hub-link || true"
    expect: pointer-only hub-link
  - id: inv-c-01
    kind: C
    symbol: inferred profile
    command: "rg -n 'Cargo.toml|pyproject.toml|package.json' loop/stack_profiles/resolver.py loop/stack_profiles/registry.py"
    expect: no profile inference (lockfile names allowed only inside JS manager policy)
  - id: inv-c-02
    kind: C
    symbol: silent npm/pnpm default
    command: "rg -n 'default.*pnpm|assume.*npm|silent npm' loop/stack_profiles/ || true"
    expect: no silent default manager
  - id: inv-c-03
    kind: C
    symbol: try new except old
    command: "rg -n 'except.*_read_project_yaml|try:.*load_project_manifest' loop/workflow/registry.py loop/stack_profiles/ || true"
    expect: no fallback to old parser
  - id: inv-i-01
    kind: I
    symbol: old location instructions
    command: "rg -n 'Put workflow_pack in project.yaml|config directory .dev-hub' README.md harness/README.md .cursor/ .claude/ || true"
    expect: no old machine-format instructions
  - id: inv-i-02
