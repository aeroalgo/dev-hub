title: "worktree pool — create/destroy git worktrees per sNN parallel session"
next_phase: BACK IMPLEMENT
needs_creative: "no"

goal: |
  Реализовать `loop/parallel/worktree.py` с функциями `create_worktree(epic_id, step_id) -> Path`
  и `destroy_worktree(path: Path)`. create_worktree запускает `git worktree add` во временной
  директории `.claude/worktrees/<epic_id>-<step_id>-<timestamp>`, базируясь на текущем HEAD.
  destroy_worktree выполняет `git worktree remove --force`. Outcome: orchestrator (s04) может
  безопасно создавать и удалять изолированные рабочие деревья для каждого параллельного sNN.

