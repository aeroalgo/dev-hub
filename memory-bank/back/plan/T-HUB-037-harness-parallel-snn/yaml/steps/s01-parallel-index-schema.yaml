goal: |
  Добавить опциональное поле `depends_on: []` в `epic-decompose-index/v1` и Pydantic-модель
  декомпозного индекса. Outcome: `index.yaml` может содержать `depends_on` на каждом шаге;
  существующие индексы без поля проходят валидацию без изменений (backward-compatible).
  Модуль `loop/parallel/wave.py` экспортирует `compute_ready_wave(index_path) -> list[str]` —
  возвращает step_id'ы без зависимостей или с зависимостями статуса done.

