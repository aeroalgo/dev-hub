    symbol: SCHEMA_DECOMPOSE_LEGACY
    command: 'rg -n "SCHEMA_DECOMPOSE_LEGACY" harness/hooks/ || true'
    expect: no output
  - id: inv-c-01
    kind: C
    symbol: swallow pass in plan_path
    command: 'rg -n "except Exception:\\s*pass" loop/roadmap_queue.py || true'
    expect: no output in plan_path / resolve_epic_slug
  - id: inv-i-01
    kind: I
    symbol: falling back to legacy v1
