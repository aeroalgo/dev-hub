    expect: single resolve owner without fallback chains
  - symbol: validate_decompose_yaml
    kind: A
    replacement: harness.hooks.epic_yaml.validate_decompose_full
    policy: delete in-epic
    rg_scope: harness/hooks/
    expect: 0 definitions and calls in prod
  - symbol: SCHEMA_DECOMPOSE_LEGACY / SCHEMA_IMPLEMENT_LEGACY
    kind: A
    replacement: SCHEMA_EPIC_DECOMPOSE / SCHEMA_EPIC_IMPLEMENT
    policy: delete in-epic
    rg_scope: harness/hooks/epic_yaml.py
    expect: legacy constants removed
  - symbol: arm decompose-
    kind: B
    replacement: layout v2 arm paths
    policy: delete in-epic
    rg_scope: loop/ harness/hooks/
    expect: no arm support for deprecated decompose- prefix
  - symbol: except Exception pass in plan_path
    kind: C
    replacement: fail-closed layout resolve
    policy: delete in-epic
    rg_scope: loop/roadmap_queue.py
    expect: zero silent swallow passes
  - symbol: falling back to legacy v1 paths
    kind: I
    replacement: layout v2 canon
    policy: delete in-epic
    rg_scope: harness/hooks/
    expect: zero occurrences of v1 fallback docstring

