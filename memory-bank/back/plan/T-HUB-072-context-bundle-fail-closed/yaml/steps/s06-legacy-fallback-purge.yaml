checkpoints:
  - id: cp1
    criterion: |
      Kind A — rg per inventory: no ok_status=True leftover; classifier paths empty content;
      SessionStart no plan_section; obsolete inline-plan asserts gone.
    verify: |
      rg -n 'ok_status = True' loop/mb_load/session.py || true
      rg -n 'load_plan_section|plan_section=' harness/hooks/epic/core.py harness/hooks/session-start.py
  - id: cp2
    criterion: Kind B — same SessionStart + load_session; no second bundle service package
    verify: |
      test -f harness/hooks/session-start.py
      test -f loop/mb_load/session.py
      rg -n 'class ContextBundleService' loop/ harness/hooks/ || true
  - id: cp3
    criterion: "Kind C — no Warning load_session exception; no inline-plan-if-small dual path"
    verify: |
      rg -n 'Warning: load_session exception' harness/hooks/epic/core.py harness/hooks/session-start.py || true
      rg -n 'inline plan if|if < 256' loop/mb_load/session.py harness/hooks/epic/core.py || true
  - id: cp4
    criterion: "Kind I — 0 hits load_now files inlined / always inlined in files listed"
    verify: |
      rg -n 'load_now files inlined|always inlined' loop/mb_load/session.py harness/hooks/epic/core.py loop/tests/test_mb_load_session.py harness/hooks/tests/test_session_start_inject.py || true
  - id: cp5
    criterion: Obsolete inline-plan success tests purged; targeted pytest green without restore
    verify: "bin/pytest loop/tests/test_mb_load_session.py harness/hooks/tests/test_session_start_inject.py -q --tb=line"
  - id: cp6
    criterion: Targeted + epic regression suite green после deletes (без возврата sunset-кода)
    verify: "bin/pytest loop/tests/test_mb_load_session.py harness/hooks/tests/test_session_start_inject.py -q --tb=line"

verify:
  - "rg -n 'ok_status = True' loop/mb_load/session.py || true"
  - "bin/pytest loop/tests/test_mb_load_session.py harness/hooks/tests/test_session_start_inject.py -q --tb=line"
tdd:
