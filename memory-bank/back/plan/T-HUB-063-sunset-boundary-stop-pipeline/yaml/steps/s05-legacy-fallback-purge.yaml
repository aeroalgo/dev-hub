sunset_inventory:
  - symbol: BOUNDARY_REGISTRY without SCHEMA_LOOP_SUNSET_INVENTORY
    kind: A
    replacement: BOUNDARY_REGISTRY[SCHEMA_LOOP_SUNSET_INVENTORY] = SunsetReport
    policy: delete in-epic
    rg_scope: loop/schemas/boundary_registry.py loop/tests/test_boundary_registry.py
    expect: sunset id present; no exact-len==4
  - symbol: harness/hooks/subagent-stop.py ignore sunset-inventory
    kind: A
    replacement: dedicated sunset branch + validate_boundary
    policy: delete in-epic
    rg_scope: harness/hooks/subagent-stop.py
    expect: sunset-inventory branch exists; not fall-through-only
  - symbol: loop/tests asserting schema_unknown for loop-sunset-inventory/v1
    kind: A
    replacement: tests on known id / valid:true
    policy: delete in-epic
    rg_scope: loop/tests/ harness/hooks/tests/
    expect: case absent or rewritten
  - symbol: validate-boundary unknown for sunset
    kind: B
    replacement: known --schema-id loop-sunset-inventory/v1
    policy: delete in-epic
    rg_scope: harness/hooks/epic_resolve.py loop/tests/test_validate_boundary.py
    expect: CLI accepts canonical id
  - symbol: skip sunset because not verify
    kind: C
    replacement: validate anyway
    policy: delete in-epic
    rg_scope: harness/hooks/subagent-stop.py
    expect: zero skip/search-agent bypass for sunset-inventory
  - symbol: swallow persist exception
    kind: C
    replacement: raise/NEED_HUMAN
    policy: delete in-epic
    rg_scope: harness/hooks/subagent-stop.py harness/hooks/_lib.py
    expect: persist errors fail-closed
  - symbol: prompt «schema validated» while registry/hook missing
    kind: I
    replacement: truthful fence → registry → stop pipeline
    policy: delete in-epic
    rg_scope: harness/agents/sunset-inventory.md .claude/instructions/spawn-hard.md
    expect: schema_id matches registry; no skip-stop instruction
  - symbol: audit 08 matrix currently no
    kind: I
    replacement: living pytest row; keep historical audit file
    policy: keep
    rg_scope: memory-bank/audit/workflow-loop-20260905/08-test-and-evidence-matrix.md
    expect: historical file may still say currently no; living test encodes yes

