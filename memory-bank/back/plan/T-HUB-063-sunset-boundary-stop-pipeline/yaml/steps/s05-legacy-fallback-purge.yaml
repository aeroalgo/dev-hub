# grep_control (HARD) — executable rg per sunset_inventory row; FINISH evidence обязана.
# Canonical checks: no schema_unknown on loop-sunset-inventory/v1; no skip-path;
# persist errors not swallowed; prompt schema_id matches registry (no drift).
grep_control:
  - id: inv-a-01
    kind: A
    symbol: BOUNDARY_REGISTRY without sunset
    command: 'rg -n "SCHEMA_LOOP_SUNSET_INVENTORY" loop/schemas/boundary_registry.py'
    expect: ≥1 hit; registry maps sunset model
  - id: inv-a-02
    kind: A
    symbol: stop ignore sunset
    command: 'rg -n "sunset-inventory" harness/hooks/subagent-stop.py'
    expect: branch present (not comments-only)
  - id: inv-a-tests-01
    kind: A
    symbol: tests expecting unknown for canonical sunset
    command: 'rg -n "loop-sunset-inventory/v1" loop/tests/ harness/hooks/tests/ | rg -n "schema_unknown|unknown_schema" || true'
    expect: no output tying canonical id to unknown
  - id: inv-a-tests-02
    kind: A
    symbol: exact four schemas leftover
    command: 'rg -n "len\\(BOUNDARY_REGISTRY\\) == 4" loop/tests/ || true'
    expect: no output
  - id: inv-b-01
    kind: B
    symbol: validate-boundary unknown for sunset
    command: 'rg -n "loop-sunset-inventory/v1" loop/tests/test_validate_boundary.py loop/tests/test_boundary_registry.py'
    expect: positive known-id tests exist
  - id: inv-c-01
    kind: C
    symbol: skip sunset because not verify
    command: 'rg -n "not verify|search agent|skip sunset" harness/hooks/subagent-stop.py || true'
    expect: no skip-bypass for sunset
  - id: inv-c-02
    kind: C
    symbol: swallow persist exception
    command: 'rg -n "except.*pass|except OSError" harness/hooks/subagent-stop.py || true'
    expect: persist errors not swallowed as success
  - id: inv-i-01
    kind: I
    symbol: prompt schema drift
    command: 'rg -n "loop-sunset-inventory/v1" harness/agents/sunset-inventory.md'
    expect: schema present and matches registry
  - id: inv-i-02
    kind: I
    symbol: skip-stop instruction
    command: 'rg -n "schema validated" harness/agents/sunset-inventory.md .claude/instructions/spawn-hard.md || true'
    expect: no claim of validation without stop pipeline

skills:
  code_surface: test
  impl:
    - .agents/skills/tdd/SKILL.md
    - .agents/skills/python-testing-patterns/SKILL.md
    - .agents/skills/modern-python/SKILL.md
    - .agents/skills/python-anti-patterns/SKILL.md

checkpoints:
  - id: cp1
    criterion: |
      Kind A grep_control inv-a-01, inv-a-02, inv-a-tests-01, inv-a-tests-02:
      registry has SCHEMA_LOOP_SUNSET_INVENTORY; stop branch exists;
      0 leftover tests asserting schema_unknown / exact-4 on canonical sunset id.
    verify: |
      rg -n "SCHEMA_LOOP_SUNSET_INVENTORY" loop/schemas/boundary_registry.py
      rg -n "sunset-inventory" harness/hooks/subagent-stop.py
      rg -n "loop-sunset-inventory/v1" loop/tests/ harness/hooks/tests/ | rg -n "schema_unknown|unknown_schema" || true
      rg -n "len\\(BOUNDARY_REGISTRY\\) == 4" loop/tests/ || true
      bin/pytest loop/tests/test_boundary_registry.py loop/tests/test_validate_boundary.py -q --tb=line -k sunset
  - id: cp2
    criterion: Kind B grep_control inv-b-01 — CLI/tests known id loop-sunset-inventory/v1 (not unknown-as-success)
    verify: "rg -n \"loop-sunset-inventory/v1\" loop/tests/test_validate_boundary.py loop/tests/test_boundary_registry.py"
  - id: cp3
    criterion: |
      Kind C+I grep_control inv-c-01, inv-c-02, inv-i-01, inv-i-02:
      no skip-not-verify; persist errors not swallowed; prompt schema_id matches registry; no skip-stop instruction.
    verify: |
      rg -n "not verify|search agent|skip sunset" harness/hooks/subagent-stop.py || true
      rg -n "except.*pass|except OSError" harness/hooks/subagent-stop.py || true
      rg -n "loop-sunset-inventory/v1" harness/agents/sunset-inventory.md
      rg -n "schema validated" harness/agents/sunset-inventory.md .claude/instructions/spawn-hard.md || true
      bin/pytest loop/tests/test_sunset_kind_i.py -q --tb=line
  - id: cp4
    criterion: Obsolete unknown-id/exact-4 tests gone or rewritten; targeted green without restore (inv-a-tests-01/02)
    verify: "rg -n \"len\\(BOUNDARY_REGISTRY\\) == 4\" loop/tests/ || true; bin/pytest loop/tests/test_boundary_registry.py loop/tests/test_validate_boundary.py loop/tests/test_sunset_inventory_schema.py loop/tests/test_subagent_stop_sunset.py loop/tests/test_sunset_kind_i.py -q --tb=line"

