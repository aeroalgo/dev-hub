    kind: A
    replacement: "DshAdapter.analyze_log (s04)"
    policy: delete in-epic
    rg_scope: "loop/ harness/"
    expect: zero prod callers
  - symbol: "loop/runtime_adapters/dsh.py::detect_dsh_model_mismatch"
    kind: A
    replacement: "DshAdapter.analyze_log (s04)"
    policy: delete in-epic
