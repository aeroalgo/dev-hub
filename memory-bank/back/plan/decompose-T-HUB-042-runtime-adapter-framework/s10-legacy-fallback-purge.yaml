    kind: A
    symbol: normalize_dsh_log
    command: "rg -n 'normalize_dsh_log' loop/ harness/ -g '*.py' | rg -v 'test_|archive|deprecated'"
    expect: no output
  - id: inv-a-02
    kind: A
    symbol: detect_dsh_model_mismatch
