  - "loop/runtime_adapters/dsh.py::detect_dsh_model_mismatch (standalone, callers=0)"
  - "loop/runtime_adapters/dsh.py::build_dsh_command (standalone, callers=0)"
  - "loop/runtime_adapters/dsh.py::build_dsh_command_from_file (standalone, callers=0)"
  - "loop/runtime_adapters/common.py — re-export normalize/detect lines"

