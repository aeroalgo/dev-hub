goal: |
  Финальный cutover purge: удалить standalone dsh.py functions (normalize_dsh_log,
  detect_dsh_model_mismatch, build_dsh_command, build_dsh_command_from_file — если callers=0),
  re-export заглушки в common.py, остатки frozenset _RUNTIME_MODES если остались.
  Полный inventory scan: нулевые prod-callers по каждой строке sunset_inventory.
  Suite green после deletes.

context:
  consumes:
    - "plan §Replacement / sunset (таблицы A/B/C)"
    - "decompose index §Replacement cleanup"
    - "loop/runtime_adapters/dsh.py standalone functions (as-built, callers via s04 DshAdapter)"
    - "loop/runtime_adapters/common.py re-export (s07, purge re-export here)"
    - "harness/hooks/_lib.py — verify _RUNTIME_MODES absent (s06 cutover)"
  produces:
    - "loop/runtime_adapters/dsh.py (изменён: standalone functions removed)"
    - "loop/runtime_adapters/common.py (изменён: re-export stubs removed)"
    - "evidence rg/inventory in implement shard"
  plan_refs:
    - "FR-012: unit tests registry load, invalid runtime, claude+dsh command builders"
    - "US-004: zero regression on EPIC_RUNTIME=dsh after standalone purge"
    - "SC-001: EPIC_RUNTIME unset → claude (regression after purge)"
    - "SC-002: EPIC_RUNTIME=foo → invalid_runtime_config (regression after purge)"
  files:
    - loop/runtime_adapters/dsh.py
    - loop/runtime_adapters/common.py

as_built:
  - "loop/runtime_adapters/dsh.py — normalize_dsh_log, detect_dsh_model_mismatch, build_dsh_command, build_dsh_command_from_file standalone public functions"
  - "loop/runtime_adapters/common.py — re-export stubs for backward compat (s07)"
  - "harness/hooks/_lib.py — _RUNTIME_MODES should be absent (s06); verify here"

delta:
