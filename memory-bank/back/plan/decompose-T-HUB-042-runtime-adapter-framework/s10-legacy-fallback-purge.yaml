  - "edit loop/runtime_adapters/common.py — remove re-export stubs normalize_dsh_log/detect_dsh_model_mismatch; DshAdapter uses internals directly"
  - "verify harness/hooks/_lib.py — _RUNTIME_MODES absent (safety net from s06)"

deletes:
