grep_control:
  - id: inv-a-01
    kind: A
    symbol: loop/roadmap_queue.py ROLE_PLAN_DIRS
    command: 'python3 -c "import subprocess, sys; res = subprocess.run([\"rg\", \"-n\", \"ROLE_PLAN_DIRS\", \"loop/roadmap_queue.py\"], capture_output=True, text=True); sys.exit(0 if not res.stdout.strip() else 1)"'
    expect: zero occurrences of ROLE_PLAN_DIRS
  - id: inv-a-02
    kind: A
    symbol: loop/runner/orchestrator.py loop.epic_paths
    command: 'python3 -c "import subprocess, sys; res = subprocess.run([\"rg\", \"-n\", \"from loop.epic_paths\", \"loop/runner/orchestrator.py\"], capture_output=True, text=True); sys.exit(0 if not res.stdout.strip() else 1)"'
    expect: zero occurrences of loop.epic_paths
  - id: inv-b-01
    kind: B
    symbol: loop/roadmap_queue.py md map fail-closed
    command: 'python3 -c "import pytest; from loop import roadmap_queue; pytest.raises(ValueError, roadmap_queue.queue_rel_from_roadmap, \"memory-bank/back/plan/roadmap-foo-epics.md\")"'
    expect: raises ValueError on .md input
  - id: inv-c-01
    kind: C
    symbol: test suites on new fail-closed contract
    command: 'bin/pytest loop/tests/test_roadmap_legacy_source_characterization.py loop/tests/test_roadmap_queue.py loop/tests/test_dag_v2_characterization.py loop/tests/test_runner_orchestrator.py -q'
    expect: all suites pass
  - id: inv-i-01
    kind: I
    symbol: docstrings clean of plan-dir slug queues
    command: 'python3 -c "import subprocess, sys; res = subprocess.run([\"rg\", \"-n\", \"scan legacy.*plan/roadmap\", \"loop/roadmap_queue.py\"], capture_output=True, text=True); sys.exit(0 if not res.stdout.strip() else 1)"'
    expect: zero matches

