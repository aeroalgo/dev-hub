needs_creative: "no"

goal: |
  Создать `dsh/scripts/install-cc-hooks.sh` — идемпотентный скрипт, который:
  (1) применяет `cc-hooks-bridge.yml` к каждому `epic-*` профилю (копирует патч в $DSH_HOME/patches или inline),
  (2) запускает `pnpm install --ignore-scripts` в каждом установленном профиле,
  (3) поддерживает `--dry-run` и `--link` аналогично `install-profiles.sh`,
  (4) документирует headless (CI) режим.
  Outcome: один вызов скрипта корректно монтирует bridge во все профили; FR-003 закрыт.

context:
  consumes:
    - dsh/scripts/install-profiles.sh  # паттерн —link/--dry-run, DSH_HOME logic
    - dsh/patches/cc-hooks-bridge.yml  # s02 output — fragment для копирования
    - dsh/profiles/epic-*/package.json # обновлены в s02 с новой зависимостью
  produces:
    - dsh/scripts/install-cc-hooks.sh  # новый скрипт
    - dsh/README.md                    # добавить §Installation строку про install-cc-hooks.sh
  plan_refs:
    - FR-003  # install script applies to all epic-*
    - NFR-2   # greenfield additive, Claude path zero-change
  files:
    - dsh/scripts/install-cc-hooks.sh
    - dsh/README.md

