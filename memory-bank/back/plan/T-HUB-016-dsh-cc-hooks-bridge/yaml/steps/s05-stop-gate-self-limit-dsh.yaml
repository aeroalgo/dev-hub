goal: |
  Добавить в `stop-gate.py` минимальный self-limit счётчик: при `EPIC_RUNTIME=dsh` (или `DSH_HOOKS_BRIDGE=1`)
  и ситуации, когда `stop_hook_active` всегда `false` (DSH не передаёт поле), stop-gate не уходит в бесконечный
  `block→continue`-цикл; после N consecutive блоков без прогресса epic fingerprint — gate разрешает stop
  с диагностическим сообщением.
  Outcome: SC-003 + AC+US-001 закрыты; нет silent infinite loop под DSH (Зафиксировано в Replacement cleanup).

