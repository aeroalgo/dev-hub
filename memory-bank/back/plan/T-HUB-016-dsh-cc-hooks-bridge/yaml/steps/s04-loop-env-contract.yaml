  - "loop/loop.sh EDIT: если DEV_HUB не установлен, export DEV_HUB=$(dirname «hub path») при наличии известного hub"
  - "dsh/README.md §Environment EDIT: добавить строки DSH_HOOKS_BRIDGE (=1 when bridge active) и CLAUDE_PROJECT_DIR (= PROJECT_ROOT) в таблицу env vars"

