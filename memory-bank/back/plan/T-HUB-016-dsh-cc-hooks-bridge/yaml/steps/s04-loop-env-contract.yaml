plan_id: T-HUB-016
title: "Loop env contract — DSH_HOOKS_BRIDGE + CLAUDE_PROJECT_DIR propagation from loop.sh"
next_phase: BACK IMPLEMENT
needs_creative: "no"

goal: |
  Прокинуть из `loop/loop.sh` (или эквивалентного loop entry) переменные окружения:
  `CLAUDE_PROJECT_DIR=$PROJECT_ROOT` и `DSH_HOOKS_BRIDGE=1` при `EPIC_RUNTIME=dsh`;
  обеспечить доступность `DEV_HUB` для hooks, которым нужны hub-пути (product ≠ hub);
  обновить документацию env bridge в `dsh/README.md §Environment`.
  Outcome: bridge plugin получает `projectDir` / `configPath` корректно из env; stop-gate может детектировать DSH среду (FR-007 prereq).

context:
  consumes:
    - loop/loop.sh или loop/context_loop.py  # точка export env vars
    - dsh/README.md §Environment             # существующий список env vars
    - .claude/hooks/_lib.py                  # is_epic_loop_env(), EPIC_RUNTIME, _lib env loading
    - dsh/patches/cc-hooks-bridge.yml        # s02 output — читает CLAUDE_PROJECT_DIR
  produces:
    - loop/loop.sh или loop entry point      # добавить export DSH_HOOKS_BRIDGE=1, CLAUDE_PROJECT_DIR
    - dsh/README.md                          # обновить §Environment таблицу
  plan_refs:
    - FR-004  # CLAUDE_PROJECT_DIR = PROJECT_ROOT; DEV_HUB available
    - FR-007  # stop-gate detect via EPIC_RUNTIME=dsh или DSH_HOOKS_BRIDGE=1
  files:
    - loop/loop.sh  # или loop/context_loop.py — уточнить на IMPLEMENT
    - dsh/README.md

as_built:
  - "loop/loop.sh: существует; экспортирует EPIC_LOOP=1, PROJECT_ROOT, EPIC_RUNTIME; НЕТ DSH_HOOKS_BRIDGE, НЕТ CLAUDE_PROJECT_DIR как явного export"
  - "_lib.py: is_epic_loop_env() → EPIC_LOOP=1; load_epic_config() читает EPIC_RUNTIME из .claude/project.env"
  - "dsh/README.md §Environment: содержит DEEPSEEK_API_KEY, EPIC_RUNTIME, DSH_BIN; НЕТ CLAUDE_PROJECT_DIR, DSH_HOOKS_BRIDGE"

delta:
