  - "Реализовать функцию advance_replan(cwd, path, epic_id, outcome, evidence) в loop/roadmap_cadence.py"
  - "Обеспечить валидацию последовательного прохождения pair_ids: запись complete или skip со структурированным evidence"
  - "Применять critical-only gap filter: cosmetic gaps не создают работу и не запускают replan или refactor"
  - "Переводить cadence.phase в refactor только после того, как все эпики из pair_ids перешли в терминальный статус"
  - "Блокировать переход в refactor при наличии незавершённых pair_ids (fail-closed)"
  - "Добавить юнит-тесты в loop/tests/test_roadmap_cadence.py для проверки advance_replan, валидации skip-evidence и перехода в refactor"

