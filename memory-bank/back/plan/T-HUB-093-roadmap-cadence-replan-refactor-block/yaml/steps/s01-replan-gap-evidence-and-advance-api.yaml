needs_creative: "no"

goal: |
  Реализовать типизированную модель доказательств gap-анализа (ReplanEvidence/ReplanSkipRecord)
  и API advance_replan в loop/roadmap_cadence.py для последовательной обработки каждого
  эпика в pair_ids (завершение или пропуск со структурированным evidence) и перехода в фазу refactor.
  Gap-фильтр учитывает только critical gaps: cosmetic gaps не создают replan или refactor work.

plan_contract:
  fr_ids:
    - FR-001
    - FR-002
    - FR-006
    - US-001
    - US-002
  nouns:
    - advance_replan
