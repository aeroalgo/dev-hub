    criterion: |
      Kind A/B — refactor строго запрещён (deny / fail-closed) до завершения всех pair_ids в фазе replan.
    verify: |
      bin/pytest loop/tests/test_roadmap_cadence.py -k test_start_refactor_phase_blocked_in_replan -q
  - id: cp2
    criterion: |
      Kind I — правила воркфлоу строго запрещают sliding window и перенос незакрытых шагов (rg проверка).
    verify: |
      bin/pytest loop/tests/test_roadmap_cadence.py -k test_rules_anti_carry_policy -q
  - id: cp3
    criterion: |
      Полный набор тестов cadence и очереди проходит успешно (rg / audit control).
    verify: |
      bin/pytest loop/tests/test_roadmap_cadence.py -k test_cadence_block_e2e_progression -q

verify:
  - "bin/pytest loop/tests/test_roadmap_cadence.py -k fail_closed -q"
  - "bin/pytest loop/tests/test_roadmap_cadence.py loop/tests/test_roadmap_queue.py -q"
