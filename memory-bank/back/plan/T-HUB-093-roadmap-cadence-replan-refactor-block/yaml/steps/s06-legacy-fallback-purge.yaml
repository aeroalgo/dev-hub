as_built:
  - "s01..s05 реализовали gap-evidence API, refactor upsert/noop, arming команд, правила workflow и e2e тесты"

delta:
  - "Провести аудит loop/roadmap_cadence.py и loop/roadmap_queue.py на отсутствие несанкционированных вызовов refactor до закрытия replan"
  - "Убедиться в loop/context_loop.py, что вызов start_refactor_phase строго блокируется при phase == replan"
  - "Проверить отсутствие инструкций о скользящих окнах (sliding window) и переносе шагов (carry-to-neighbor)"
  - "Удалить или обновить устаревшие тесты старого поведения в loop/tests/test_roadmap_cadence.py и loop/tests/test_roadmap_queue.py"

sunset_inventory:
  - symbol: manual-only REPLAN without loop cadence order
    kind: A
    replacement: cadence phase wire (replan -> refactor -> resync)
    policy: delete in-epic
    rg_scope: loop/
    expect: REPLAN integrated into cadence flow
  - symbol: refactor-before-replan execution path
    kind: B
    replacement: fail-closed gate requiring closed replan pair_ids
    policy: delete in-epic
    rg_scope: loop/
    expect: zero bypasses allowing early refactor
  - symbol: window or carry-to-neighbor policy
    kind: I
    replacement: strict anti-carry policy and one-hop per ID rule
    policy: delete in-epic
    rg_scope: .cursor/rules/
    expect: zero references permitting carry-to-neighbor or sliding windows

deletes: []
wire_complete_required: true

out_of_scope:
  - "Resync tail и reconcile from-queue -> follow_up: T-HUB-094-roadmap-cadence-resync-tail"

grep_control:
  - id: inv-a-01
    kind: A
    symbol: manual-only replan
    command: 'rg -n "replan_without_cadence" loop/ || true'
    expect: no standalone uncoordinated replan callers
  - id: inv-b-01
    kind: B
    symbol: early refactor
    command: 'rg -n "allow_refactor_early" loop/ || true'
    expect: zero bypasses allowing early refactor
  - id: inv-i-01
    kind: I
    symbol: carry-to-neighbor instructions
    command: 'rg -n "carry.*neighbor|sliding.*window" .cursor/rules/ || true'
    expect: no permissive carry/window rules

