schema: epic-decompose/v1
role: back
plan_id: T-HUB-018-loop-incident-autopilot
step_id: s07
title: "CLI subcommands — incident-retry + incident-status в context_loop.py"
next_phase: BACK IMPLEMENT
needs_creative: "no"

goal: |
  Разработчик может вручную взаимодействовать с системой tier1-инцидентов через CLI:
  - `loop incident-status` — показывает открытые инциденты из store + их попытки;
  - `loop incident-retry <incident_id>` — сбрасывает счётчик попыток и повторно запускает tier1
    (нужно после ручного фикса окружения).
  context_loop.py расширяется двумя subcommands; права — только для orchestration-eligible инцидентов.

as_built:
  - "context_loop.py имеет subcommands: loop run, loop status, loop halt (T-HUB-016)"
  - "нет subcommand incident-status / incident-retry"
  - "loop/incidents/store.py содержит load_store / list_open_incidents из 017"
delta:
  - "ADD loop/context_loop.py subcommand `incident-status`: читает store, выводит open инциденты (id, code, tier0_attempts, tier1_attempts, created_at, last_updated) в таблицу или JSON (--json flag)"
  - "ADD loop/context_loop.py subcommand `incident-retry <incident_id>`: (1) load incident из store; (2) проверяет is_tier1_eligible; (3) если eligible — сбрасывает tier1_attempts, ставит статус open, сохраняет store; (4) выводит сообщение 'Ready for tier1 retry on next loop iteration'; (5) если not eligible — error и exit 1"
  - "ADD loop/incidents/store.py — функция reset_tier1_attempts(store, incident_id) -> IncidentRecord: обновляет tier1_attempts=0, last_updated=now, status='open'"
  - "ADD loop/tests/test_incidents_cli.py — unit: incident-status пустой store → '0 open incidents'; incident-status с open инцидентом → строка с incident_id; incident-retry eligible → reset + exit 0; incident-retry not eligible → exit 1; incident-retry unknown id → exit 1 with error"
deletes: []
out_of_scope:
  - "tier1 spawn из CLI (только сброс счётчика + loop делает spawn на следующей итерации)"
  - "board status display (soft 015, в s09)"
  - "metrics (s08)"

