    workflow-audit.mdc — УЖЕ содержит constitution ref (найдено при grep:
    "constitution MUST" → CRITICAL); точные строки: "constitution MUST или
    P1 intent" в §Severity и "Intent Inventory" §.
  - workflow-analyze.mdc — НЕ содержит constitution refs (grep вернул пусто)
  - workflow-analyze-core.mdc (shared) — существует
  - >-
    T-HUB-011 decompose: s01..s04 shards существуют, статус шагов неизвестен
    (проверить index.yaml)
  - >-
    T-HUB-012 decompose: s01..s04 shards существуют, статус шагов неизвестен
    (проверить index.yaml)

