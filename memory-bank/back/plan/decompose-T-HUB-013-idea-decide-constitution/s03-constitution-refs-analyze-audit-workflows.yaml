    `rg 'status:' memory-bank/back/plan/decompose-T-HUB-011-analyze-pre-implement/index.yaml`
    `rg 'status:' memory-bank/back/plan/decompose-T-HUB-012-audit-converge/index.yaml`
  - >-
    CASE A (011/012 completed → workflow files финальные): Patch
    workflow-analyze.mdc: добавить paragraph перед/после Intent Inventory:
    «Если `memory-bank/constitution.md` существует — все нарушения MUST =
    CRITICAL автоматически». workflow-audit.mdc уже имеет ref; проверить, что
    ref explicit и не implicit.
  - >-
    CASE B (011/012 pending → workflow files ещё редактируются): CREATE
    `.cursor/rules/shared/constitution-note.md` со stub paragraph с тем же
    содержанием; workflow-analyze ссылается на этот файл. Когда 011/012
    завершатся, их IMPLEMENT шаги сами включат constitution-note ref (или этот
    эпик будет re-implemented, если 011/012 смержены уже при IMPLEMENT этого s03).
  - >-
    В обоих случаях: добавить в workflow-analyze.mdc строку с constitution check.

