delta:
  - 'CREATE memory-bank/constitution.md'
  - 'Заголовок: # [dev-hub] Workflow Constitution'
  - 'Поля: version, date, scope'
  - 'Секция ## MUST (8–12 правил) с MUST-1…MUST-9'
  - 'MUST-1: TDD first — тесты до кода в BACK IMPLEMENT (.venv/bin/pytest)'
  - 'MUST-2: No silent fallback — fail-closed при misconfiguration (не угадывать defaults)'
  - 'MUST-3: FRONT tests parent-only — vitest/playwright только parent агент, никогда subagent'
  - 'MUST-4: Lean load — за сессию каждый workflow file читается ≤1×; re-read только при offset'
  - 'MUST-5: Fail-closed misconfig — если env/config невалиден → ошибка, не дефолт'
  - 'MUST-6: No-guess markers — не угадывать без evidence (CLARIFY или маркер NEED_HUMAN)'
  - 'MUST-7: ONE Handoff per step — ровно один Handoff-блок; дублирующий = FAIL'
  - 'MUST-8: §0.11 integration parity — каждая INTEG feature должна быть wire end-to-end'
  - 'MUST-9: ANALYZE до IMPLEMENT и AUDIT после реализации — authority-проверки по фазам workflow'
  - 'Секция ## SHOULD (2–4 правил)'
  - 'SHOULD-1: Outcome-first titles — step/shard title описывает outcome, не только infra-slug'
  - 'SHOULD-2: Kill is success — killed idea pipeline = зафиксированный rationale, не failure'
  - 'SHOULD-3: rg/import-audit после deletes — не объявлять closed без verify'
  - 'Секция ## Note (product usage): hub-версия — canonical starter для адаптации продуктом'

