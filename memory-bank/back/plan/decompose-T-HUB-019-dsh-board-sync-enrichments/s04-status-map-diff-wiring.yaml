schema: epic-decompose/v1
role: back
plan_id: T-HUB-019-dsh-board-sync-enrichments
step_id: s04
title: "Status mapping: active/blocked→running, PLAN/DECOMPOSE gates→backlog"
next_phase: BACK IMPLEMENT
needs_creative: "no"

goal: |
  Карточки шагов с active/blocked попадают в колонку running (не todo).
  Gate-карточки PLAN/DECOMPOSE/CLARIFY/ANALYZE/ROADMAP попадают в backlog.
  Маппинг вынесен в тестируемые чистые функции.

as_built:
  - "loop/board_sync/diff.py: work_item_card — status='running' only if in_progress; active/blocked → todo (bug)"
  - "loop/board_sync/diff.py: gate_card — status='todo' всегда; backlog не используется"
  - "_PRE_IMPL_PHASES константа отсутствует"

delta:
  - "ADD _PRE_IMPL_PHASES = frozenset({'PLAN','DECOMPOSE','CLARIFY','ANALYZE'}) в diff.py"
  - "ADD status_for_work_item(item: WorkItem) -> str: in_progress|active|blocked→running; иначе→todo"
  - "ADD status_for_gate(item: GateWorkItem) -> str: ROADMAP→backlog; _PRE_IMPL_PHASES→backlog; _POST_PHASES→todo; иначе→todo"
  - "EDIT work_item_card: status=status_for_work_item(item)"
  - "EDIT gate_card: status=status_for_gate(item)"

deletes: []

