  - "test_load_step_body_goal_delta_files"
  - "test_load_step_body_fallback_title_consumes"
  - "test_load_step_body_truncation_4000"
  - "test_load_step_body_missing_returns_none_diagnostic"
  - "test_load_step_body_broken_yaml_returns_none_diagnostic"
  - "test_work_item_card_has_body_from_shard"

