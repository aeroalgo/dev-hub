schema: epic-decompose/v1
role: back
plan_id: T-HUB-019-dsh-board-sync-enrichments
step_id: s02
title: "Step body: shard goal/delta/files → markdown body, WorkItem.shard_rel"
next_phase: BACK IMPLEMENT
needs_creative: "no"

goal: |
  Карточка шага на доске показывает читаемое описание задачи из shard-файла
  (goal, delta, files) вместо пустого description.
  Fail-soft при missing/broken shard — sync batch не прерывается.

as_built:
  - "loop/board_sync/scan_mb.py: WorkItem не имеет shard_rel; _load_steps не читает steps[].file"
  - "loop/board_sync/diff.py: work_item_card вызывает compose_description(None, card) — body пустой"
  - "loop/board_sync/body_loaders.py — не существует"

delta:
  - "ADD shard_rel: str | None = None в WorkItem dataclass"
  - "EDIT scan_mb._load_steps: если шаг имеет поле file: в index → shard_rel = f'{decompose_rel}/{file}'"
  - "ADD loop/board_sync/body_loaders.py с load_step_body(path: Path) -> tuple[str | None, str | None]"
  - "load_step_body: читает shard YAML; собирает body из goal (str) + delta (list→bullets) + files (list→code); fallback title + context.consumes[:3]"
  - "load_step_body: обрезает до 4000 символов с '…'"
  - "load_step_body: missing/broken file → (None, diagnostic_message); не поднимает исключение"
  - "EDIT diff.work_item_card: вычисляет shard_path из item.shard_rel; вызывает load_step_body; description=compose_description(body, card)"
  - "Diagnostic строки из loader добавляются в sync_report (не stdout/exception)"

deletes: []

out_of_scope:
  - "gate/plan body — s03"
  - "status mapping — s04"
  - "HTTP move — s05"

context:
  consumes:
    - "loop/board_sync/scan_mb.py — WorkItem, _load_steps"
    - "loop/board_sync/diff.py — work_item_card"
    - "loop/board_sync/card_model.py — compose_description (s01)"
    - "plan T-HUB-019 FR-003, §Step body loader"
  produces:
    - "loop/board_sync/body_loaders.py (новый)"
    - "loop/board_sync/scan_mb.py (изменён)"
    - "loop/board_sync/diff.py (изменён)"
  plan_refs:
    - "plan-T-HUB-019 FR-003"
    - "plan-T-HUB-019 §Зафиксированные решения: Источник текста step"
  files:
    - "loop/board_sync/body_loaders.py"
    - "loop/board_sync/scan_mb.py"
    - "loop/board_sync/diff.py"
    - "loop/tests/test_board_sync_body_loaders.py"
    - "loop/tests/test_board_sync_scan_mb.py"
    - "loop/tests/test_board_sync_diff.py"

skills:
  code_surface: service
  impl:
    - ".agents/skills/tdd/SKILL.md"
    - ".agents/skills/python-testing-patterns/SKILL.md"
    - ".agents/skills/python-error-handling/SKILL.md"

checkpoints:
  - id: cp1
    criterion: "WorkItem.shard_rel заполняется из index.yaml steps[].file"
    verify: "`.venv/bin/pytest loop/tests/test_board_sync_scan_mb.py -k shard_rel -q --tb=line`"
  - id: cp2
    criterion: "load_step_body happy path: shard с goal+delta+files → markdown body ≤4000"
    verify: "`.venv/bin/pytest loop/tests/test_board_sync_body_loaders.py -k load_step_body -q --tb=line`"
  - id: cp3
    criterion: "load_step_body missing file → (None, diagnostic), не исключение"
    verify: "`.venv/bin/pytest loop/tests/test_board_sync_body_loaders.py -k missing -q --tb=line`"
  - id: cp4
    criterion: "work_item_card description содержит body из shard + footer delimiter"
    verify: "`.venv/bin/pytest loop/tests/test_board_sync_diff.py -k shard_body -q --tb=line`"

verify:
  - "`.venv/bin/pytest loop/tests/test_board_sync_body_loaders.py loop/tests/test_board_sync_scan_mb.py loop/tests/test_board_sync_diff.py -q --tb=line`"

tdd:
