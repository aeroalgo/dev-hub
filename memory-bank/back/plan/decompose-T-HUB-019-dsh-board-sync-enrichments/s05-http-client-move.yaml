schema: epic-decompose/v1
role: back
plan_id: T-HUB-019-dsh-board-sync-enrichments
step_id: s05
title: "HttpHostClient.move after upsert — fail-closed, FakeClient.moves log"
next_phase: BACK IMPLEMENT
needs_creative: "no"

goal: |
  Карточки с status != todo попадают в правильную колонку на board сразу после create/update.
  move(task_id, status) fail-closed при 4xx; ошибка не останавливает sync batch.

as_built:
  - "loop/board_sync/client.py: HttpHostClient не имеет метода move"
  - "loop/board_sync/client.py: BoardClient Protocol не объявляет move"
  - "loop/board_sync/client.py: FakeClient.upsert сохраняет card но moves не отслеживаются"
  - "loop/board_sync/sync.py (или apply_ops): move не вызывается после upsert → карточки застревают в default column"

delta:
  - "ADD move(task_id: str, status: str) -> None в BoardClient Protocol"
  - "ADD HttpHostClient.move: POST /tasks/{task_id}/status {'status': status}; 4xx → BoardClientError; transport error → BoardClientError"
  - "ADD FakeClient.moves: list[tuple[str, str]] = field(default_factory=list); move() → append"
  - "EDIT sync apply_ops: после create/update — если card.status != 'todo' → client.move(card.id, card.status); BoardClientError → append failed_id, continue batch"

