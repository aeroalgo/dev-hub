sunset_inventory:
  - symbol: ok=true after required miss (ok_status = True)
    kind: A
    replacement: derived ok from required completeness
    policy: delete in-epic
    rg_scope: loop/mb_load/session.py loop/tests/test_mb_load_session.py
    expect: required miss cannot return ok true
  - symbol: pack resolve / doctor without per-route exists (keys-only)
    kind: A
    replacement: check_pack_graph exists+declare
    policy: delete in-epic
    rg_scope: loop/doctor/checks/workflow_pack.py loop/workflow/resolve.py loop/workflow/pack_graph.py
    expect: missing workflow file not green
  - symbol: tests asserting ok true with missing_file on required / keys-only green
    kind: A
    replacement: rewrite asserts
    policy: delete in-epic
    rg_scope: loop/tests/ harness/hooks/tests/
    expect: case absent or rewritten
  - symbol: second exists-implementation diverging from 064
    kind: A
    replacement: route_command / shared exists helper
    policy: delete in-epic
    rg_scope: loop/workflow/pack_graph.py loop/doctor/
    expect: compose not fork
  - symbol: doctor exit 0 on unusable pack
    kind: B
    replacement: exit ≠0
    policy: delete in-epic
    rg_scope: loop/doctor/checks/workflow_pack.py loop/context_loop.py
    expect: unusable → nonzero
  - symbol: SessionStart Warning on Exception as success
    kind: C
    replacement: typed CONTEXT_INCOMPLETE halt for required
    policy: delete in-epic
    rg_scope: harness/hooks/epic/core.py harness/hooks/tests/test_session_start_inject.py
    expect: required path not Warning-only success
  - symbol: MCP ok override partial required
    kind: C
    replacement: same derive as core
    policy: delete in-epic
    rg_scope: loop/mb_load/mcp_server.py
    expect: partial required cannot dump ok true
  - symbol: skip video pack because red
    kind: C
    replacement: report red pack
    policy: delete in-epic
    rg_scope: loop/doctor/checks/workflow_pack.py loop/workflow/pack_graph.py
    expect: red pack listed not omitted
  - symbol: docs pack wired / fully wired while doctor red
    kind: I
    replacement: honest doctor green / red
    policy: delete in-epic
    rg_scope: CLAUDE.md workflows
    expect: no fully wired claim without doctor
  - symbol: partial load ok comments
    kind: I
    replacement: required complete
    policy: delete in-epic
    rg_scope: loop/mb_load/ harness/hooks/epic/core.py
    expect: no instruction that partial required is ok

