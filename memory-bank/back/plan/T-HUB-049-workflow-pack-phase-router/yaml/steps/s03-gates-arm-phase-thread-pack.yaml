goal: |
  Прокинуть `pack: WorkflowPack` через `gates_from_phase(phase, pack)` и
  `arm_phase(cwd, epic_id, phase, role, pack=None, **kwargs)` в `harness/hooks/epic/core.py`
  и `loop/epic_transition.py`.
  `gates_from_phase` использует `load_phase_registry(pack, cwd)` вместо дефолтного yaml.
  `arm_phase` при dsh-runtime: `get_phase_config(phase, pack, cwd)` вместо глобального кэша.
  pack резолвится через `full_resolve(cwd)` если не передан явно.
  Outcomes: FR-001, FR-003, US-001, US-003, TM-004.

