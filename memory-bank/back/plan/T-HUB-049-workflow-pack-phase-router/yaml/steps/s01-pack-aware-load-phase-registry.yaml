    - "_PHASE_REGISTRY_CACHE per-pack-id dict"
    - "pack_id → resolve_workflow_pack(cwd).pack.phase_registry path"
    - "fail-closed ValueError when both registry_path and pack_id are None"
  layout_paths:
    - "loop/epic_transition.py"
  ac_quotes:
