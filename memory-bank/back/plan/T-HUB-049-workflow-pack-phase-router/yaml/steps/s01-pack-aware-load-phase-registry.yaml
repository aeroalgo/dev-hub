goal: |
  Расширить `load_phase_registry` в `loop/epic_transition.py` согласно FR-001:
  сигнатура `load_phase_registry(registry_path=None, *, pack_id: str | None = None, cwd=None)`.
  Если `pack_id` set → resolve path через `resolve_workflow_pack(cwd).pack.phase_registry`;
  если `registry_path` set → использовать напрямую; оба None → fail-closed ValueError.
  Отдельный кэш per-pack-id; `_PHASE_REGISTRY_CACHE` конвертируется в dict[str, dict].
  Outcomes: FR-001, TM-001, TM-002 — fail-closed start при missing yaml или unknown phase.

