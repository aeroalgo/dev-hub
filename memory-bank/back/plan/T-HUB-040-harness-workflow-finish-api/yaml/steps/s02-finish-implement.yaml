  - "loop/context_loop.py:886 — вызов _implement_finish_block() inline; не typed"

delta:
  - "CREATE loop/mb_finish/finish_implement.py: finish_implement_step(req: MbFinishRequest) -> MbFinishResult"
  - "  1. validate_finish_integrity(cwd, step_id) — если CRITICAL > 0 → MbFinishResult(ok=False, …)"
  - "  2. _verify_pass_ready_for_step(cwd, step_id) — если not ok → MbFinishResult(ok=False, diagnostic_codes=['verify_pass_required'])"
  - "  3. backup = read_active_context(cwd) (atomic snapshot)"
  - "  4. rendered = render_active_context(meta, load_now, done, handoff) — raises ValueError on shape errors BEFORE any write"
  - "  5. on ValueError: return MbFinishResult(ok=False, diagnostic_codes=['shape_invalid']) — no write"
  - "  6. write rendered to activeContext.md"
  - "  7. result = finalize_step(cwd, step_id, done_summary)"
  - "  8. on finalize failure: restore backup → MbFinishResult(ok=False, diagnostic_codes=['finalize_failed'])"
  - "ADD to harness/hooks/epic_resolve.py: subcommand 'mb-finish' with sub-sub-command 'implement' reading JSON from stdin or args, calls finish_implement_step, prints JSON result, exit 0/1/2"
  - "CREATE harness/hooks/tests/test_mb_finish_implement.py: fixtures with tmp_path epic + decompose + verify sidecar"

deletes:
