    - "loop/schemas/decompose_index.py (s01) — DecomposeStep"
    - ".cursor/templates/decompose/epic-step.yaml — структура context.files, delta, deletes"
  produces:
    - "loop/parallel/overlap.py — file_overlap_check(shard_a: Path, shard_b: Path) -> bool; extract_shard_files(shard: dict) -> frozenset[str]"
  plan_refs:
    - FR-002
    - SC-002
  files:
    - "loop/parallel/overlap.py"

