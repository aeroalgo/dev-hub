schema: epic-decompose/v1
role: back
step_id: s02
plan_id: T-HUB-037-harness-parallel-snn
title: "file overlap checker — fail-closed parallel gate by shard files intersection"
next_phase: BACK IMPLEMENT
needs_creative: "no"

goal: |
  Реализовать `loop/parallel/overlap.py` с функцией `file_overlap_check(shard_a, shard_b) -> bool`.
  Функция загружает два `sNN-*.yaml` шарда (epic-decompose/v1), извлекает `files` из `context.files`
  + пути из `delta` и `deletes`, вычисляет пересечение. Если пересечение непустое — возвращает True
  (parallel запрещён). Outcome: любая попытка параллельного запуска двух шагов с общими файлами
  будет fail-closed ещё до spawn worktree.

