plan_id: T-HUB-037-harness-parallel-snn
title: "parallel orchestrator — opt-in EPIC_PARALLEL_SNN wave spawn + flock index update"
next_phase: BACK IMPLEMENT
needs_creative: "no"

goal: |
  Реализовать `loop/parallel/orchestrator.py` — основной entry point параллельного режима.
  При `EPIC_PARALLEL_SNN=1`: compute_ready_wave → overlap_check пар → create_worktrees для
  каждого шага в wave (max `EPIC_PARALLEL_MAX`, default 2) → spawn subprocess per worktree →
  ждёт завершения всех → destroy_worktrees → обновляет index status через flock.
  При `EPIC_PARALLEL_SNN=0` или отсутствии: возвращает None (sequential fallback).
  Outcome: оператор может запустить `EPIC_PARALLEL_SNN=1 loop.sh` для ускорения independent sNN.

