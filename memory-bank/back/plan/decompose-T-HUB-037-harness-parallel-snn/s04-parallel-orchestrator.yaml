    - "loop/parallel/worktree.py (s03) — create_worktree, destroy_worktree"
    - ".claude/hooks/epic_index.py — flock-based index status update"
  produces:
    - "loop/parallel/orchestrator.py — run_parallel_wave(epic_id, index_path, repo_root) -> ParallelResult | None; ParallelResult(wave, spawned, failed)"
    - "docs/parallel-snn.md — env vars EPIC_PARALLEL_SNN, EPIC_PARALLEL_MAX; merge policy (manual commit-per-sNN)"
