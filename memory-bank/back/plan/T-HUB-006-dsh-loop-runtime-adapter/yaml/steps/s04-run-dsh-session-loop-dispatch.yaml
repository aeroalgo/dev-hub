checkpoints:
  - id: cp1
    criterion: >
      loop.sh компилируется без синтаксических ошибок (bash -n)
    verify: "bash -n loop/loop.sh && echo 'syntax ok'"
  - id: cp2
    criterion: >
      fake_dsh.sh исполняем и записывает argv в файл при вызове
    verify: >
      FAKE_DSH_RECORD_FILE=/tmp/fake_dsh_test.txt bash loop/tests/fixtures/fake_dsh.sh --profile epic-implement "hello" &&
      grep -q 'epic-implement' /tmp/fake_dsh_test.txt && echo 'fake_dsh ok'
  - id: cp3
    criterion: >
      test_run_dsh_session_fails_closed_on_missing_dsh PASS: нет fallback, exit non-zero
    verify: "timeout 300s .venv/bin/pytest loop/tests/test_loop_dsh_dispatch.py::test_run_dsh_session_fails_closed_on_missing_dsh -q --tb=short"
  - id: cp4
    criterion: >
      test_run_agent_session_dispatches_dsh PASS: fake_dsh получает --profile epic-implement
    verify: "timeout 300s .venv/bin/pytest loop/tests/test_loop_dsh_dispatch.py::test_run_agent_session_dispatches_dsh -q --tb=short"

verify:
  - "bash -n loop/loop.sh"
  - "timeout 300s .venv/bin/pytest loop/tests/test_loop_dsh_dispatch.py -q --tb=short"

tdd:
