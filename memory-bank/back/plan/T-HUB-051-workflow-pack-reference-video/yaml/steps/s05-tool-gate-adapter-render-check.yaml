goal: |
  Создать `loop/workflow/tool_gates/` пакет с Protocol `ToolGateAdapter` и `ToolGateContext`/`ToolGateResult` dataclass-ами.
  Создать `workflows/video/tools/render_check.py` — конкретный adapter для render gate:
  проверяет наличие output файла + stat-based duration (ffprobe если доступен, иначе fallback file size > 0).
  JSON stdout contract: `{"ok": bool, "diagnostic_codes": []}`.
  Adapter регистрируется в `workflows/video/manifest.yaml` под `tool_gates: {render: ...}`.
  Outcomes: FR-006, FR-007, TM-001, TM-002, SC-003, AC+2, AC−2.

