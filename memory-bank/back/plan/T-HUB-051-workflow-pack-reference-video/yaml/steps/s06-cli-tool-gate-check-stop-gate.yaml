goal: |
  Добавить CLI субкоманду `epic_resolve.py tool-gate check --gate <id> [--cwd PATH]`:
  - Читает manifest pack через resolve_workflow_pack(cwd)
  - Находит adapter class по tool_gates[gate_id]
  - Вызывает adapter.check(ctx) → ToolGateResult
  - exit 0 если ok=True, exit 1 если ok=False, JSON stdout в обоих случаях
  Интегрировать external_gates в stop-gate FINISH path:
  - При FINISH для фаз с external_gates[] — вызвать tool-gate check для каждого gate id
  - Если любой gate ok=False → блокировать FINISH (стоп-gate deny)
  - AC−1: НЕ hardcoded `if video` — диспатч через phase_registry + Protocol
  Outcomes: FR-008, FR-009, SC-003, AC+2, AC−1, US-002, US-003.

