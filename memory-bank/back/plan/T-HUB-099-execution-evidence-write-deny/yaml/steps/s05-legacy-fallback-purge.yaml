    replacement: "pretool DENY via execution_evidence_write_deny_reason"
    policy: "delete in-epic"
    rg_scope: "harness/hooks/ loop/"
    expect: "zero paths allowing agent write to capability execution sidecars"
  - symbol: "Finish accepting unprovenanced capability evidence"
    kind: A
    replacement: "provenance-aware read and authoritative validation"
    policy: "delete in-epic"
    rg_scope: "harness/hooks/epic_yaml.py loop/stack_profiles/evidence.py"
    expect: "unprovenanced sidecars rejected with capability_evidence_non_authoritative"
  - symbol: "Agent Write tool as capability proof transport"
    kind: B
    replacement: "executor-only check-after write + agent tool deny"
    policy: "delete in-epic"
    rg_scope: "harness/hooks/pretool_policy.py"
    expect: "all agent Write/Edit tool invocations to capability sidecars blocked"
  - symbol: "File exists => evidence OK fallback for capability sidecars"
    kind: C
    replacement: "fail-closed provenance_source verification"
    policy: "delete in-epic"
    rg_scope: "loop/stack_profiles/evidence.py harness/hooks/epic_yaml.py"
    expect: "zero fallback/dual-path acceptance of capability JSON without executor provenance"
  - symbol: "Prompts suggesting manual agent creation of capability JSON"
