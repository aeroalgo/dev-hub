as_built:
  - "s01..s05 реализовали reconcile --from-queue, resync evidence schema, resume gate, reset idle API и документацию"

delta:
  - "Провести sunset inventory audit на отсутствие fallback путей в обход resume gate"
  - "Проверить полное покрытие очереди проверкой reconcile_queue_epics"
  - "Реализовать комплексный E2E тест полного жизненного цикла cadence: 2 features -> replan -> refactor -> resync (HIGH) -> block -> resync -> reset idle -> next feature"

sunset_inventory:
  - symbol: post-hygiene resume without tail check
    kind: A
    replacement: reconcile from-queue mandatory audit before cadence completion
    policy: delete in-epic
    rg_scope: loop/
    expect: zero bypasses allowing cadence finish without tail audit
  - symbol: resume on unmitigated HIGH drift
    kind: B
    replacement: fail-closed resume gate requiring resync evidence
    policy: delete in-epic
    rg_scope: loop/
    expect: feature advance denied on raw HIGH
  - symbol: tasks.md-only sweep as cadence exit
    kind: C
    replacement: from-queue reconcile iteration over all queue epics
    policy: delete in-epic
    rg_scope: harness/hooks/epic/
    expect: queue tail verified along with active tasks
  - symbol: sliding window assumptions in documentation
    kind: I
    replacement: strict cadence cycle without sliding window
    policy: delete in-epic
    rg_scope: .cursor/rules/
    expect: zero sliding window references

deletes: []
wire_complete_required: true

out_of_scope:
  - "Future roadmap epics beyond T-HUB-094"

grep_control:
  - id: inv-a-01
    kind: A
    symbol: resume without reconcile
    command: 'rg -n "allow_resume_unverified" loop/ || true'
    expect: zero unverified resume callers
  - id: inv-b-01
    kind: B
    symbol: raw high resume bypass
    command: 'rg -n "ignore_high_drift" loop/ || true'
    expect: zero bypasses ignoring high drift
  - id: inv-c-01
    kind: C
    symbol: tasks only exit
    command: 'rg -n "only_active_tasks_exit" harness/hooks/epic/ || true'
    expect: no tasks-only exit shims
  - id: inv-i-01
    kind: I
    symbol: sliding window rules
    command: 'rg -n "sliding.*window" .cursor/rules/ loop/ || true'
    expect: zero sliding window references

skills:
  code_surface: api
  impl: []

checkpoints:
  - id: cp1
    criterion: |
      Kind A/B — feature advance строго блокируется при наличии HIGH drift без resync evidence.
    verify: |
      bin/pytest loop/tests/test_roadmap_cadence.py -k test_advance_blocked_resync -q
  - id: cp2
    criterion: |
      Kind C — reconcile from-queue валидирует всю очередь roadmap.
    verify: |
      bin/pytest loop/tests/test_reconcile_spec.py -q
  - id: cp3
    criterion: |
      Kind I / E2E — сквозной тест полного цикла: block_done -> HIGH -> block -> resync -> feature advance.
    verify: |
      bin/pytest loop/tests/test_roadmap_cadence.py -k test_full_cadence_lifecycle_e2e -q

verify:
  - "bin/pytest loop/tests/test_roadmap_cadence.py loop/tests/test_reconcile_spec.py -q"
tdd: []
