goal: |
  Встроить validate-traceability в loop runtime как opt-in шаг:
  - `EPIC_TRACEABILITY_CHECK=1` (env flag default `0`) в `.claude/project.env`.
  - `context_loop.py` (или `loop_runner.py`): после DECOMPOSE promote или before IMPLEMENT start —
    если флаг включён, запустить `epic_resolve validate-traceability --epic <plan_id>`;
    exit 0 → proceed; exit 1 → log WARNING (не блокировать loop); exit 2 → log ERROR (блокировать).
  - `pytest.ini` (или `conftest.py`): зарегистрировать маркер `pytest.mark.ac`.
  - Integration test на hub fixture: `test_reconcile_spec.py` или отдельный `test_traceability_integration.py` —
    запустить validate-traceability CLI на T-HUB-023 или T-HUB-024 decompose/implement fixtures,
    проверить exit 0 и JSON report структуру.

