goal: |
  Реализовать опциональный сканер живых acceptance-критериев:
  - scan_ac_markers(tests_dir) → dict[str, list[str]]: grep по `@pytest.mark.ac("AC+N")` / `@pytest.mark.ac("FR-NNN")`.
  - Интеграция в build_report (s02): если tests_dir передан, findings обогащаются
    (MEDIUM: requirement из plan без ни одного ac-marker).
  - Флаг `--ac-strict` в CLI (s02): отсутствие ac-marker на FR/SC → HIGH.
  - Если tests_dir не передан — scanner молчит (soft opt-in), CRITICAL/HIGH не возникают.
  Scope ограничен scanner-logic + CLI wire; pytest.ini / conftest.py конфигурация — s05.

