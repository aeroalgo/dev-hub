title: CLI validate-traceability — epic_resolve command + exit codes + JSON report
next_phase: BACK IMPLEMENT
needs_creative: "no"

goal: |
  Реализовать команду `epic_resolve validate-traceability --epic <plan_id> [--strict] [--json]`:
  - Вызывает parsers из s01 (plan + decompose + implement).
  - Запускает checker.run_checks() → список Finding с severity CRITICAL/HIGH/MEDIUM/LOW.
  - Формирует TraceReport: coverage_pct, critical_count, findings, matrix per-requirement.
  - Exit 0 когда CRITICAL=0; exit 1 при CRITICAL≥1; exit 2 при missing plan/decompose dir.
  - `--strict`: HIGH → CRITICAL для exit code.
  - `--json`: stdout JSON, иначе human-readable summary.
  Fail-closed: отсутствующий plan.md или пустой decompose dir → exit 2 с диагностикой.

