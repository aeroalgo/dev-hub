grep_control:
  - id: inv-a-01
    kind: A
    symbol: shell orchestration functions
    command: 'rg -n "run_claude_session|run_dsh_session|run_agent_session|_run_context_prepare|ensure_dsh_profiles" loop/ bin/ harness/ || true'
    expect: no output
  - id: inv-a-tests-01
    kind: A
    symbol: source loop.sh in tests
    command: 'rg -n "source .*loop\.sh" loop/tests/ harness/hooks/tests/ || true'
    expect: no output
  - id: inv-b-01
    kind: B
    symbol: loop.sh line count
    command: >-
      test $(grep -v '^#' loop/loop.sh | grep -v '^[[:space:]]*$' | wc -l) -lt 30 && echo "OK: loop.sh is slim shim"
    expect: OK
  - id: inv-c-01
    kind: C
    symbol: silent fallback in runner
    command: 'rg -n "except Exception: pass" loop/runner/ || true'
    expect: no output
  - id: inv-i-01
