grep_control:
  - id: inv-a-01
    kind: A
    symbol: "get_active_corpus_files discovery"
    command: 'rg -n "harness/agents" loop/tests/test_stack_profile_instruction_inventory.py'
    expect: "matches present showing agents discovery in get_active_corpus_files"
  - id: inv-c-01
    kind: C
    symbol: "unqualified pytest action in agents"
    command: 'bin/pytest loop/tests/test_stack_profile_instruction_inventory.py -q --tb=line'
    expect: "0 violations across full discovered active corpus"
  - id: inv-i-01
    kind: I
    symbol: "verify-implement unqualified recipes"
    command: 'rg -n "bin/pytest" harness/agents/verify-implement.md | rg -v "Hub|dev-hub"'
    expect: "no unqualified bin/pytest in verify-implement"
  - id: inv-i-02
    kind: I
    symbol: "verify-bugfix unqualified recipes"
    command: 'rg -n "bin/pytest" harness/agents/verify-bugfix.md | rg -v "Hub|dev-hub"'
    expect: "no unqualified bin/pytest in verify-bugfix"
  - id: inv-i-03
    kind: I
    symbol: "verify-qa unqualified recipes"
    command: 'rg -n "bin/pytest" harness/agents/verify-qa.md | rg -v "Hub|dev-hub|parent"'
    expect: "no unqualified bin/pytest in verify-qa"
  - id: inv-i-04
