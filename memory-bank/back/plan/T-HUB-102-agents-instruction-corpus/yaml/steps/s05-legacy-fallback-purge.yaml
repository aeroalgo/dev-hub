    policy: "delete in-epic"
    rg_scope: "loop/tests/test_stack_profile_instruction_inventory.py"
    expect: "stale agent prompts вызывают failure"
  - symbol: "Agent-specific implicit allowlist"
    kind: A
    replacement: "единый classifier для rules, skills, entrypoints и agents"
    policy: "delete in-epic"
    rg_scope: "loop/tests/test_stack_profile_instruction_inventory.py"
    expect: "нет специального ослабленного allowlist для agents"
  - symbol: "Treating agents as out-of-scope for instruction inventory"
    kind: C
    replacement: "fail-closed inclusion of agents in active corpus"
    policy: "delete in-epic"
    rg_scope: "loop/tests/"
    expect: "agents являются обязательной частью corpus"
  - symbol: "Unqualified bin/pytest in verify agents as implicit managed default"
    kind: C
    replacement: "Hub-only + managed capability branches"
    policy: "delete in-epic"
    rg_scope: "harness/agents/"
    expect: "нет голого bin/pytest без hub-only маркера в action context"
  - symbol: "Run VERIFY pytest without root classification"
    kind: C
    replacement: "Explicit hub self-test vs capability_checks"
    policy: "delete in-epic"
    rg_scope: "harness/agents/"
    expect: "VERIFY секции содержат branch qualification"
  - symbol: "harness/agents/verify-implement.md unqualified bin/pytest / .venv/bin/pytest recipes"
    kind: I
    replacement: "Hub-only branch + managed capability_checks branch"
    policy: "delete in-epic"
    rg_scope: "harness/agents/verify-implement.md"
    expect: "zero unqualified runner action lines"
  - symbol: "harness/agents/verify-bugfix.md bin/pytest… from VERIFY without scope"
    kind: I
    replacement: "Branch-qualified VERIFY commands"
    policy: "delete in-epic"
    rg_scope: "harness/agents/verify-bugfix.md"
    expect: "zero unqualified runner action lines"
  - symbol: "harness/agents/verify-qa.md full-suite bin/pytest -q --tb=line without hub-only label"
