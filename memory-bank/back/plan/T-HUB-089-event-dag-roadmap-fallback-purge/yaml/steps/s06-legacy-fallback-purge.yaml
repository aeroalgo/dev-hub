  Нулевые prod-callers по каждой строке inventory; obsolete tests на старый контракт удалены или переписаны;
  Kind I instructions приведены к v2 SoT; suite green без restore legacy.
  Канон: @.cursor/rules/shared/workflow-legacy-fallback-cleanup.mdc §2.2–§2.4

