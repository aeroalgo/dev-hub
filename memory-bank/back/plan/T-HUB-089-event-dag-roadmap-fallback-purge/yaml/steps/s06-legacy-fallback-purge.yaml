    kind: A
    replacement: v2 event validator
    policy: delete in-epic
    rg_scope: harness/hooks/ loop/
    expect: zero live prod callers; no runtime adaptation in read_event_log_result
  - symbol: loop/dag.py:adapt_manifest
    kind: A
    replacement: loop.dag.validate_manifest
    policy: delete in-epic
    rg_scope: loop/ harness/hooks/
    expect: zero live arm callers in context_loop
  - symbol: loop/roadmap_queue.py:QUEUE_VERSION_V1
    kind: A
    replacement: loop.roadmap_queue.QUEUE_VERSION
    policy: delete in-epic
    rg_scope: loop/ harness/hooks/
    expect: zero matches in prod runtime
  - symbol: loop/roadmap_queue.py:LEGACY_DEFAULT_QUEUE
    kind: A
    replacement: canonical queue path resolution
    policy: delete in-epic
    rg_scope: loop/ harness/hooks/
    expect: zero matches in prod runtime
  - symbol: loop/roadmap_queue.py:_render_merged_roadmap_md
    kind: A
    replacement: YAML queue result
    policy: delete in-epic
    rg_scope: loop/ harness/hooks/
    expect: zero matches in prod runtime
  - symbol: loop/roadmap_queue.py:canon_md_rel
    kind: A
    replacement: canonical YAML queue
    policy: delete in-epic
    rg_scope: loop/ harness/hooks/
    expect: zero matches in prod runtime
  - symbol: implicit event/DAG/roadmap migration during runtime
    kind: B
    replacement: explicit offline migration CLI or diagnostic error
    policy: delete in-epic
    rg_scope: loop/ harness/hooks/
    expect: zero implicit migration triggers in live execution
  - symbol: write_md/mirror preview in roadmap merge
    kind: B
    replacement: YAML-only merge output
    policy: delete in-epic
    rg_scope: loop/ harness/hooks/
    expect: zero markdown mirror file generation
  - symbol: non-v2 event -> adapter in read_event_log_result
    kind: C
    replacement: schema error / fail-closed
    policy: delete in-epic
    rg_scope: harness/hooks/epic_events.py
    expect: zero fallback to adapt_v1_event in live read
  - symbol: invalid DAG -> inferred v2/autonomous false in _arm_dag_next
    kind: C
    replacement: validation failure
    policy: delete in-epic
    rg_scope: loop/context_loop.py loop/dag.py
    expect: zero fallback to adapt_manifest in live arm
  - symbol: missing v2 queue -> LEGACY_DEFAULT_QUEUE probe in resolve_queue_path
    kind: C
    replacement: queue_missing error
    policy: delete in-epic
    rg_scope: loop/roadmap_queue.py
    expect: zero fallback to legacy queue file
  - symbol: roadmap docs naming Markdown mirror as SoT
    kind: I
    replacement: v2 queue YAML
    policy: delete in-epic
    rg_scope: loop/ .cursor/ memory-bank/
    expect: zero references to markdown mirror as source of truth
  - symbol: runbook suggesting v1 DAG/event input
    kind: I
    replacement: v2 schemas + explicit migration
    policy: delete in-epic
    rg_scope: loop/ .cursor/
    expect: zero instructions directing use of v1 runtime formats

