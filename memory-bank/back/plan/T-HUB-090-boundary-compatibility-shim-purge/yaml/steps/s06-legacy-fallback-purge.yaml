    kind: A
    symbol: _LEGACY_OVERLAYS
    command: 'rg -n "_LEGACY_OVERLAYS" harness/hooks/agent_registry.py || true'
    expect: no matches
  - id: inv-a-02
    kind: A
    symbol: _print_result_legacy
    command: 'rg -n "_print_result_legacy" loop/board_sync/cli.py || true'
    expect: no matches
  - id: inv-a-03
    kind: A
    symbol: _dispatch_legacy
    command: 'rg -n "_dispatch_legacy" loop/board_sync/cli.py || true'
    expect: no matches
  - id: inv-a-04
    kind: A
    symbol: dir(obj) adapter scan
    command: 'rg -n "for name in dir\(obj\)" loop/runtime_adapters/common.py || true'
    expect: no matches
  - id: inv-a-05
    kind: A
    symbol: ABORT_PATTERNS alias
    command: 'rg -n "^ABORT_PATTERNS\s*=" harness/hooks/session_resilience.py || true'
    expect: no matches
  - id: inv-a-06
    kind: A
    symbol: validate_shard_yaml alias
    command: 'rg -n "def validate_shard_yaml\(" harness/hooks/epic_yaml.py || true'
    expect: no matches
  - id: inv-a-07
    kind: A
    symbol: checkpoint_prompt_lines alias
    command: 'rg -n "def checkpoint_prompt_lines\(" harness/hooks/epic_yaml.py || true'
    expect: no matches
  - id: inv-b-01
    kind: B
    symbol: old board CLI dispatch
    command: 'rg -n "_status_or_launch" loop/board_sync/cli.py || true'
    expect: clean canonical dispatcher
  - id: inv-c-01
    kind: C
    symbol: blind runtime module fallback
    command: 'rg -n "endswith\(\"Adapter\"\)" loop/runtime_adapters/common.py || true'
    expect: no matches
  - id: inv-i-01
    kind: I
    symbol: instructions referencing deleted symbols
    command: 'rg -n "_LEGACY_OVERLAYS|_print_result_legacy|checkpoint_prompt_lines" harness/instructions/ .cursor/rules/ || true'
    expect: no matches

skills:
  code_surface: api
  impl: []

checkpoints:
  - id: cp1
    criterion: |
      Kind A — rg по каждой строке sunset_inventory kind=A:
      0 prod callers, 0 dead fallback functions, 0 live imports of deleted symbols.
    verify: |
      rg -n "_LEGACY_OVERLAYS|_print_result_legacy|_dispatch_legacy|^ABORT_PATTERNS\s*=|def checkpoint_prompt_lines|def validate_shard_yaml" harness/hooks/ loop/ --glob "!*.md" || true
  - id: cp2
    criterion: |
      Kind B — entrypoint inventory: board CLI и runtime entrypoints используют только канонические маршруты.
    verify: |
      bin/pytest loop/tests/test_board_sync_cli.py loop/tests/test_runtime_registry.py -q
  - id: cp3
    criterion: |
      Kind C — anti-fallback rg: слепое сканирование модулей и fallback на hardcoded map отсутствуют.
    verify: |
      rg -n "dir\(obj\)|_LEGACY_OVERLAYS" harness/hooks/agent_registry.py loop/runtime_adapters/common.py || true
  - id: cp4
    criterion: |
      Kind I — instruction surfaces: инструкции и правила не содержат ссылок на удаленные алиасы и маршруты.
    verify: |
      rg -n "_LEGACY_OVERLAYS|checkpoint_prompt_lines" harness/instructions/ .cursor/rules/ || true
  - id: cp5
    criterion: |
      Obsolete tests на старый контракт удалены или переписаны; suite green без restore legacy.
    verify: |
      bin/pytest loop/tests/test_agent_registry.py loop/tests/test_board_sync_cli.py loop/tests/test_codex_runtime_adapter.py loop/tests/test_session_wrapper.py harness/hooks/tests/test_epic_yaml.py -q
  - id: cp6
    criterion: Targeted + epic regression suite green после deletes (без возврата sunset-кода)
    verify: "bin/pytest loop/tests/ harness/hooks/tests/ -q --tb=line -k 'agent_registry or board_sync or codex_runtime or session_wrapper or epic_yaml'"

