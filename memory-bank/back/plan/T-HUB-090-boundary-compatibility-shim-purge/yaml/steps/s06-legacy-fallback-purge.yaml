sunset_inventory:
  - symbol: harness/hooks/agent_registry.py:_LEGACY_OVERLAYS
    kind: A
    replacement: agent frontmatter overlay metadata
    policy: delete in-epic
    rg_scope: harness/hooks/ loop/
    expect: zero occurrences of _LEGACY_OVERLAYS
  - symbol: harness/hooks/agent_registry.py:_legacy_or_default default field merge
    kind: A
    replacement: strict metadata parsing and dataclass defaults
    policy: delete in-epic
    rg_scope: harness/hooks/
    expect: zero legacy map merge logic
  - symbol: loop/board_sync/cli.py:_print_result_legacy
    kind: A
    replacement: canonical result printers
    policy: delete in-epic
    rg_scope: loop/board_sync/
    expect: zero occurrences of _print_result_legacy
  - symbol: loop/board_sync/cli.py:_dispatch_legacy
    kind: A
    replacement: canonical CLI dispatcher
    policy: delete in-epic
    rg_scope: loop/board_sync/
    expect: zero occurrences of _dispatch_legacy
  - symbol: loop/runtime_adapters/common.py:_RUNTIME_ALIASES unreferenced aliases
    kind: A
    replacement: runtime registry
    policy: delete in-epic
    rg_scope: loop/runtime_adapters/
    expect: no unreferenced aliases
  - symbol: loop/runtime_adapters/common.py module attribute scan fallback
    kind: A
    replacement: registry-owned typed adapter
    policy: delete in-epic
    rg_scope: loop/runtime_adapters/
    expect: zero dir(obj) scanning
  - symbol: harness/hooks/session_resilience.py:ABORT_PATTERNS
    kind: A
    replacement: _FATAL_ABORT_PATTERNS and _TRANSIENT_ABORT_PATTERNS
    policy: delete in-epic
    rg_scope: harness/hooks/ loop/
    expect: zero occurrences in production code
  - symbol: loop/schemas/active_context.py:_handoff_mode_from_legacy_markdown
    kind: A
    replacement: handoff_mode_from_text
    policy: delete in-epic
    rg_scope: loop/schemas/
    expect: zero callers across codebase
  - symbol: harness/hooks/epic_yaml.py:checkpoint_prompt_lines
    kind: A
    replacement: step_context_prompt_lines
    policy: delete in-epic
    rg_scope: harness/hooks/ loop/
    expect: zero callers in production code
  - symbol: harness/hooks/epic_yaml.py:validate_shard_yaml
    kind: A
    replacement: validate_shard_yaml_full
    policy: delete in-epic
    rg_scope: harness/hooks/ loop/
    expect: zero callers in production code
  - symbol: old board command forms with no supported caller
    kind: B
    replacement: canonical CLI commands
    policy: delete in-epic
    rg_scope: loop/board_sync/
    expect: zero unreachable dispatch routes
  - symbol: old DSH tool names
    kind: B
    replacement: lowercase canonical tools
    policy: retain until supported client scan is zero
    rg_scope: harness/ loop/
    expect: retained with explicit classification
  - symbol: missing agent metadata -> hardcoded legacy overlay
    kind: C
    replacement: metadata validation error / fail-closed
    policy: delete in-epic
    rg_scope: harness/hooks/agent_registry.py
    expect: fail-closed on missing metadata
  - symbol: registry miss -> blind module scan
    kind: C
    replacement: typed registry error / fail-closed
    policy: delete in-epic
    rg_scope: loop/runtime_adapters/common.py
    expect: explicit ValueError on unknown runtime
  - symbol: dead API alias fallback
    kind: C
    replacement: canonical functions
    policy: delete in-epic
    rg_scope: harness/hooks/ loop/
    expect: zero dead alias definitions
  - symbol: PATH/npx/LLM operational recovery
    kind: C
    replacement: bounded operational resolver
    policy: keep with explicit non-legacy classification
    rg_scope: loop/runtime_adapters/
    expect: retained as operational resilience
  - symbol: docs/instructions naming old board route or agent default map
    kind: I
    replacement: metadata/registry canonical route
    policy: delete in-epic
    rg_scope: harness/instructions/ .cursor/rules/ docs/
    expect: zero references to legacy routes or maps

deletes:
  - "harness/hooks/agent_registry.py:_LEGACY_OVERLAYS"
  - "loop/board_sync/cli.py:_print_result_legacy"
  - "loop/board_sync/cli.py:_dispatch_legacy"
  - "loop/runtime_adapters/common.py:module attribute scan fallback"
  - "harness/hooks/session_resilience.py:ABORT_PATTERNS"
  - "harness/hooks/epic_yaml.py:validate_shard_yaml"
  - "harness/hooks/epic_yaml.py:checkpoint_prompt_lines"
  - "loop/schemas/active_context.py:_handoff_mode_from_legacy_markdown"

out_of_scope:
  - "DSH lowercase canonical tools and tool-name compatibility shims while supported clients exist (FR-006)"
  - "Operational environment fallbacks (which-dsh, which-codex, LLM secondary model) (FR-005, FR-006)"

