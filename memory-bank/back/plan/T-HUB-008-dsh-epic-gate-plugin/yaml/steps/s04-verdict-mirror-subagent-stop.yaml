# SubagentStop output field: `lastAssistantMessage` (ContentBlock[]), emitted by
# DSH `subagent/end` as `SubagentRunEndInfo`; the installed CC bridge does not
# forward it and also omits `last_assistant_message`/`agent_transcript_path`.
# The native handler reads this field, supported aliases, or the child's final
# `assistant/message` event, then forwards a Claude-shaped `last_assistant_message`
# and `verdict` to `.claude/hooks/subagent-stop.py`.

