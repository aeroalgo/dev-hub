checkpoints:
  - id: cp1
    criterion: >
      dsh/scripts/install-profiles.sh exists and is executable
    verify: "test -x dsh/scripts/install-profiles.sh"
  - id: cp2
    criterion: >
      AC+1: install-profiles.sh → $DSH_HOME/profiles/epic-implement exists (dry-run or real with temp DSH_HOME)
    verify: "timeout 300s bash -c 'TMP=$(mktemp -d); DSH_HOME=$TMP bash dsh/scripts/install-profiles.sh --dry-run || DSH_HOME=$TMP bash dsh/scripts/install-profiles.sh; test -d $TMP/profiles/epic-implement; rm -rf $TMP'"
  - id: cp3
    criterion: >
      AC+5: dsh/README.md содержит таблицу всех 8 фаз
    verify: "grep -E 'epic-(implement|qa|decompose|plan|creative|audit|bugfix|reflect)' dsh/README.md | wc -l | grep -q 8"
  - id: cp4
    criterion: >
      AC+6: README документирует PROJECT_LOOP_IMPLEMENT_MODEL → patch field
    verify: "grep -q 'PROJECT_LOOP_IMPLEMENT_MODEL' dsh/README.md && grep -qi 'patch\\|cordis' dsh/README.md"

verify:
  - "bash -x dsh/scripts/install-profiles.sh --help || true; head -100 dsh/README.md"

tdd:
  - "install-profiles.sh --dry-run does not modify filesystem"
  - "install-profiles.sh with DSH_HOME=/tmp/test installs all 8 profiles"
  - "AC+1: $DSH_HOME/profiles/epic-implement exists after install"
  - "AC+5: README has 8-phase table"
  - "AC+6: README documents PROJECT_LOOP_* env → patch mapping"
  - "NFR-4: README mentions pinned @deepseek-ai/dsh version"
  - "Regression: dsh tests зелёные"
