checkpoints:
  - id: cp1
    criterion: "HarnessManifest.model_validate() принимает корректный manifest.yaml без exception"
    verify: ".venv/bin/pytest loop/tests/test_manifest_schema.py -q --tb=short"
  - id: cp2
    criterion: "Invalid manifest (отсутствует schema: harness-manifest/v1) → ManifestValidationError"
    verify: ".venv/bin/pytest loop/tests/test_manifest_schema.py -k invalid -q --tb=short"
  - id: cp3
    criterion: "harness/manifest.yaml загружается через load_manifest без ошибок (smoke)"
    verify: ".venv/bin/python -c \"from loop.runtime_materializers.manifest_schema import load_manifest; load_manifest('harness/manifest.yaml')\""

verify:
  - ".venv/bin/pytest loop/tests/test_manifest_schema.py -q --tb=short"

tdd:
