title: "harness/manifest.yaml schema harness-manifest/v1 + pydantic validator"
next_phase: BACK IMPLEMENT
needs_creative: "no"

goal: |
  Создать `harness/manifest.yaml` как SoT для agents/hooks/instructions → runtime bindings,
  и pydantic-модель `loop/runtime_materializers/manifest_schema.py` валидирующую его при загрузке.
  Outcome: единый yaml описывает все рантаймы; невалидный manifest → exit 2 (TM-001).

context:
  consumes:
    - "plan §manifest.yaml sketch (FR-001)"
    - "loop/runtime_registry.yaml — образец schema_version pattern"
  produces:
    - "harness/manifest.yaml"
    - "loop/runtime_materializers/__init__.py"
    - "loop/runtime_materializers/manifest_schema.py"
  plan_refs:
    - "FR-001"
    - "TM-001"
  files:
    - "harness/manifest.yaml"
    - "loop/runtime_materializers/__init__.py"
    - "loop/runtime_materializers/manifest_schema.py"

as_built:
  - "loop/runtime_registry.yaml существует: schema_version: runtime-registry/v1, runtimes: claude/dsh"
  - "loop/runtime_adapters/base.py: RuntimeAdapter Protocol, SessionContext, SessionAnalysis"
  - "harness/ dir существует: hooks/, agents/, instructions/"

delta:
  - "create harness/manifest.yaml: schema harness-manifest/v1 с секциями agents/hooks/instructions; stub entries для verify-implement (3 runtimes)"
  - "create loop/runtime_materializers/__init__.py: пустой пакет"
  - "create loop/runtime_materializers/manifest_schema.py: pydantic-модели ManifestAgent, ManifestHook, HarnessManifest; load_manifest(path) → HarnessManifest; invalid → ManifestValidationError (exit 2)"

deletes: []

