title: "Generate .codex/hooks.json from manifest with GENERATED header + hash guard"
next_phase: BACK IMPLEMENT
needs_creative: "no"

goal: |
  Реализовать генератор `.codex/hooks.json` в `loop/runtime_materializers/hooks_json.py`:
  читает hooks-секцию manifest, рендерит JSON с GENERATED-заголовком и sha256 manifest-hash.
  AC− #1: ручная правка hooks.json невозможна без потери GENERATED header / hash mismatch.
  Outcome: runtime-sync --apply --runtime codex → hooks.json обновляется из manifest.

context:
  consumes:
    - "s01: HarnessManifest (hooks секция)"
    - "s02: ManifestSync.apply (вызывает этот генератор)"
    - "plan §Hooks bridge, FR-004, AC− #1, TM-003"
    - ".agents/skills/impeccable/scripts/live-copy-edit-agent.mjs — образец codex exec argv; hooks.json events"
    - "dsh/patches/cc-hooks-bridge.yml — образец hook registration pattern"
  produces:
    - "loop/runtime_materializers/hooks_json.py"
    - ".codex/hooks.json (template/stub in repo — GENERATED header; regenerated on apply)"
    - ".codex/.gitkeep (if dir new)"
  plan_refs:
    - "FR-004"
    - "AC− #1"
    - "TM-003"
  files:
    - "loop/runtime_materializers/hooks_json.py"
    - ".codex/hooks.json"
    - ".codex/.gitkeep"

as_built:
  - "harness/hooks/stop-gate.py, spawn_validate.py, session-start.py: существуют — entrypoints для codex hooks"
  - "loop/runtime_materializers/manifest_schema.py: HarnessManifest (s01)"

delta:
  - "create loop/runtime_materializers/hooks_json.py: generate_hooks_json(manifest: HarnessManifest, dest: Path) → None"
  - "  header comment in JSON: '// GENERATED by runtime-sync from harness/manifest.yaml — DO NOT EDIT'"
  - "  manifest_hash: sha256(manifest yaml bytes) embedded in _meta field"
  - "  event mapping: Stop → stop-gate.py entrypoint; UserPromptSubmit → spawn_validate.py; SessionStart → session-start.py"
  - "  shell wrapper path: python3 harness/hooks/<hook>.py (или direct path from manifest hook.source)"
  - "create .codex/hooks.json: stub с GENERATED header и пустым body — commit template; overwritten on apply"
  - "create .codex/.gitkeep: ensure dir tracked"

deletes:
  - ".codex/hooks.json (hand-maintained version без GENERATED header — перезаписывается generated версией)"
  # Replacement cleanup Kind C: cutover с ручного на generated; s11 grep-контроль что header присутствует

