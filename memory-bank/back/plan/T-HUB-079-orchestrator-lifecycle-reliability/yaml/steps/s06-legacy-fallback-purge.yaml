  - "loop/context_loop.py — удаление устаревших ad-hoc guard веток и ручной мутации in_flight"
  - "harness/hooks/session_resilience.py — удаление неявных fallback-повторов"
  - "loop/tests/test_orchestrator_lifecycle_regression.py — итоговый сквозной регрессионный сьют"

sunset_inventory:
  - symbol: ad-hoc in_flight mutation/read branches
    kind: A
    replacement: loop.lifecycle.LifecycleReducer
    policy: delete in-epic
    rg_scope: loop/ harness/
    expect: zero ad-hoc in_flight mutations; state transitions exclusively via reducer
  - symbol: scattered duplicate-spawn guards
    kind: A
    replacement: loop.lifecycle.create_or_get_invocation
    policy: delete in-epic
    rg_scope: loop/runtime_adapters/ harness/hooks/
    expect: zero scattered duplicate guards; centralized idempotency resolver
  - symbol: implicit root-session retry launcher
    kind: B
    replacement: invocation-aware launcher with explicit retry relation
    policy: delete in-epic
    rg_scope: loop/context_loop.py harness/hooks/session_resilience.py
    expect: zero implicit re-launches without explicit retry identity
  - symbol: retry after TaskStop / empty session silently
    kind: C
    replacement: named terminal cause (stale/aborted_before_action) + explicit policy
    policy: delete in-epic
    rg_scope: harness/hooks/session_resilience.py loop/context_loop.py
    expect: zero silent fallback retries
  - symbol: inspect /tmp/runtime and clear marker advice
    kind: I
    replacement: await_gate typed API and operator incident handoff
    policy: delete in-epic
    rg_scope: harness/instructions/ harness/cursor/rules/
    expect: zero manual marker deletion/crawl advice

deletes:
  - ad_hoc_in_flight_branches
  - scattered_duplicate_guards
  - implicit_task_stop_retry

out_of_scope:
  - s01-s05 реализация до cutover
  - full suite → QA

grep_control:
  - id: inv-a-01
    kind: A
    symbol: ad-hoc in_flight mutation/read branches
    command: 'rg -n "in_flight.*=.*True|in_flight.*=.*False" loop/ harness/ --glob "*.py" || true'
    expect: zero ad-hoc mutations outside reducer
  - id: inv-a-02
    kind: A
    symbol: scattered duplicate-spawn guards
    command: 'rg -n "_is_already_running|_check_duplicate_spawn" loop/runtime_adapters/ harness/hooks/ --glob "*.py" || true'
    expect: no scattered duplicate spawn checks
  - id: inv-b-01
    kind: B
    symbol: implicit root-session retry launcher
    command: 'rg -n "retry_silent_root|auto_relaunch_root" loop/ context_loop.py harness/hooks/ || true'
    expect: no implicit root retry launchers
  - id: inv-c-01
    kind: C
    symbol: retry after TaskStop / empty session silently
    command: 'rg -n "soft_retry_task_stop|fallback_empty_session" harness/hooks/ loop/ || true'
    expect: zero silent fallback retries
  - id: inv-i-01
    kind: I
    symbol: inspect /tmp/runtime and clear marker advice
    command: 'rg -n "rm .*/tmp/.*marker|clear.*marker.*file" harness/instructions/ harness/cursor/rules/ || true'
    expect: no manual marker deletion advice

skills:
  code_surface: api
  impl: []

checkpoints:
  - id: cp1
    criterion: |
      Kind A — rg по строкам sunset_inventory kind=A:
      0 prod callers ad-hoc in_flight мутаций и разрозненных duplicate-guards.
    verify: "rg -n 'in_flight.*=.*True' loop/ harness/ --glob '*.py' || true"
  - id: cp2
    criterion: |
      Kind B — entrypoint inventory: исключены неявные автоперезапуски root-сессий.
    verify: "rg -n 'retry_silent_root|auto_relaunch_root' loop/ context_loop.py harness/hooks/ || true"
  - id: cp3
    criterion: |
      Kind C — anti-fallback rg: исключены тихие ретраи после TaskStop или пустых сессий.
    verify: "rg -n 'soft_retry_task_stop|fallback_empty_session' harness/hooks/ loop/ || true"
  - id: cp4
    criterion: |
      Kind I — instruction surfaces: отсутствуют советы ручного поиска/чистки маркеров в /tmp.
    verify: "rg -n 'rm .*/tmp/.*marker|clear.*marker.*file' harness/instructions/ harness/cursor/rules/ || true"
  - id: cp5
    criterion: |
      Устаревшие тесты на старые механизмы мутации маркеров удалены/переписаны;
      целевой тестовый набор зеленый.
    verify: "bin/pytest loop/tests/test_lifecycle_reducer.py loop/tests/test_idempotent_gate_dispatch.py loop/tests/test_lifecycle_crash_safety.py -q --tb=line"
  - id: cp6
    criterion: |
      Сквозной регрессионный сьют жизненного цикла и надежности оркестратора успешен.
    verify: "bin/pytest loop/tests/test_orchestrator_lifecycle_regression.py -q --tb=line"

