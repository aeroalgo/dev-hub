  FAIL verdict (FR-006 baseline усилить). Taxonomy classifiers из s03 (is_schema_error /
  is_semantic_error) применяются в subagent-stop и agent-pretool для ветвления.
  Outcome: SC-003 (semantic FAIL repair not schema-retry); TM-005/006.
  System: чёткий fork после SubagentStop — schema путь и semantic путь не пересекаются.

context:
