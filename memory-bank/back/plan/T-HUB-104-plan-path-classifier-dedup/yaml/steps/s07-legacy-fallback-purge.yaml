grep_control:
  - id: inv-a-01
    kind: A
    symbol: loop/mb_load/session.py duplicate definition
    command: 'python3 -c "import subprocess, sys; res = subprocess.run([\"rg\", \"-n\", \"^def is_markdown_plan_path\", \"loop/\"], capture_output=True, text=True); lines = res.stdout.strip().splitlines(); sys.exit(0 if len(lines) == 1 and \"loop/mb_load/plan_section.py\" in lines[0] else 1)"'
    expect: exactly one definition in plan_section.py
  - id: inv-b-01
    kind: B
    symbol: loop/board_sync/ duplicate _plan_path
    command: 'python3 -c "import subprocess, sys; res = subprocess.run([\"rg\", \"-n\", \"^def _plan_path\", \"loop/board_sync/\"], capture_output=True, text=True); sys.exit(0 if not res.stdout.strip() else 1)"'
    expect: zero local _plan_path definitions
  - id: inv-c-01
    kind: C
    symbol: loop/tests/ duplicate classifier asserts
    command: 'bin/pytest loop/tests/test_plan_path_classifier_characterization.py -q'
    expect: characterization suite pass
  - id: inv-i-01
    kind: I
    symbol: loop/board_sync/ sys.path insertions
    command: 'python3 -c "import subprocess, sys; res = subprocess.run([\"rg\", \"-n\", \"sys.path.insert.*hooks\", \"loop/board_sync/\"], capture_output=True, text=True); lines = [l for l in res.stdout.splitlines() if \"_epic_paths.py\" not in l]; sys.exit(0 if not lines else 1)"'
    expect: no sys.path hacks in epic_resolver or scan_gates

