sunset_inventory:
  - symbol: loop/mb_load/session.py::is_markdown_plan_path implementation body
    kind: A
    replacement: loop/mb_load/plan_section.py::is_markdown_plan_path
    policy: delete in-epic
    rg_scope: loop/mb_load/session.py
    expect: only re-export or call to plan_section; zero duplicate branch body
  - symbol: loop/board_sync/epic_resolver.py::_plan_path
    kind: B
    replacement: loop/board_sync/_epic_paths.py::plan_path
    policy: delete in-epic
    rg_scope: loop/board_sync/epic_resolver.py
    expect: function deleted; caller uses _epic_paths
  - symbol: loop/board_sync/scan_gates.py::_plan_path
    kind: B
    replacement: loop/board_sync/_epic_paths.py::plan_path
    policy: delete in-epic
    rg_scope: loop/board_sync/scan_gates.py
    expect: function deleted; caller uses _epic_paths
  - symbol: loop/tests/test_mb_load_session.py duplicate asserts
    kind: C
    replacement: loop/tests/test_plan_path_classifier_characterization.py
    policy: delete in-epic
    rg_scope: loop/tests/
    expect: consolidated test coverage without redundant copies
  - symbol: loop/board_sync/ sys.path hack comments
    kind: I
    replacement: clean import from loop.board_sync._epic_paths
    policy: delete in-epic
    rg_scope: loop/board_sync/
    expect: zero sys.path insertions for epic_paths in resolver/gates

