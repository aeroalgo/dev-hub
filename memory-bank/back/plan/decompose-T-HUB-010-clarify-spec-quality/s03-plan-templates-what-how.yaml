              | # | Story | Priority | Independent Test |
              - Acceptance Scenarios: Given / When / Then per story P0+
          - ##Success Criteria SC-001 … (измеримые; KPI post-launch → type: outcome)
          - ##FR-### (Functional Requirements нумерованные)
          - ##Assumptions (задокументированные допущения)
          - ##Clarifications (session stub: ссылка на clarify-*.md если есть; иначе пусто)
          - ##[НУЖНО УТОЧНИТЬ] placeholder секция (убрать при PLAN завершении или перенести в defer)
      - ##Техника / архитектура (HOW) — [стек, модули, интеграции — отдельно от WHAT]
      NOTE: NFR-2: WHAT-секции не telegraph-cap; существующие секции Goal/Контекст/Риски — сохранить"
  - "EDIT .cursor/templates/integration-plan.md — адаптировать WHAT-поля:
      - добавить перед element registry:
          ##Продуктовая спека (WHAT) — краткая: user journey goals + ключевые SC-###
