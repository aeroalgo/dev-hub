    - "FR-8 (integration-plan.md: WHAT-поля без ломки portal inventory)"
    - "NFR-2 (WHAT секция не telegraph-cap)"
    - "NFR-4 (язык шаблонов RU)"
    - "AC+ #3 (plan.md содержит Independent Test + [НУЖНО УТОЧНИТЬ] + WHAT/HOW)"
    - "AC−(bf) #1 (legacy plans без WHAT остаются валидны)"
  files:
    - ".cursor/templates/plan.md"
    - ".cursor/templates/integration-plan.md"

