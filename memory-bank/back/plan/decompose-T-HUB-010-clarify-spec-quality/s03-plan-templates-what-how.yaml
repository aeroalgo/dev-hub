goal: |
  Обновить шаблоны планов так, чтобы каждый новый PLAN содержал чёткое разделение WHAT (продуктовая спека,
  без стека) и HOW (техника/архитектура), User Stories с полями Priority + Independent Test +
  Acceptance Scenarios (Given/When/Then), FR-### ID, SC-### Success Criteria, раздел Assumptions
  и stub Clarifications session.
  integration-plan.md: адаптировать те же WHAT-поля под element registry, не ломая portal inventory (≥400 строк plan).
  Outcome: шаблоны принуждают WHAT→HOW и измеримые SC — фундамент для T-HUB-011 ANALYZE (FR/AC-refs).
  Legacy plans без WHAT-секции остаются валидными (brownfield-safe, только новые PLAN).
  Связь с Goal/NFR: FR-7, FR-8, NFR-2, NFR-4, AC+ #3; AC−(bf) #1.

