      - §Completion Report формат (compact RU): список Q→A + resolved/deferred + next action
      - §skip policy: только при явном 'spike / exploratory' + warning
      - §FORBIDDEN: silent assumption при пустом prompt / угал auth/stack"
  - "CREATE .cursor/rules/back_developer/workflow-clarify.mdc:
      - Frontmatter
      - @.cursor/rules/back_developer/mainrule-core.mdc (context ref)
      - @.cursor/rules/back_developer/isolation_rules/_lean/clarify.mdc (gates ref)
      - §Когда запускать: рекомендуется до BACK PLAN при размытом scope; допустим в начале PLAN как step 0 gate
