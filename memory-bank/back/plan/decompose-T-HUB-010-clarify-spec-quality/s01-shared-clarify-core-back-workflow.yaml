      - §Done When: Completion Report написан, ≤5 Q обработаны, нет CRITICAL blockers или они в defer-list
      - §Handoff: next BACK PLAN | continue CLARIFY | spike skip warning"
  - "CREATE .cursor/rules/back_developer/isolation_rules/_lean/clarify.mdc:
      - Frontmatter (description: 'CLARIFY gates — lean load', alwaysApply: false)
      - §Gates: load_now = только clarify artifact (если есть) + activeContext; НЕ plan monolith без нужды
      - §NFR-3 enforced: lean load; не грузить все workflow/templates в контекст
      - §Abort: не давать советы по стеку/архитектуре до PLAN; только снимать ambiguity"
  - "CREATE .cursor/templates/clarify.md:
