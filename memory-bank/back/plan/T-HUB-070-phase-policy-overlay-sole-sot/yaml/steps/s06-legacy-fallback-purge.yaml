checkpoints:
  - id: cp1
    criterion: |
      Kind A — rg по КАЖДОЙ строке sunset_inventory kind=A (inv-a-01..04, inv-a-tests-01):
      0 prod callers. Matches в tests/ допустимы ТОЛЬКО если кейс уже на новом контракте.
      Asserts на sunset-поведение / импорт удалённого API = FAIL (deletes/rewrite).
    verify: |
      rg -n "armed_step==\"DECOMPOSE\"|verify/reviewer OFF|need_verify\"] = False" harness/hooks/user-prompt.py || true
      rg -n "Handoff → REFLECT|→ REFLECT" harness/hooks/user-prompt.py || true
      rg -n -A8 "^  DECOMPOSE:" loop/schemas/phase_registry.yaml | rg "need_verify: false" || true
      rg -n "armed_step_u == \"DECOMPOSE\"" -A8 harness/hooks/stop-gate.py | rg "need_verify.*=.*False" || true
      rg -n "assert .*need_verify.*False|Handoff → REFLECT" harness/hooks/tests/test_user_prompt_overlay.py loop/tests/test_stop_gate.py || true
  - id: cp2
    criterion: Kind B — same UserPromptSubmit hook; no second overlay entrypoint / phase_policy.py (inv-b-01)
    verify: |
      test ! -e harness/hooks/phase_policy.py
      rg -n "phase_policy.py|second policy table" harness/hooks/user-prompt.py || true
  - id: cp3
    criterion: |
      Kind C+I — no docs-only DECOMPOSE; no overlay-wins-if-missing; no REFLECT-as-next /
      verify OFF / promote IMPLEMENT instructions (inv-c-01/02, inv-i-01..04).
    verify: |
      rg -n "docs-only|verify/reviewer OFF" harness/hooks/user-prompt.py harness/hooks/stop-gate.py || true
      rg -n "PROJECT_LOOP_DECOMPOSE_VERIFY" harness/hooks/user-prompt.py loop/schemas/phase_registry.yaml harness/hooks/epic/core.py || true
      rg -n "REFLECT" harness/hooks/user-prompt.py harness/hooks/stop-gate.py || true
      rg -n "promote DECOMPOSE→IMPLEMENT" harness/hooks/user-prompt.py || true
      rg -n "REFLECT обязател" harness/hooks/user-prompt.py || true
      rg -n "Handoff BACK REFLECT|pass→REFLECT" harness/hooks/stop-gate.py || true
  - id: cp4
    criterion: Targeted + epic regression suite green после deletes (без возврата sunset-кода)
    verify: "bin/pytest harness/hooks/tests/test_user_prompt_overlay.py loop/tests/test_stop_gate.py loop/tests/test_epic_transition.py -q --tb=line -k 'decompose or overlay or gates_from_phase or reflect or unknown'"

verify:
  - "rg -n 'verify/reviewer OFF|promote DECOMPOSE→IMPLEMENT|Handoff → REFLECT' harness/hooks/user-prompt.py harness/hooks/stop-gate.py; test $? -eq 1"
tdd:
  - "purge leftover; keep s01–s05 tests green without restore overlay"
