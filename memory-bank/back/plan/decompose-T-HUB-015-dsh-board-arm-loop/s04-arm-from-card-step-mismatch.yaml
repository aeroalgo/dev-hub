step_id: s04
plan_id: T-HUB-015-dsh-board-arm-loop
title: "arm_from_card + step_mismatch + gate arm rules — FR-002/001b"
next_phase: BACK IMPLEMENT
needs_creative: "no"

goal: |
  Реализовать `loop/board_launch/arm.py`:
  `arm_from_card(launch_card: LaunchCard, cwd_override: Path | None = None) -> ArmResult`
  Логика:
    1. Вызвать `context_loop.arm_session(project_root, decompose_rel_or_id)` через subprocess
       (или прямой Python import `arm_active_context_from_decompose` — выбор по импортируемости).
    2. Получить JSON ответ: `step_id` от arm.
    3. Для `card_kind=step`: если `arm_result.step_id != card.step_id` → `StepMismatchError` (exit 2, diagnostic_code='step_mismatch').
    4. Для `card_kind=gate`: не проверять step_id; `allowRoadmapAdvance=false` default → если `gate_phase=ROADMAP` и нет `explicit_epic` в metadata → `RoadmapAdvanceDeniedError` (AC−3).
    5. Return `ArmResult(step_id, armed_epic, ok=True)` on success.
  Покрывает: AC+3, AC+4, SC-001, SC-004, FR-002, FR-001b, AC−1, AC−3, NFR: fail-closed.

