goal: |
  Реализовать Cordis plugin `@dev-hub/dsh-mb-bridge` (TypeScript/Node):
    - `python-bridge.ts`: spawns `hub-board arm|loop|arm-loop --task-id <id>` via Node `child_process.spawn`
      с fixed argv (no shell=True); captures stdout/stderr; maps exit code → Host execution result.
    - `intercept-run.ts`: на основе spike s01 (Path A или Path B):
        Path A: Cordis hook intercepts `task-board/run` for mb-* cards → redirect to loop-run pipeline.
        Path B: no hook → plugin registers Host route `/api/mb-bridge/action`; stock run for mb-* cards
          disabled via empty/announce prompt; UI buttons call /api/mb-bridge/action directly.
      Non-mb card run → passthrough unchanged (SC-005, AC+8).
    - Card detail actions (FR-017): plugin injects Arm / Run loop / Arm+Run buttons into mb-* card detail;
      Stock Run button hidden/replaced.
    - Config load: read plugin config from Cordis yaml (`mb-bridge.*`); expose to python-bridge.
    - Intercept enforces: no silent stock agent run for mb-* (AC+7, AC−7); error `mb_card_requires_loop_run`.
  Brownfield cutover: удалить stub prompt pattern «T-HUB-015 later» из любого board_sync prompt builder
  (rg scan + delete in-epic).
  Покрывает: AC+7, AC+8, SC-003, SC-005, FR-005, FR-017, FR-018 (no raw shell from browser),
  AC−2, AC−7, AC−8, NFR: security.

