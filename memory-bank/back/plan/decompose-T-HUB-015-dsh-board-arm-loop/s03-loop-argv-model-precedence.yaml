goal: |
  Реализовать `loop/board_launch/loop_argv.py` — единственная функция сборки argv для `bin/loop`.
  `build_loop_argv(project_root, phase, config, preset_id=None, runtime=None) -> list[str]`
  Логика precedence (канон FR-015):
    1. Читает `PROJECT_LOOP_<PHASE>_MODEL` из product `project_root/.claude/project.env`;
       если задан → argv = [str(loop_bin), str(project_root)] (phase env wins; preset ignored);
       diagnostic field `model_source="env"`.
    2. Иначе preset_id → lookup `config.modelPresets` → `argv += preset.args` (validated).
    3. Иначе `config.defaultLoopArgs` → `argv += defaultLoopArgs`.
    4. Иначе bare argv = [str(loop_bin), str(project_root)].
  `EPIC_RUNTIME` env-override: если runtime == "dsh" → добавить `EPIC_RUNTIME=dsh` в subprocess env dict (не argv).
  Preset whitelist: каждый token из `preset.args` valided `^[a-zA-Z0-9._/-]+$`; max 8 presets; unknown preset_id → PresetError.
  task.mode НЕ читается (AC−8, FR-018).
  Покрывает: AC+2, AC+12, SC-002, SC-007, SC-008, FR-014, FR-015, FR-016, NFR: model precedence.

