needs_creative: "no"

goal: |
  Реализовать `loop/board_launch/loop_run.py`:
  `loop_run(launch_card: LaunchCard, argv_result: LoopArgvResult, config: BridgeConfig, *,
            loop_bin_override: Path | None = None) -> ExecutionResult`
  Логика:
    - Собрать subprocess argv из LoopArgvResult; env = os.environ | argv_result.env_extra.
    - Spawn `subprocess.Popen(argv, cwd=str(project_root), env=env)` — НЕ `shell=True`.
    - Capture stdout/stderr (pipe); stream timeout (300s hard default).
    - exit 0 → ExecutionResult(status='succeeded', exit_code=0, log_path).
    - exit != 0 → ExecutionResult(status='failed', exit_code=N, log_path).
    - flock conflict (exit with specific code or EAGAIN) → ExecutionResult(status='failed', diagnostic_code='lock_conflict').
    - Write truncated log to `DEV_HUB/loop/runtime/exec-<ts>.log`; attach log_path в result.
    - Fake: `FakeLoopRunner` — callable accepting same signature, records calls, configurable exit_code.
  Покрывает: AC+6, SC-002, FR-003, FR-007, NFR: security (no shell=True), NFR: concurrency (lock detection), NFR: async host.

