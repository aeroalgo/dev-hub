goal: |
  Создать пакет `loop/board_launch/` и `metadata.py` — единственный source-of-truth для парсинга
  `mb-board-card/v1` метаданных в контексте T-HUB-015 (arm/loop pipeline).
  `metadata.py` импортирует `CardKind`, `StepCard`, `GateCard` из `loop/board_sync/card_model.py` (T-HUB-014),
  добавляет `parse_launch_metadata(task_dict) -> LaunchCard` с валидацией fail-closed:
  `card_kind` missing → `CardMetadataError`; unknown kind → `CardMetadataError`;
  `project_root` missing/blank → `CardMetadataError`;
  `decompose_rel` required for step/gate → `CardMetadataError`.
  Покрывает AC+1, FR-001, FR-001b, NFR: 014 schema import.

