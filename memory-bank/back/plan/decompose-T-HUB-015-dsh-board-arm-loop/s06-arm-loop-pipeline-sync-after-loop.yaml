goal: |
  Реализовать `loop/board_launch/pipeline.py`:
  `arm_loop_from_card(launch_card, config, *, preset_id=None, runtime=None,
                      loop_runner=None, arm_fn=None) -> PipelineResult`
  Логика (FR-004):
    1. arm_from_card(launch_card) → ArmResult; если raises → PipelineResult(status='arm_failed', loop_invoked=False).
    2. build_loop_argv(project_root, phase, config, preset_id, runtime) → LoopArgvResult.
    3. loop_run(launch_card, argv_result, config, loop_runner) → ExecutionResult.
    4. Если config.syncAfterLoop == True (default True) → spawn `hub-board sync --workspace-id <ws>`;
       sync failure → PipelineResult.sync_warning (не override loop exit code).
    5. Return PipelineResult(arm=ArmResult, loop=ExecutionResult, sync_warning=str|None).
  Pokrývá: AC+5, FR-004, FR-011, NFR: fail-closed (arm fail → loop not invoked).

