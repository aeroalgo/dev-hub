goal: |
  Расширить `loop/board_sync/cli.py` и `bin/hub-board` тремя новыми subcommands:
    `hub-board arm --task-id ID [--ledger PATH|--host-url URL] [--dry-run]`
    `hub-board loop --task-id ID [--loop-args TOKEN] [--runtime dsh|claude] [--dry-run]`
    `hub-board arm-loop --task-id ID [--loop-args TOKEN] [--runtime dsh|claude] [--dry-run]`
  CLI читает task по task-id из Host API (или ledger); вызывает board_launch pipeline; print result.
  `--dry-run`: print argv + arm plan, не выполнять.
  `--loop-args`: один токен (validated whitelist); передаётся как preset_id=None + raw arg (или mapped preset lookup).
  `--runtime`: dsh|claude; default claude.
  DEV_HUB missing → fail-closed с clear message.
  Покрывает: AC+10, FR-006, NFR: fail-closed (DEV_HUB missing).

