  - "repair_fn только epic.core symbols или loop.incidents.repairs.* — не динамический edit registry (AC−4)"
  - "ADD loop/incidents/registry.py — load_registry(path), get_chain(diagnostic_code), resolve_callable(import_path)"
  - "ADD loop/incidents/repairs.py — clear_stale_runner_lock, verify_runner_owner для stale_owner entry"
  - "ADD loop/incidents/tier0.py — Tier0Result dataclass; run_tier0_for_incident(cwd, incident) → executes chain, respects max_attempts, sets repair_exhausted"
  - "ADD loop/tests/test_incidents_tier0.py — mark_index_missing fixture → repair → resolved; unknown code → no repair"
  - "ADD loop/tests/fixtures/incidents/mark_index_missing/ — desync index/implement fixture"
