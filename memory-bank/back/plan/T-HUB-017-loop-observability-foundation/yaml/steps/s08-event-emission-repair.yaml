schema: epic-decompose/v1
role: back
plan_id: T-HUB-017-loop-observability-foundation
step_id: s08
title: "Lifecycle projection — incident/repair events в epic events.jsonl"
next_phase: BACK IMPLEMENT
needs_creative: "no"

goal: |
  repair_applied, incident_opened, incident_resolved events пишутся в memory-bank/**/events/<epic>/events.jsonl
  через существующий build_event для lifecycle projection (US-006, SC-006).

as_built:
