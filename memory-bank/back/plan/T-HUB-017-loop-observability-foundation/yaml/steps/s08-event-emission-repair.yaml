  - "Wire call sites: s03 check_after open_incident → incident_opened; tier0 resolve → incident_resolved + repair_applied"
  - "Event kinds: incident_opened, incident_resolved, repair_applied; metadata {repair_fn, diagnostic_code, incident_id}"
  - "Skip emission when epic_id unknown (no events path)"
  - "ADD loop/tests/test_incidents_events.py — tier0 repair → repair_applied in events.jsonl"
  - "§0.11: grep build_event import path ↔ epic_events.py counterpart"
deletes: []
out_of_scope:
  - "webhooks/Telegram (T-HUB-018, AC−2)"
  - "product events outside epic scope"

context:
  consumes:
    - "s02 tier0 resolve path"
    - "s03 check_after open_incident"
    - ".claude/hooks/epic_events.py build_event"
    - "plan FR-010"
  produces:
