checkpoints:
  - id: cp1
    criterion: ".codex/hooks.json после генерации содержит все 8 FR-002 event keys"
    verify: "python3 -c \"import json; h=json.load(open('.codex/hooks.json')); required={'Stop','SubagentStop','PreToolUse','UserPromptSubmit','SessionStart','SubagentStart'}; hooks_keys=set(h.get('hooks',{}).keys()); missing=required-hooks_keys; assert not missing, f'missing: {missing}'\""
  - id: cp2
    criterion: "PostToolUse Bash entry содержит timeout_ms ≥ 45000"
    verify: "python3 -c \"import json; h=json.load(open('.codex/hooks.json')); entries=h.get('hooks',{}).get('PostToolUse',[]); bash_entries=[e for e in entries if e.get('matcher','').lower() in ('bash','shell')]; assert bash_entries and bash_entries[0].get('timeout_ms',0)>=45000, f'bash timeout missing or <45s: {bash_entries}'\""
  - id: cp3
    criterion: "test_codex_hooks_parity_matrix.py green (пройден после regenerate)"
    verify: "bin/pytest loop/tests/test_codex_hooks_parity_matrix.py -q --tb=short"
  - id: cp4
    criterion: ".codex/hooks.meta.json существует и содержит manifest_hash"
    verify: "python3 -c \"import json; m=json.load(open('.codex/hooks.meta.json')); assert m.get('manifest_hash'), 'no manifest_hash'\""

verify:
  - "bin/pytest loop/tests/test_codex_hooks_parity_matrix.py -q --tb=short"
