schema: epic-decompose/v1
role: back
step_id: s02
plan_id: T-HUB-053-codex-claude-hooks-parity
title: Manifest enable all missing codex hooks for runtimes.codex
next_phase: BACK IMPLEMENT
needs_creative: "no"

goal: |
  Edit harness/manifest.yaml: ensure every hook entry that has a Claude settings_key also declares
  runtimes.codex.hooks_json_entry: true (or explicit out_of_scope per FR-012).
  Hooks in scope: session-start, subagent-start, bash-output-cap, agent-posttool, bash-pretool,
  user-prompt (spawn-validate). Out of scope (FR-012): session-end, permission-request,
  pre/post-compact — explicitly marked out_of_scope in manifest comment, not added.
  Outcome: manifest is single source of truth; generator (s03) can enumerate without guesswork.

context:
  consumes:
    - harness/manifest.yaml           # current hooks registry
    - .claude/settings.json           # authoritative Claude hooks set
  produces:
    - harness/manifest.yaml           # updated: all in-scope hooks have codex entry
  plan_refs:
    - FR-001
    - FR-004
    - FR-012
    - TM-004

  files:
    - harness/manifest.yaml

as_built:
  - "harness/manifest.yaml: stop-gate, subagent-stop, agent-pretool have hooks_json_entry: true; session-start, subagent-start, bash-output-cap, agent-posttool, bash-pretool, user-prompt missing or not declared for codex"

delta:
