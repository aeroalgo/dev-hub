  - "Add runtimes.codex.hooks_json_entry: true to subagent-start hook entry"
  - "Add runtimes.codex.hooks_json_entry: true to bash-output-cap hook entry"
  - "Add runtimes.codex.hooks_json_entry: true to agent-posttool hook entry"
  - "Add runtimes.codex.hooks_json_entry: true to bash-pretool hook entry"
  - "Add runtimes.codex.hooks_json_entry: true to user-prompt (spawn-validate) hook entry"
  - "Add out_of_scope: codex comment for session-end, permission-request, pre/post-compact (FR-012 compliance)"

deletes: []

out_of_scope:
