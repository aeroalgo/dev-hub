  - "Actual .codex/hooks.json regeneration (s03)"
  - "session-end / permission-request / pre/post-compact hooks — FR-012 forbids"

skills:
  code_surface: api
  impl: []

checkpoints:
  - id: cp1
    criterion: "Все in-scope hooks имеют codex entry в manifest (≥9 hooks)"
    verify: "python3 -c \"import yaml; m=yaml.safe_load(open('harness/manifest.yaml')); hooks=m.get('hooks',{}); missing=[k for k,v in hooks.items() if 'claude' in v.get('runtimes',{}) and 'codex' not in v.get('runtimes',{}) and k not in ('session-end','permission-request','pre-compact','post-compact')]; print('missing:',missing); assert not missing\""
  - id: cp2
    criterion: "Out-of-scope hooks (SessionEnd, PermissionRequest) отсутствуют в runtimes.codex"
    verify: "rg 'session-end|permission-request|pre-compact|post-compact' harness/manifest.yaml | rg 'codex' && echo FAIL || echo OK"
  - id: cp3
    criterion: "harness/manifest.yaml parses without error"
    verify: "python3 -c \"import yaml; yaml.safe_load(open('harness/manifest.yaml')); print('ok')\""

verify:
