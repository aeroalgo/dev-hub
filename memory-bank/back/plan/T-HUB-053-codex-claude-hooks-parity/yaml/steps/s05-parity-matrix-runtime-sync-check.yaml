checkpoints:
  - id: cp1
    criterion: "runtime-sync --check exits 1 при удалённом событии из .codex/hooks.json"
    verify: "python3 -c \"import json,copy,tempfile,subprocess,os; h=json.load(open('.codex/hooks.json')); h2=copy.deepcopy(h); h2['hooks'].pop('Stop',None); f=tempfile.NamedTemporaryFile(suffix='.json',delete=False,mode='w'); json.dump(h2,f); f.close(); r=subprocess.run(['python3','-m','loop.cli.runtime_sync','--check','--hooks-json',f.name],capture_output=True); os.unlink(f.name); assert r.returncode!=0, 'expected non-zero on missing Stop'\""
  - id: cp2
    criterion: "runtime-sync --check exits 0 при полном наборе событий"
    verify: "python3 -m loop.cli.runtime_sync --check --hooks-json .codex/hooks.json; echo exit=$?"
  - id: cp3
    criterion: "test_runtime_sync_check.py green"
    verify: "bin/pytest loop/tests/test_runtime_sync_check.py -q --tb=short"
  - id: cp4
    criterion: "REQUIRED_CODEX_EVENTS определён и содержит ≥7 событий"
    verify: "python3 -c \"from loop.runtime_materializers.parity import REQUIRED_CODEX_EVENTS; assert len(REQUIRED_CODEX_EVENTS)>=7, len(REQUIRED_CODEX_EVENTS)\""

