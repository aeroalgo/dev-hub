grep_control:
  - id: inv-a-01
    kind: A
    symbol: nested SKILL.md independent SoT
    command: "python -c \"from pathlib import Path; root=Path('harness/skills'); print((root/'skills').exists())\""
    expect: no dual different-hash SKILL.md
  - id: inv-a-02
    kind: A
    symbol: resolve_skill dual search
    command: "rg -n \"resolve_skill|skills/skills\" loop/ harness/hooks/ --glob '*.py' | rg -v '/tests/|test_' || true"
    expect: no prod dual-search
  - id: inv-a-tests-01
    kind: A
    symbol: obsolete nested-layout asserts
    command: "rg -n \"skills/skills/.*/SKILL.md\" loop/tests/ harness/hooks/tests/ || true"
    expect: no asserts requiring nested as SoT
  - id: inv-b-01
    kind: B
    symbol: nested skills entrypoint
    command: "rg -n \"skills/skills\" docker-compose*.yml Dockerfile* Makefile bin/ || true"
    expect: no output
  - id: inv-c-01
    kind: C
    symbol: nested-if-404 fallback
    command: "rg -n \"skills/skills\" loop/ harness/hooks/ --glob '*.py' | rg -v '/tests/' || true"
    expect: no fallback/dual-path in prod
  - id: inv-i-01
    kind: I
    symbol: nested-as-SoT instructions
    command: "rg -n \"\\.agents/skills/skills/\" .cursor/rules .claude/skills harness/claude --glob '*.mdc' --glob '*.md' || true"
    expect: no nested-as-SoT in active instruction surfaces

