sunset_inventory:
  - symbol: ".agents/skills/skills/<name>/SKILL.md"
    kind: A
    replacement: ".agents/skills/<name>/SKILL.md"
    policy: delete in-epic
    rg_scope: ".agents/skills/skills harness/skills/skills"
    expect: no second SKILL.md with different hash; dir empty or README-only or symlink to canon
  - symbol: harness/skills/skills/<name>/ as SoT
    kind: A
    replacement: harness/skills/<name>/SKILL.md
    policy: delete in-epic
    rg_scope: harness/skills/
    expect: nested not independent SoT
  - symbol: resolve_skill dual search / nested fallback
    kind: A
    replacement: literal Path.exists only
    policy: delete in-epic
    rg_scope: loop/ harness/hooks/
    expect: zero prod callers
  - symbol: tests asserting nested skills/skills as required layout
    kind: A
    replacement: tests on canonical path
    policy: delete in-epic
    rg_scope: loop/tests/ harness/hooks/tests/
    expect: case absent or rewritten
  - symbol: compose/CLI nested skills entrypoint
    kind: B
    replacement: n/a (checker pytest)
    policy: n/a
    rg_scope: docker-compose*.yml Dockerfile* Makefile bin/
    expect: zero nested-skills CMD
  - symbol: "попробуй nested если 404"
    kind: C
    replacement: raise / pytest fail
    policy: delete in-epic
    rg_scope: loop/ harness/hooks/
    expect: zero fallback dual-path
  - symbol: skip missing skill in workflow load
    kind: C
    replacement: fail Read / CI
    policy: delete in-epic
    rg_scope: loop/ .cursor/rules/
    expect: no skip-missing soft default
  - symbol: docs teaching skills/skills/ as SoT
    kind: I
    replacement: ".agents/skills/<name>/"
    policy: delete in-epic
    rg_scope: .cursor/rules/ .claude/skills/ harness/claude/
    expect: zero nested-as-SoT instructions in active rules/skills
  - symbol: role-command nested mention
    kind: I
    replacement: canonical
    policy: delete in-epic
    rg_scope: .claude/skills/role-command/SKILL.md harness/claude/skills/role-command/SKILL.md
    expect: canonical only

deletes:
  - "harness/skills/skills/<name>/SKILL.md leftover independent copies"
  - ".agents/skills/skills/<name>/SKILL.md leftover independent copies"
  - "resolve_skill dual-search if present"
  - "obsolete tests requiring nested layout as SoT"
