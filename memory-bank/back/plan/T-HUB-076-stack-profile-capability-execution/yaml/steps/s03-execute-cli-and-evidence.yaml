schema: epic-decompose/v1
role: back
step_id: s03
plan_id: T-HUB-076-stack-profile-capability-execution
title: JSON execute CLI persists target-bound capability evidence atomically
next_phase: BACK IMPLEMENT
needs_creative: "no"

goal: |
  Operators and later workflow gates receive the same safe, machine-readable execution
  outcome from API and CLI. Successful and unsuccessful attempts produce only target-bound
  evidence with a declaration fingerprint, so prose, a copied command or a result from a
  different role, epic or step cannot become proof.

plan_contract:
  fr_ids: [FR-004, FR-005]
  nouns:
    - python -m loop.stack_profiles execute
    - stack-capability-execution/v1
    - CapabilityExecutionEvidence
    - atomic sidecar
    - declaration fingerprint
    - role/epic_id/step_id
  layout_paths:
    - loop/stack_profiles/__main__.py
    - loop/stack_profiles/evidence.py
    - loop/stack_profiles/execution.py
    - loop/tests/test_stack_profile_execute_cli.py
    - loop/tests/test_stack_profile_evidence.py
  ac_quotes:
    - "CLI and API expose the same typed JSON result and stable non-zero mapping for configuration, spawn, timeout and delegated-command failure."
    - "Evidence is deterministic, atomic and cannot be reused across target, step, epic or declaration fingerprint."
  plan_jumps:
    - "memory-bank/back/plan/T-HUB-076-stack-profile-capability-execution/md/plan.md:211-235"
    - "memory-bank/back/plan/T-HUB-076-stack-profile-capability-execution/md/plan.md:353-374"

