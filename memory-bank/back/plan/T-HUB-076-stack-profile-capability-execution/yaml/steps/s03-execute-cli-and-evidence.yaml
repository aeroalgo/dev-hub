    - loop/tests/test_stack_profile_execute_cli.py
    - loop/tests/test_stack_profile_evidence.py

as_built:
  - loop/stack_profiles/__main__.py supports resolver-oriented commands but no execute result protocol.
  - No deterministic capability sidecar exists under memory-bank execution artifacts.
  - Existing workflow evidence can be prose or command-oriented and has no declaration fingerprint binding.

delta:
  - Add JSON-first execute CLI that accepts the typed declaration identity, delegates only to s02 executor and maps statuses to exits 0, 2, 3, 4 or child-safe failure exit.
  - Add validate-on-write sidecar persistence using an atomic replace and a deterministic fingerprinted relative path; never serialize output body or secret environment.
  - Add strict evidence read/match helpers that bind role, epic_id, step_id, decompose reference, target and declaration fingerprint.
  - Test CLI/API parity with fake targets and test successful, failing, stale and cross-step evidence without calling host cargo/npm scripts.

deletes: []

out_of_scope:
  - check-after selects and writes evidence for the armed workflow step in s04.
  - Finish consumes evidence versus declarations in s05.
  - Generic shell-proof and instruction surfaces are purged in s05/s06.

