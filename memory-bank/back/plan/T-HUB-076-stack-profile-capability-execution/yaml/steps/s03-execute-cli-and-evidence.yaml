    - s02 execute_capability typed outcome boundary
    - loop/stack_profiles/__main__.py existing JSON CLI conventions
  produces:
    - execute subcommand with JSON-first result and documented exit mapping
    - atomic evidence write/read under memory-bank/<role>/execution/<epic>/<step>/capability-<fingerprint>.json
    - evidence reader that rejects stale, foreign or fingerprint-mismatched proof
  plan_refs:
