title: Resolver-owned argv executor reports bounded typed process outcomes
next_phase: BACK IMPLEMENT
needs_creative: "no"

goal: |
  A valid declaration now reaches exactly one resolver-owned command execution; every normal
  or operational failure is a typed result rather than a guessed fallback. Python, Rust and
  JavaScript targets prove that argv, cwd and deadline originate only from resolution, while
  invalid resolution proves that no process is spawned.

