    - resolver-owned argv
    - resolution.cwd
    - timeout_seconds
    - CapabilityExecutionResult
    - subprocess.Popen
  layout_paths:
    - loop/stack_profiles/execution.py
    - loop/stack_profiles/schemas.py
    - loop/tests/test_stack_profile_executor.py
    - loop/tests/test_stack_profile_execution_integration.py
  ac_quotes:
    - "Python, cargo test --all-targets and selected JS manager run with exact resolver argv/cwd."
    - "Resolver or validation failure makes zero target subprocess calls; no hub command or retry is substituted."
  plan_jumps:
    - "memory-bank/back/plan/T-HUB-076-stack-profile-capability-execution/md/plan.md:107-161"
    - "memory-bank/back/plan/T-HUB-076-stack-profile-capability-execution/md/plan.md:226-237"

