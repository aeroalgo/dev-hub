as_built:
  - loop/stack_profiles/resolver.py safely resolves argv, cwd and timeout but performs no subprocess work.
  - loop/stack_profiles/__main__.py exposes resolve-oriented output but no executor command.
  - No profile executor currently owns timeout kill/collect, spawn diagnostics or bounded process metadata.

delta:
  - Implement the public executor accepting only project root and the typed declaration; call resolve_capability once and invoke Popen with resolution.argv, resolution.cwd, shell=False and resolver timeout.
  - Translate resolution diagnostics to resolution_failed without calling Popen; translate OSError, timeout kill-and-collect and non-zero exit to the specified result statuses and exit data.
  - Count and cap stdout/stderr metadata without using output as structured input, persisting output bodies or importing generic runtime/board dispatchers.
  - Add temporary py/rs/web profile fixtures with fake binaries/managers to assert one exact argv/cwd execution per explicit target.

