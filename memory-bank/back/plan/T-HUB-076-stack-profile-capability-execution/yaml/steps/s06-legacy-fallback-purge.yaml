as_built:
  - test_run_canon.py and tests_format.py still expose generic command-prefix authority that predates typed managed evidence.
  - check-after previously allowed a green lifecycle path without executing declared managed checks.
  - BACK, INTEG, shared and Claude role guidance contain Python runner wording that must distinguish hub tests from managed-project capability checks.

delta:
  - Remove or rewrite all residual A/B/C code and lifecycle paths identified in the plan so managed declarations cannot route to generic prefix parsing, raw tests strings, default targets, retries or hub tests.
  - Rewrite Kind I instructions to require an explicit managed capability declaration/evidence path while preserving hub runner commands only under an explicit hub exception.
  - Preserve FRONT parent-only test authority in wording and add no browser capability vocabulary or executor dispatch.
  - Add an instruction-inventory regression test and record A/B/C/I sunset scan evidence plus anti-dual-path commands in the implementation artifact.

deletes:
  - Generic managed-project workflow-process authority in harness/hooks/tests_format.py::is_allowed_test_command
  - Universal managed evidence extraction through harness/hooks/tests_format.py::extract_test_commands_from_yaml_tests
  - Managed-target command authority through harness/hooks/test_run_canon.py::ALLOWED_TEST_PREFIXES
  - check-after green path without declared managed capability execution
  - Generic managed-backend pytest wording in BACK core and lean workflow instructions
  - Generic managed API pytest wording in INTEG core and lean workflow instructions
  - Universal pytest wording in harness/claude/skills/role-command/SKILL.md
  - format_spec_lines prose claiming loop runs YAML shell strings

