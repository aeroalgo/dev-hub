  The profile capability boundary is the only managed-project verification path in code,
  lifecycle entrypoints, fallbacks and instructions. This final cutover removes every
  remaining generic Python command prescription for managed work, retains a clearly marked
  hub exception, and proves via full sunset inventory that no old authority, optional path
  or stale guidance can restore a green workflow.

