checkpoints:
  - id: cp1
    criterion: "Kind A: generic managed prefix/parser authority is deleted or confined to the explicit hub-only branch; obsolete tests assert the new evidence contract."
    verify: "rg -n 'is_allowed_test_command|extract_test_commands_from_yaml_tests|ALLOWED_TEST_PREFIXES' harness/hooks --glob '*.py'"
  - id: cp2
    criterion: "Kind B: no check-after or CLI entrypoint can continue a managed workflow without declared-check execution and matching evidence."
    verify: "rg -n 'check_after|capability_checks|execute_capability|capability_evidence' loop/context_loop.py loop/stack_profiles/__main__.py harness/hooks/epic_yaml.py"
  - id: cp3
    criterion: "Kind C: no managed path falls back to a raw tests string, default target, hub pytest command or retry after resolver/execution failure."
    verify: "! rg -n 'fallback.*(pytest|tests:|default_target)|retry.*(pytest|cargo|npm)|managed.*(bin/pytest|[.]venv/bin/pytest)' loop harness/hooks --glob '*.py'"
  - id: cp4
    criterion: "Kind I: managed instructions name capability declaration/evidence and no longer teach generic Python commands as the managed default; hub exception and FRONT parent-only boundary remain explicit."
    verify: "bin/pytest loop/tests/test_stack_profile_instruction_inventory.py -q --tb=line"

