    - loop/tests/test_stack_profile_instruction_inventory.py
  kind_hint: [A, B, C, I]

out_of_scope:
  - Adding test.e2e, browser runner execution, custom/remote profiles, profile-version floors or package installation.
  - Changing hub test execution itself into a managed project profile.
  - Automatic repair/retry, streaming UI and preserving raw command compatibility.

