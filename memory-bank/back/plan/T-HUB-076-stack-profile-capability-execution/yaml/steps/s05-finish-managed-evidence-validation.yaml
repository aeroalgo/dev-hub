    - loop/tests/test_finish_capability_evidence.py

as_built:
  - harness/hooks/tests_format.py and test_run_canon.py treat command prefixes as generic workflow test evidence authority.
  - harness/hooks/epic_yaml.py validates tests entries but cannot require sidecar identity for a managed declaration.
  - Hub test fixtures must remain usable without a manifest or profile executor call.

delta:
  - Detect managed capability declarations in decompose/implement validation and require typed evidence for each current fingerprint before validation or finish accepts proof.
  - Preserve a separate explicit hub branch for hub tests; narrow its command validation to hub work and prevent it from inferring a managed target or calling the executor.
  - Reject raw tests-only proof, stale sidecars and evidence bound to a different role, epic, step, target or declaration with capability_evidence_missing_or_mismatch.
  - Rewrite fixture expectations around the new distinction without deleting coverage for the existing hub test-format behavior.

deletes:
  - harness/hooks/tests_format.py generic managed-project authority of is_allowed_test_command
  - harness/hooks/tests_format.py universal managed-evidence use of extract_test_commands_from_yaml_tests
  - harness/hooks/test_run_canon.py managed-target authority of ALLOWED_TEST_PREFIXES
  - harness/hooks/epic_yaml.py format_spec_lines assertion that loop executes all YAML tests strings as shell commands

out_of_scope:
  - Broad instruction-surface purge is s06 so the machine validator is complete before prose changes.
  - The resolve CLI remains a read-only operation and is not removed.
  - Hub test runner behavior is not migrated to a managed profile.

