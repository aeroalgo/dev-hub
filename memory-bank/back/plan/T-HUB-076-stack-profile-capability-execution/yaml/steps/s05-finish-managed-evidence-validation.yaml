    - "Existing hub fixtures remain accepted and verify zero profile-executor calls."
  plan_jumps:
    - "memory-bank/back/plan/T-HUB-076-stack-profile-capability-execution/md/plan.md:107-161"
    - "memory-bank/back/plan/T-HUB-076-stack-profile-capability-execution/md/plan.md:307-345"

