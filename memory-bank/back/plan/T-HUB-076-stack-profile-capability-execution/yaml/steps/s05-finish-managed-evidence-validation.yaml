plan_id: T-HUB-076-stack-profile-capability-execution
title: Finish validation distinguishes managed capability evidence from hub tests
next_phase: BACK IMPLEMENT
needs_creative: "no"

goal: |
  Completion proof becomes fail-closed and unambiguous. A managed-project implement step
  cannot pass using a raw tests string, copied sidecar or Python hub command, while a hub
  step remains independently valid through its explicit hub-test contract and never invokes
  the profile executor.

