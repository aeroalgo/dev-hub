grep_control:
  - id: inv-a-01
    kind: A
    symbol: DshAdapter
    command: 'rg -n "DshAdapter" loop/ harness/ --glob "*.py" || true'
    expect: "no output"
  - id: inv-a-02
    kind: A
    symbol: dsh in runtime_registry.yaml
    command: 'rg -n "^  dsh:" loop/runtime_registry.yaml || true'
    expect: "no output"
  - id: inv-a-03
    kind: A
    symbol: get_dsh_preset
    command: 'rg -n "get_dsh_preset" loop/ harness/ || true'
    expect: "no output"
  - id: inv-a-04
    kind: A
    symbol: dsh_stream_filter
    command: 'test ! -f harness/hooks/dsh_stream_filter.py'
    expect: "exit 0"
  - id: inv-a-05
    kind: A
    symbol: dsh directory
    command: 'test ! -d dsh'
    expect: "exit 0"
  - id: inv-b-01
    kind: B
    symbol: bin/loop dsh support
    command: 'rg -n "dsh\)" bin/loop || true'
    expect: "no output"
  - id: inv-c-01
    kind: C
    symbol: DSH_HOOKS_BRIDGE in prod
    command: 'rg -n "DSH_HOOKS_BRIDGE" loop/ harness/hooks/ || true'
    expect: "no output"
  - id: inv-i-01
    kind: I
    symbol: DSH teaching in AGENTS.md / CLAUDE.md
    command: 'rg -n "DSH.*AGENTS\.md|DSH.*CLAUDE\.md" AGENTS.md CLAUDE.md || true'
    expect: "no output"
