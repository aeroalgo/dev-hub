title: "stop-gate + agent-pretool/subagent-stop registry-driven (phase gates from registry)"
next_phase: BACK IMPLEMENT
needs_creative: "no"

goal: |
  Перевести `.claude/hooks/stop-gate.py` и `agent-pretool.py` на registry-driven phase gates:
  finish_gates берутся из `get_phase_config(phase)["finish_gates"]` вместо hardcoded logic.
  stop-gate: gates list → validate each (cli/artifact type). Unknown gate type → fail-closed.
  subagent-stop: verify_agent берётся из `get_verify_agent(phase)` вместо hardcoded "@verify"/"@reviewer".
  Тесты: phase DECOMPOSE → validate-decompose-tree gate; IMPLEMENT → validate-step gate.

context:
  consumes:
    - .claude/hooks/stop-gate.py                 # текущая реализация finish gates
    - .claude/hooks/agent-pretool.py             # subagent-stop / verify agent wiring
    - loop/schemas/phase_registry.yaml           # s06/s07: registry с finish_gates + verify_agent
    - loop/epic_transition.py                    # s06: get_phase_config; s07: get_verify_agent
    - loop/tests/test_stop_gate.py               # regression baseline (все тесты)
  produces:
    - .claude/hooks/stop-gate.py                 # gates из registry; unknown gate type fail-closed
    - .claude/hooks/agent-pretool.py             # verify agent из get_verify_agent(phase)
    - loop/tests/test_stop_gate.py               # test_stop_gate_uses_registry_gates (DECOMPOSE + IMPLEMENT)
  plan_refs:
    - FR-009
    - FR-010
    - US-004
    - US-005
    - NFR-1
    - NFR-2
  files:
    - .claude/hooks/stop-gate.py
    - .claude/hooks/agent-pretool.py
    - loop/tests/test_stop_gate.py

as_built:
  - .claude/hooks/stop-gate.py — finish gates определяются через `gates_from_phase(phase)` (hardcoded in core.py); после s06 gates_from_phase читает из registry; stop-gate сам не читает registry напрямую
  - .claude/hooks/agent-pretool.py — verify agent hardcoded как "@verify" / "@reviewer"; нет get_verify_agent lookup
  - loop/tests/test_stop_gate.py — 1226+ тестов gates_from_phase; regression baseline

delta:
  - '.claude/hooks/stop-gate.py: gate validation loop — для каждого gate из gates_from_phase(phase): if gate type == "cli" → subprocess validate cli tool; if gate type == "artifact" → glob check; else → raise ValueError(f"unknown gate type {gate_type!r}: fail-closed")'
  - '.claude/hooks/stop-gate.py: import get_phase_config from loop.epic_transition; используется для verify_agent lookup при FINISH'
  - '.claude/hooks/agent-pretool.py: при spawn verify: `verify_agent = get_verify_agent(current_phase)` из loop.epic_transition вместо hardcoded строки; None (optional) → skip without error'
  - 'loop/tests/test_stop_gate.py: test_stop_gate_decompose_uses_validate_decompose_tree — phase=DECOMPOSE → gate cli=validate-decompose-tree invoked'
  - 'loop/tests/test_stop_gate.py: test_stop_gate_implement_uses_validate_step — phase=IMPLEMENT → gate cli=validate-step invoked'
  - 'loop/tests/test_stop_gate.py: test_stop_gate_unknown_gate_type_fails_closed — custom gate type "BOGUS" → ValueError'

deletes: []
# Hardcoded gate strings в stop-gate.py заменяются registry lookup; shim не нужен (внутренний файл)

