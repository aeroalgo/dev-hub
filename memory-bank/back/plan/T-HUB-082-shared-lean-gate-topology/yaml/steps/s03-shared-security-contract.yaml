    criterion: "The shared security owner contains common path, artifact, no-code, findings and PLAN/DECOMPOSE gates."
    verify: "rg -n 'Path rule|SECURITY не чинит код|Findings|PLAN-only|DECOMPOSE-only|next_phase' harness/cursor/rules/shared/_lean/security.mdc"
  - id: cp2
    criterion: "BACK, FRONT and INTEG patch markers preserve each real priority/next delta without copied common prose."
    verify: "rg -n 'role-patch|BACK|FRONT|INTEG|XSS|tokens|CSP|wire×authz×IDOR×contract|GAP' harness/cursor/rules/{back_developer,front_developer,integration_developer}/isolation_rules/_lean/security.mdc"
  - id: cp3
    criterion: "Security workflow callers name the shared common owner and their patch; no role silently falls back to another role."
    verify: 'rg -n "shared/_lean/security\.mdc|role patch|patch" harness/cursor/rules/{back_developer,front_developer,integration_developer}/workflow-security.mdc harness/cursor/rules/{back_developer,front_developer,integration_developer}/isolation_rules/_lean/security.mdc'
  - id: cp4
    criterion: "Corpus detects a missing security role patch and common-body duplication."
    verify: "rg -n 'missing.*patch|common.*body|security' harness/hooks/tests/test_shared_lean_gate_topology.py"

verify:
  - "rg -n 'XSS|tokens|CSP|bundle|wire×authz×IDOR×contract|GAP' harness/cursor/rules/{front_developer,integration_developer}/isolation_rules/_lean/security.mdc"
  - "bin/pytest harness/hooks/tests/test_shared_lean_gate_topology.py -k security -q --tb=line"

