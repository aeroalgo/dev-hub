    - harness/cursor/rules/front_developer/isolation_rules/_lean/security.mdc
    - harness/cursor/rules/integration_developer/isolation_rules/_lean/security.mdc
    - harness/cursor/rules/back_developer/workflow-security.mdc
    - harness/cursor/rules/front_developer/workflow-security.mdc
    - harness/cursor/rules/integration_developer/workflow-security.mdc
  ac_quotes:
