as_built:
  - "All three security lean files carry the same path/artifact/no-code/PLAN/DECOMPOSE gates."
  - "BACK has the base priority-matrix wording; FRONT replaces it with XSS/tokens/CSP/bundle/deps; INTEG replaces it with wire×authz×IDOR×contract and adds GAP to the code-fix split."
  - "Each security workflow points to its role-local security lean file and shared workflow-security-epic policy."

delta:
  - "Extract common security gates into harness/cursor/rules/shared/_lean/security.mdc without changing their behavior."
  - "Replace copied role-local security.mdc bodies with named patch markers that contain only real role deltas and retain role path/next semantics."
  - "The common security gate body in role-local security.mdc files is reserved for deletion by s05 after patch wiring."
  - "Rewire harness/cursor/rules/back_developer/workflow-security.mdc, harness/cursor/rules/front_developer/workflow-security.mdc and harness/cursor/rules/integration_developer/workflow-security.mdc to shared common contract plus role patches."
  - "Extend harness/hooks/tests/test_shared_lean_gate_topology.py to fail if a required patch disappears or a common body is duplicated."

deletes:
  - "duplicated common security gate body from role-local _lean/security.mdc files"

out_of_scope:
  - "Changing security permissions, findings severity order, artifact ownership or next SECURITY semantics."
  - "Merging FRONT UI semantics or INTEG GAP policy into the shared common body."
  - "Security audit execution or code fixes."

skills:
  code_surface: docs
  impl: []

checkpoints:
