  recover_finish_transaction() до agent work. leftover prepared/context_written/
  index_written → commit remainder or rollback — never mixed identity.
  Corrupt journal → fail-closed NEED_HUMAN. Exception-only backup restore
  больше не единственная crash-стратегия.

