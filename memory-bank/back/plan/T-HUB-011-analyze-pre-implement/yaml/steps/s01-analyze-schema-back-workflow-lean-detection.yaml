goal: |
  Создать foundational слой команды ANALYZE (read-only pre-implement analysis):
  - `.cursor/templates/analyze/epic-analyze.yaml` — шаблон артефакта `memory-bank/{role}/analyze/<epic_id>/analyze-YYYYMMDD-<slug>.yaml` со schema `epic-analyze/v1`
  - `.cursor/rules/shared/workflow-analyze-core.mdc` — optional DRY core detection passes (Duplication, Ambiguity, Underspecification, Coverage Gaps, Inconsistency, Constitution)
  - `.cursor/rules/back_developer/workflow-analyze.mdc` — BACK-специфичный workflow wrapper: когда запускать, gates (STRICTLY READ-ONLY), Handoff → IMPLEMENT или fix (CLARIFY/PLAN/DECOMPOSE)
