delta:
  - "CREATE .cursor/templates/analyze/epic-analyze.yaml:
      - Frontmatter (schema: epic-analyze/v1)
      - `findings[]`: {id, severity (CRITICAL|HIGH|MEDIUM|LOW), category, message, plan_ref?, step_ref?}
      - `coverage[]`: {requirement_id, step_ids[], status (covered|partial|missing)}
      - `metrics`: {coverage_pct, critical_count, high_count, findings_total}
      - `recommendation`: IMPLEMENT | fix (CLARIFY|PLAN|DECOMPOSE)
      - `next_actions[]`: CRITICAL → fix list; else empty
      - Optional: `constitution_violations[]` если constitution.md exists"
  - "CREATE .cursor/templates/analyze/README.md:
      - Кратко: что такое ANALYZE; отличие от AUDIT; когда запускать
      - Ссылка на workflow-analyze.mdc + шаблон"
  - "CREATE .cursor/rules/shared/workflow-analyze-core.mdc (optional DRY):
      - Frontmatter (description, alwaysApply: false)
      - §Detection passes (6 категорий):
          - Duplication: дублирующиеся FR/SC/steps (terminology/entities)
          - Ambiguity: vague adj (should, may, appropriate, typically) + unresolved [НУЖНО УТОЧНИТЬ] markers
          - Underspecification: FR без sNN; step без plan_ref/FR; goal-only без delta
          - Coverage Gaps: AC+/AC−/FR/NFR/SC без sNN и без out_of_scope
          - Inconsistency: terminology drift (FR vs step title); entity names differ; order mismatch
          - Constitution (если файл есть): MUST violations → CRITICAL
      - §Severity heuristic: CRITICAL (P1/FR core missing + unresolved CRITICAL markers); HIGH (coverage <80% или >3 HIGH); MEDIUM (gaps non-core); LOW (naming/style)
      - §Deterministic IDs: A1, A2… (category prefix) — stable при повторном прогоне без изменений
      - §50-cap: findings table ≤50 строк; overflow → summary"
  - "CREATE .cursor/rules/back_developer/workflow-analyze.mdc:
      - Frontmatter
      - @core ref: .cursor/rules/back_developer/mainrule-core.mdc + shared/workflow-analyze-core.mdc
      - @lean: .cursor/rules/back_developer/isolation_rules/_lean/analyze.mdc
      - §Когда запускать: после `* DECOMPOSE` FINISH, **до** первого `* IMPLEMENT`; re-run после существенного rewrite plan/decompose
      - §Вход: 'BACK ANALYZE <epic_id>' (epic_id = T-xxx или slug из plan)
      - §Load (lean, NFR-1): plan-<epic>.md (headers: FR/AC/stories jump), decompose-*/index.md (coverage), index.yaml (step list), sample sNN headers/`goal`/`plan_refs` — **не** полный текст всех shards без нужды
      - §Процесс:
          1) Build inventories: FR/SC/stories vs sNN plan_refs/goals
          2) Run detection passes (core) → assign severity
          3) Write analyze-*.yaml (read-only else)
          4) If critical>0: Next = fix (CLARIFY/PLAN/DECOMPOSE); else: Next = IMPLEMENT s01
      - §Артефакт: memory-bank/back/analyze/<epic_id>/analyze-YYYYMMDD-<slug>.yaml
      - §STRICTLY READ-ONLY: НЕ модифицировать decompose/implement/code; НЕ запускать pytest/vitest (NFR-3, NFR-4)
      - §Done When: analyze artifact written; findings table + coverage summary + metrics + recommendation; CRITICAL → не стартовать IMPLEMENT без fix/defer
      - §Handoff: next BACK IMPLEMENT s01 | BACK CLARIFY/PLAN/DECOMPOSE (если critical>0)"
  - "CREATE .cursor/rules/back_developer/isolation_rules/_lean/analyze.mdc:
      - Frontmatter (description: 'ANALYZE gates — lean load + STRICTLY READ-ONLY', alwaysApply: false)
      - §Gates:
          - load_now = plan artifact (headers) + decompose index (coverage) + activeContext; НЕ полный текст всех shards
          - НЕ читать implement yaml (их ещё нет)
          - STRICTLY READ-ONLY: НЕ модифицировать decompose/implement/code
          - НЕ запускать pytest/vitest в ANALYZE
      - §Abort:
          - ANALYZE без epic_id → reject (нет ad-hoc режима)
          - Попытка править код → FAIL
          - Запуск тестов → FAIL
      - §NFR-5 boundary: Do Not Touch AUDIT schema (012), clarify UX (010), loop.sh gates
      - §AC− #1 documented: ANALYZE ≠ AUDIT; не создавать sNN-audit-*"

