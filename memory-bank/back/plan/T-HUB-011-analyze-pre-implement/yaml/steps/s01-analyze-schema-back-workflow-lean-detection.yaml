  Outcome: после DECOMPOSE агент может запустить `BACK ANALYZE @epic`, получить детерминированный отчёт (findings ≤50 строк + coverage % + critical count), CRITICAL → не стартовать IMPLEMENT без fix/defer.
  Связь с Goal/NFR: FR-1, FR-3, FR-4, FR-5, NFR-1, NFR-2, NFR-3, NFR-4, NFR-5, AC+ #2, #5; AC− #1, #2, #3, #4.

