goal: |
  Создать `loop/hub_claude_patch.py` — модуль с функцией patch_claude_md(path, block_content).
  Логика: если файл существует → replace inner content между markers (preserve user content outside);
  если маркеры отсутствуют → append marker block в конец файла;
  если файл отсутствует → create с marker block.
  Вызывается из `hub-link --mode=alongside` (s03 интегрирует вызов после s04 готов).
  Outcome: CLAUDE.md user content never lost; idempotent (re-run = same result).

