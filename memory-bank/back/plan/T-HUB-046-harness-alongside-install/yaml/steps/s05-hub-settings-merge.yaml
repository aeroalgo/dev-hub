goal: |
  Создать `loop/hub_settings_merge.py` — модуль merge_settings(user_path, harness_path, backup=True).
  Логика: deep-merge `hooks` секции из harness settings в user settings.json;
  preserve user `permissions` (не перезаписывать без --force-merge);
  сохранить snapshot `.claude/settings.json.hub-backup` перед изменением;
  если user settings.json отсутствует → copy/symlink harness settings целиком.
  Вызывается из hub-link alongside.
  Outcome: merge hooks без потери user permissions; rollback возможен через backup.

