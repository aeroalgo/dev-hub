schema: epic-decompose/v1
role: back
step_id: s03
plan_id: T-HUB-036-harness-decompose-formulas
title: "formula-render CLI — materialize draft decompose sNN shards from formula"
next_phase: BACK IMPLEMENT
needs_creative: "no"

goal: |
  CLI `formula-render` принимает `--formula <id>`, `--epic-id T-xxx`, `--slug <slug>`,
  `--dry-run` или `--out <dir>`. Рендерит index.yaml skeleton + sNN-<slug>.yaml (по одному
  на каждый step формулы) путём merge с `.cursor/templates/decompose/epic-step.yaml`.
  В dry-run — печатает в stdout; в --out — пишет файлы (не перезаписывает без --force).
  Outcome: planner получает полный черновик decompose dir за одну команду;
  дальше вручную заполняет placeholder'ы и коммитит.

context:
  consumes:
    - "loop/schemas/formula.py — load_formula(), DecomposeFormula (s01)"
    - "loop/formulas/*.yaml — bundled formula files (s02)"
    - ".cursor/templates/decompose/epic-step.yaml — base template для sNN merge"
    - ".cursor/templates/decompose/index.yaml — base template для index"
  produces:
    - "loop/formula_render.py — render_formula(formula, epic_id, slug, out_dir, dry_run, force) → list[str] (written paths)"
    - ".claude/hooks/epic_resolve.py (или отдельный bin/formula-render) — CLI entrypoint subcommand или standalone script"
    - "loop/formulas/ runtime: resolved formula YAML lookup по id"
  plan_refs: [FR-003, FR-004, US-001]
  files:
    - "loop/formula_render.py"
    - ".claude/hooks/epic_resolve.py"

as_built:
