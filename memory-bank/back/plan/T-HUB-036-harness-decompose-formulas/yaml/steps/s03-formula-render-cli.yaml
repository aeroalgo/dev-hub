  - "loop/schemas/formula.py — load_formula() готова (s01)"
  - ".cursor/templates/decompose/epic-step.yaml — static YAML template; нужно читать как base и merge с formula step"
  - "loop/formulas/*.yaml — formula files (s02)"

delta:
  - "создать loop/formula_render.py: find_formula_file(formula_id) → Path (ищет в loop/formulas/); render_step(formula_step, step_idx, plan_id, slug) → dict (merge epic-step.yaml base + formula step fields); render_formula(formula_id, epic_id, slug, out_dir=None, dry_run=False, force=False) → list[str]"
  - "render_formula: загружает formula → для каждого step render_step → sNN-{slug}-{step.title_slug}.yaml; строит index.yaml из steps list; dry_run → yaml.dump в stdout; --out → записывает файлы; существующий файл без --force → exit 1 с сообщением"
  - "добавить subcommand formula-render в .claude/hooks/epic_resolve.py (add_parser + dispatch к formula_render.render_formula); args: --formula, --epic-id, --slug, --out, --dry-run, --force"

