checkpoints:
  - id: cp1
    criterion: "The red corpus names one shared owner and requires exactly one import from each BACK, FRONT and INTEG role core."
    verify: "bin/pytest harness/hooks/tests/test_role_core_contract.py -q --tb=line -k 'owner or import'"
  - id: cp2
    criterion: "The corpus fails when common MEMORY BANK/format/runner prose is copied into a role core instead of referenced from the shared owner."
    verify: "bin/pytest harness/hooks/tests/test_role_core_contract.py -q --tb=line -k 'duplicate or copied'"
  - id: cp3
    criterion: "The corpus keeps the role-only guard matrix: BACK promotion, FRONT parent-only/visible-UI, and INTEG element-first/contract/GAP."
    verify: "bin/pytest harness/hooks/tests/test_role_core_contract.py -q --tb=line -k 'back or front or integ'"
  - id: cp4
    criterion: "The corpus rejects unconditional managed pytest and missing hub/managed branch wording."
    verify: "bin/pytest harness/hooks/tests/test_role_core_contract.py -q --tb=line -k 'runner or managed'"

verify:
  - "The red tests read rule files through their canonical repository paths, not duplicated in-test prose."
  - "Each failure assertion identifies the missing owner/import/marker or forbidden runner wording."
  - "No frontend runner is invoked by the test corpus itself."

