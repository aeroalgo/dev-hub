schema: epic-decompose/v1
role: back
step_id: s01
plan_id: T-HUB-033-harness-execution-discipline
title: "git_discipline модуль — atomic commit per sNN с mock-тестами"
next_phase: BACK IMPLEMENT
needs_creative: "no"

goal: |
  Создать `loop/git_discipline.py` с функцией `maybe_atomic_commit(cwd, epic_id, step_id, title) -> CommitResult`.
  Функция: (1) проверяет EPIC_ATOMIC_COMMIT env (default "0" → skip, return CommitResult(skipped=True));
  (2) проверяет чистоту git-дерева (dirty unrelated files → fail-closed, configurable allowlist);
  (3) делает `git add -A && git commit -m "{epic_id} {step_id}: {title}"` — без push;
  (4) возвращает CommitResult(ok, skipped, commit_sha, error).
  Outcome: операторы с EPIC_ATOMIC_COMMIT=1 получают git-лог = epic-timeline; hub-dev остаётся на default=0.
  Связь с FR-001, FR-002, FR-004, FR-008, AC#1.

context:
  consumes:
    - "loop/schemas/checkpoint.py — понять паттерн Pydantic-моделей в проекте"
  produces:
    - "loop/git_discipline.py — новый модуль"
    - "loop/tests/test_git_discipline.py — новый тест-файл"
  plan_refs:
    - "FR-001: env EPIC_ATOMIC_COMMIT default 0"
    - "FR-002: maybe_atomic_commit signature + dirty-tree fail-closed"
    - "FR-004: commit message template {epic_id} {step_id}: {title}"
    - "FR-008: tests mock git; commit on success; skip env=0; fail dirty"
    - "AC#1: git_discipline module"
    - "SC-001: atomic commit on finalize when enabled"
    - "SC-002: no commit when EPIC_ATOMIC_COMMIT=0"
  files:
    - "loop/git_discipline.py"
    - "loop/tests/test_git_discipline.py"

as_built:
  - "loop/ — директория существует, там loop.sh, context_loop.py, schemas/, tests/"
  - "loop/schemas/checkpoint.py — Pydantic v2 CheckpointRecord, pattern extra='allow'"
  - "loop/tests/ — pytest-тесты, fixtures/, __init__.py"
  - "EPIC_ATOMIC_COMMIT — не существует нигде в кодовой базе (greenfield)"

delta:
