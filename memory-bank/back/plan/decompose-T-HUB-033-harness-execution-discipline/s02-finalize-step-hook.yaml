  Если commit fail → finalize НЕ откатывается (commit best-effort, не fail-closed для finalize).
  Outcome: оператор с EPIC_ATOMIC_COMMIT=1 получает git-commit автоматически на каждый finalize_step.
  Связь с FR-003, FR-004, AC#1, SC-001.

