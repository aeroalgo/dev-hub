  - "Obsolete tests на старый контракт: нет (greenfield agent — tests созданы в s01; нет удалённых тестов)"

deletes:
  - "Kind I instruction: 'сам прочитай as-built и пойми' (hits в rules → inline rewrite, не delete файла)"
  - "Kind I instruction: 'behavior-first без inventory executor' (already replaced in s04)"
  - "Kind C: 'можно вызвать explorer вместо sunset на replace' (if found → remove)"
  - "Kind C: 'prose inventory без schema' (if found → remove)"

sunset_inventory:
  kind_A:
    - symbol: "parent-deep-read-as-built (process)"
      path: "process / rules"
      mark: REPLACE
      replacement: "@sunset-inventory spawn + JSON report"
      grep_control: "rg 'as-built.*design\\|template.*design' .cursor/rules/ -r"
  kind_B:
    - symbol: "n/a — greenfield"
      path: "n/a"
      mark: REPLACE
      grep_control: "rg 'sunset-inventory' harness/manifest.yaml"
  kind_C:
    - symbol: "explorer-instead-of-sunset fallback"
      path: ".cursor/rules/"
      mark: REPLACE
      grep_control: "rg 'explorer.*вместо sunset\\|можно.*explorer.*replace' .cursor/rules/ -r"
    - symbol: "prose-inventory-without-schema"
      path: ".cursor/rules/"
      mark: REPLACE
      grep_control: "rg 'prose inventory\\|без schema.*inventory' .cursor/rules/ -r"
  kind_I:
    - symbol: "читай as-built как шаблон дизайна"
      path: ".cursor/rules/back_developer/isolation_rules/_lean/implement.mdc"
      mark: REPLACE
      grep_control: "rg 'as-built.*шаблон\\|прочитай.*as.built' .cursor/rules/ -r"
    - symbol: "behavior-first без inventory executor pointer"
      path: ".cursor/rules/shared/workflow-behavior-first.mdc"
      mark: REPLACE
      grep_control: "rg 'inventory.*executor\\|parent.*читает.*as.built' .cursor/rules/shared/workflow-behavior-first.mdc"

grep_control:
  - back: "rg 'as-built.*design\\|template.*design\\|прочитай.*as.built' .cursor/rules/ -r"
  - back: "rg 'explorer.*вместо.*sunset\\|prose inventory' .cursor/rules/ -r"
  - back: "rg 'sunset-inventory' harness/manifest.yaml harness/agents/sunset-inventory.md .claude/agents/sunset-inventory.md"

