    - ".cursor/rules/shared/workflow-behavior-first.mdc"
    - ".cursor/rules/shared/workflow-spec-first-replace.mdc"
    - ".cursor/rules/shared/cheatsheets/back-implement.mdc"

as_built:
  - "Kind I: lean/implement.mdc — 'читай as-built как шаблон' (до s04); behavior-first — parent-as-inventory-executor (до s04)"
  - "Kind C: нет явного 'explorer вместо sunset' — greenfield agent, но паттерн возможен в старых cheatsheet"
  - "Kind A: нет кода — greenfield; Kind B: нет entrypoint — greenfield"

delta:
