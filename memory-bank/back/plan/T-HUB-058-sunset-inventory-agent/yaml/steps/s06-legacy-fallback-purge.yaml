    - "zero Kind C 'prose inventory без schema' hits (удалено)"
    - "Kind A — подтверждение отсутствия старого code module (не было, scan pass)"
    - "Kind B — подтверждение greenfield (не было, scan pass)"
  plan_refs:
    - "FR-013"
    - "SC-005"
  files:
