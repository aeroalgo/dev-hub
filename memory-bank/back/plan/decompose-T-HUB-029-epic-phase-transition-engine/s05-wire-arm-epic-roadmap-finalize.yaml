goal: |
  Подключить Transition Engine к трём оставшимся entry points:
  (A) `arm_epic` (epic/core.py:3623): после resolver → результат routing через arm_phase; убрать прямой вызов legacy arm функций;
  (B) `arm_roadmap_entry` (roadmap_queue.py:440): post-arm → promote_if_ready вместо прямого arm;
  (C) `finalize_step` (epic/core.py): post-step complete → вызов promote_if_ready (ANALYZE gate check).
  Все три entry points теперь проходят через единый Transition Engine API.

