    - loop/roadmap_queue.py                      # arm_roadmap_entry → promote_if_ready
    - loop/tests/test_finish_integrity.py        # wire test: finalize → promote_if_ready called
    - loop/tests/test_roadmap_queue.py           # arm_roadmap_entry → promote_if_ready
