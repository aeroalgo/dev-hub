goal: |
  Подключить DAG-based epic scheduling (loop/dag/) к Transition Engine:
  `_arm_dag_next(cwd, epic_id, role)` в `loop/dag/` (или dag.py) — adapter → вызывает
  `resolve_next(cwd, epic_id, role)` из epic_transition для определения следующей фазы,
  затем `arm_phase(cwd, epic_id, phase, role)`.
  DAG scheduler не переписывается (Q4=B: adapter, not rewrite).
  Тесты: DAG next → resolver + arm_phase вызваны; DAG edge with ANALYZE gate → ANALYZE arm.

