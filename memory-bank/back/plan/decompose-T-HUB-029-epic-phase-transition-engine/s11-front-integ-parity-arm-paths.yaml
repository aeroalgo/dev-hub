  - 'loop/epic_transition.py:resolve_next — при role="front" → mode prefix "FRONT "; при role="integration" → "INTEG "'
  - 'loop/epic_transition.py:arm_phase — role propagation: Handoff mode = f"{ROLE_PREFIX} {phase}"; arm_active_context_from_decompose / arm_pre_implement_context уже принимают role — проверить что пробрасывается'
  - 'loop/tests/test_epic_transition.py: test_arm_phase_front_decompose — role=front + DECOMPOSE → Handoff mode contains "FRONT"'
  - 'loop/tests/test_epic_transition.py: test_arm_phase_integ_implement — role=integration + IMPLEMENT → Handoff mode "INTEG"'
  - 'loop/tests/test_epic_transition.py: test_promote_if_ready_front_analyze_gate — FRONT epic + analyze gate → arm FRONT ANALYZE'
  - 'loop/tests/test_epic_transition.py: test_registry_roles_covers_all — load_phase_registry()["roles"] == ["back", "front", "integration"]'

