title: "FRONT/INTEG parity: arm paths + phase registry roles=[back,front,integration]"
next_phase: BACK IMPLEMENT
needs_creative: "no"

goal: |
  Расширить Transition Engine для FRONT и INTEG ролей (Q5=B parity v1):
  - phase_registry.yaml: убедиться roles=[back, front, integration] охвачены (или role-specific overrides)
  - arm_phase принимает role param; FRONT IMPLEMENT → next_phase=FRONT IMPLEMENT
  - INTEG arm path: arm_phase для role=integration → нужный Handoff
  - Parity tests: FRONT DECOMPOSE → FRONT ANALYZE gate; INTEG IMPLEMENT → Handoff mode=INTEG IMPLEMENT
  (HARD RULE: parity тесты пишет BACK; FRONT runner тесты запускает только parent)

context:
  consumes:
    - loop/epic_transition.py                    # s01-s10: Transition Engine API
    - loop/schemas/phase_registry.yaml           # s06-s09: registry (roles: [back])
    - .claude/hooks/epic/core.py                 # arm_epic role handling
    - loop/tests/test_epic_transition.py         # regression baseline
  produces:
    - loop/schemas/phase_registry.yaml           # roles: [back, front, integration] confirmed / role overrides
    - loop/epic_transition.py                    # role-aware arm_phase + resolve_next
    - loop/tests/test_epic_transition.py         # parity tests: FRONT + INTEG arm paths
  plan_refs:
    - US-008
    - FR-002
    - NFR-1
    - NFR-3
  files:
    - loop/schemas/phase_registry.yaml
    - loop/epic_transition.py
    - loop/tests/test_epic_transition.py

as_built:
  - loop/epic_transition.py:arm_phase — role param передаётся в arm-функции, но phase-специфичная логика может не различать FRONT/INTEG
  - loop/schemas/phase_registry.yaml — roles строка создана в s06 но покрытие FRONT/INTEG не верифицировано
  - нет parity tests FRONT/INTEG transition paths

delta:
