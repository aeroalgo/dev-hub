goal: |
  Добавить subcommand `mb-load session` в epic_resolve.py: принимает --cwd, вызывает
  load_session(), пишет JSON stdout, exit 0 только ok:true. Реализовать cwd path guard
  (hub vs product) и explicit missing-file policy (partial vs fail-closed). Outcome:
  оператор/loop получает машиночитаемый bundle одним CLI-вызовом; misconfigured cwd
  → fail-closed JSON без silent partial load.

context:
