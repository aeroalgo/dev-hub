    - "US-001: один CLI-вызов → JSON ok:true, files[]"
    - "US-002: fail-closed bad shape via CLI"
    - "TM-006: wrong cwd → fail-closed JSON"
    - "FR-011: hub vs product cwd guard (same as mb-finish)"
    - "§Failure matrix: wrong cwd → path guard → fail-closed JSON"
    - "§Failure matrix: load_now path missing → diagnostic missing_artifact, ok:false or partial"
  files:
