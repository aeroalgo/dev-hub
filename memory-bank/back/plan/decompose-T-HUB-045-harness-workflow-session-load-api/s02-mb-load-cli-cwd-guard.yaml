    - loop/mb_load/schemas.py         # MbLoadResult
    - harness/hooks/epic_resolve.py   # паттерн subcommand (mb-finish уже есть)
    - harness/hooks/epic_paths.py     # cwd resolution pattern
  produces:
    - harness/hooks/epic_resolve.py   # extend: mb-load subcommand
    - loop/tests/test_mb_load_cli.py  # TM-001 CLI path, TM-006 cwd guard
  plan_refs:
