  - "test_hub_root_guard: cwd == hub_root, DEV_HUB_CONSTITUTION_SEED unset → SystemExit(2)"
  - "test_hub_root_env_bypass: DEV_HUB_CONSTITUTION_SEED=1 → proceeds without exit"
  # CLI smoke
