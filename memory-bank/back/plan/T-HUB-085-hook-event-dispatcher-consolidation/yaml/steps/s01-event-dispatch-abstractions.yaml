checkpoints:
  - id: cp1
    criterion: "Ordered branch execution preserves project boundary -> finish boundary -> tool policy sequence; first deny halts further checks."
    verify: ".venv/bin/pytest harness/hooks/tests/test_hook_dispatch.py -q --tb=line -k 'order or sequence or first_deny'"
  - id: cp2
    criterion: "Conflicting updatedInput proposals between policies return a structured conflict diagnostic without partial mutations."
    verify: ".venv/bin/pytest harness/hooks/tests/test_hook_dispatch.py -q --tb=line -k 'conflict or merge'"
  - id: cp3
    criterion: "Unknown event/tool and unexpected exceptions fail closed with typed diagnostic code, preventing silent bypass."
    verify: ".venv/bin/pytest harness/hooks/tests/test_hook_dispatch.py -q --tb=line -k 'fail_closed or unknown or exception'"
  - id: cp4
    criterion: "Table-driven hook dispatch tests pass completely in test runner."
    verify: ".venv/bin/pytest harness/hooks/tests/test_hook_dispatch.py -q"

verify:
  - "hook_dispatch.py is synchronous and bounded with zero LLM/network dependencies."
  - "Decision envelope returns structured status, reason, updatedInput and diagnostic codes."
  - "All branch execution decisions fail closed on unexpected payload or unhandled exception."

