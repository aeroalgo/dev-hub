  - "No unified hook_dispatch.py module exists to coordinate ordered policy branches, merge input mutations, or enforce fail-closed error diagnostics across lifecycle events."

delta:
  - "CREATE harness/hooks/hook_dispatch.py with typed EventContext, DispatchBranch, DecisionEnvelope, DiagnosticCode, ordered branch runner, input merge logic, and fail-closed exception envelope."
  - "CREATE harness/hooks/tests/test_hook_dispatch.py with table-driven tests for branch ordering, conflicting updatedInput rejection, unknown event/tool diagnostics, and exception handling."

