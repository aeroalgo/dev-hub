goal: |
  Ввести общий event-specific dispatcher layer (`harness/hooks/hook_dispatch.py`) с нормализацией context/payload,
  упорядоченным выполнением policy branches, merge обновлений input, envelope ответов и fail-closed diagnostics
  для всех lifecycle events. Это закрывает Stage 1 и закладывает основу для FR-001, FR-002, FR-010 и FR-012.

