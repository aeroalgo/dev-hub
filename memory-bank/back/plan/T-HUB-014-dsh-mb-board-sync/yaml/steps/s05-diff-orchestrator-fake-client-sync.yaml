    criterion: "diff ops: desired set → upsert ids; vanished mb-* → archive ids; non-mb ids untouched"
    verify: ".venv/bin/pytest loop/tests/test_board_sync_diff.py -q"
  - id: cp2
    criterion: "FakeClient: list_tasks() / upsert / archive работают; write_count == кол-ву вызовов write"
    verify: ".venv/bin/pytest loop/tests/test_board_sync_sync.py::test_fake_client -q"
  - id: cp3
    criterion: "run_sync(dry_run=True): FakeClient.write_count == 0 (AC+ #6 precursor; full test в s07)"
    verify: ".venv/bin/pytest loop/tests/test_board_sync_sync.py::test_dry_run_no_writes -q"
  - id: cp4
    criterion: "completed sNN → соответствующая mb-* карточка archived после run_sync (US-002)"
    verify: ".venv/bin/pytest loop/tests/test_board_sync_sync.py::test_completed_step_archived -q"
  - id: cp5
    criterion: "non-mb-* карточки не тронуты после run_sync (AC− #3, SC-002)"
    verify: ".venv/bin/pytest loop/tests/test_board_sync_sync.py::test_non_mb_preserved -q"

verify:
