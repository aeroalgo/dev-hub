  - "test_diff_update_changed — изменился title → update op"
  - "test_diff_archive_vanished — нет в desired, есть в board → archive op"
  - "test_diff_idempotent_skip — content equal → no op"
  - "test_diff_non_mb_ignored — non-mb-* ids не попадают в archive"
  - "test_fake_client_write_count — write_count корректен"
  - "test_dry_run_no_writes — dry_run=True → write_count==0"
  - "test_completed_step_archived — s01 completed → card archived"
