goal: |
  Создать CLI entry-point для board sync:
  - `loop/board_sync/cli.py` — argparse: subcommands `sync` (+ --dry-run / --workspace-id / --dsh-home)
    и `status` (print last generation / counts); подключает HttpHostClient или FakeClient в тестах
  - `bin/hub-board` — thin shell wrapper → `python -m loop.board_sync` или cli entry
  - Dry-run: emits ops plan (print upsert/archive list), zero writes (AC+ #6, SC-003)
  - Status: печатает последнее generation, counts upsert/archive/noop из последнего run
  - --help: list sync/status (AC+ #11)
  Покрывает FR-007, AC+ #6/11, SC-003, US-003.

