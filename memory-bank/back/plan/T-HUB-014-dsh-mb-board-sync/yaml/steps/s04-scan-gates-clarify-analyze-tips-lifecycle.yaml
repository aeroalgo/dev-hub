goal: |
  Создать `loop/board_sync/scan_gates.py` — генерирует gate WorkItems для каждого eligible
  workspace/epic по правилам плана §Gate emission:
  - Pre-implement: PLAN (plan file missing), DECOMPOSE (decompose/ missing), ANALYZE
    (0 completed sNN + no analyze.yaml / critical_count>0), CLARIFY (CRITICAL в plan)
  - Post-implement: reuse `epic.reduce_epic_lifecycle(cwd, role_dir, epic_id)` →
    AUDIT/QA/BUGFIX/REFLECT; qa_failed → BUGFIX; DONE → emit archive-all signal (не gate WorkItem)
  - ROADMAP per-project tip (≤1; select_next_epic thin wrapper, no side-effect arm)
  - FORBIDDEN: post-implement gate + step cards одного epic_id (mutually exclusive, FR-017)
  Покрывает FR-013…017, AC+ #8/9, SC-005/006, US-005.

