goal: |
  Создать `loop/board_sync/scan_mb.py` — для каждого eligible WorkspaceRef сканирует
  все `memory-bank/{back,front,integration}/plan/decompose-*/index.yaml`,
  возвращает `WorkItem[]` только для шагов со status ∈ {pending, in_progress, active, blocked}.
  Corrupt index.yaml одного проекта → skip project + добавить в error list (batch продолжается).
  Completed/done/cancelled шаги не попадают в desired set.
  Покрывает FR-003, AC+ #2, SC-001, AC− #1, NFR batch-skip, US-001/002.

context:
