checkpoints:
  - id: cp1
    criterion: "A direct duplicate fixture fails closed and reports both declaring paths and line numbers."
    verify: "bin/pytest loop/tests/test_workflow_reference_graph.py -q --tb=line -k 'direct_duplicate or both_lines'"
  - id: cp2
    criterion: "A transitive ambiguity is reported; removing the sole owner fails and removing only a redundant edge passes."
    verify: "bin/pytest loop/tests/test_workflow_reference_graph.py -q --tb=line -k 'transitive or sole_owner or redundant'"
  - id: cp3
    criterion: "A dangling dead reference is rejected by the production pack-graph entrypoint."
    verify: "bin/pytest loop/tests/test_pack_graph_doctor.py -q --tb=line -k 'reference or dangling'"
  - id: cp4
    criterion: "Existing route, gate and skill diagnostics remain fail-closed alongside the new reference diagnostics."
    verify: "bin/pytest loop/tests/test_pack_graph_doctor.py -q --tb=line -k 'missing_route or missing_lean_gate or missing_skill or multiple_codes'"

verify:
