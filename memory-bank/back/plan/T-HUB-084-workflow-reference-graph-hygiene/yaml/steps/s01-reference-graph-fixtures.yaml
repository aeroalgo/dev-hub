  fr_ids: [FR-001, FR-002, FR-003]
  nouns:
    - loop/workflow/pack_graph.py
    - check_pack_graph
    - direct duplicate edge diagnostic
    - transitive owner ambiguity diagnostic
    - dangling dead reference diagnostic
    - source path and line evidence
    - loop/tests/test_pack_graph_doctor.py
    - loop/tests/test_workflow_reference_graph.py
  layout_paths:
    - loop/workflow/pack_graph.py
    - loop/tests/test_pack_graph_doctor.py
    - loop/tests/test_workflow_reference_graph.py
  ac_quotes:
    - "Duplicate edge fixture fails with both lines."
    - "Removing sole owner fails; removing redundant edge passes."
    - "Validator reports direct duplicate, transitive ambiguity and dangling dead reference."
  plan_jumps:
    - "memory-bank/back/plan/T-HUB-084-workflow-reference-graph-hygiene/md/plan.md:10-31"
    - "memory-bank/back/plan/T-HUB-084-workflow-reference-graph-hygiene/md/plan.md:33-40"

