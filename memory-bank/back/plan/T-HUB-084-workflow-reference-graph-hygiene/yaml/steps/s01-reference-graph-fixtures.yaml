  Создать исполняемую проверку workflow reference graph, которая через
  существующий workflow-pack doctor различает duplicate, transitive ambiguity
  и dangling dead reference и сообщает исходные строки, сохраняя fail-closed
  поведение текущих pack diagnostics.

