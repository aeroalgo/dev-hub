    - "sole-owner removal remains invalid while redundant-edge removal is accepted"
  plan_refs:
    - "memory-bank/back/plan/T-HUB-084-workflow-reference-graph-hygiene/md/plan.md#fr-003"
    - "memory-bank/back/plan/T-HUB-084-workflow-reference-graph-hygiene/md/plan.md#how--eng-spine"
  files:
    - loop/workflow/pack_graph.py
    - loop/tests/test_pack_graph_doctor.py
    - loop/tests/test_workflow_reference_graph.py

as_built:
  - "loop/workflow/pack_graph.py already validates workflow-pack routes, lean gates, agents, skills and declared schemas."
  - "loop/tests/test_pack_graph_doctor.py already provides temporary-pack fixtures and multi-diagnostic assertions."
