    - .agents/skills/python-testing-patterns/SKILL.md
    - .agents/skills/modern-python/SKILL.md
    - .agents/skills/python-anti-patterns/SKILL.md

checkpoints:
  - id: cp1
    criterion: "Production check_pack_graph fails on direct duplicate, transitive ambiguity and dangling active-corpus fixtures with source lines."
    verify: "bin/pytest loop/tests/test_pack_graph_doctor.py -q --tb=line -k 'active_corpus or duplicate or ambiguous or dangling'"
  - id: cp2
    criterion: "PLAN, DECOMPOSE and ANALYZE markers each have exactly one active owner after the corpus scan."
    verify: "bin/pytest harness/hooks/tests/test_workflow_hot_path_consolidation.py -q --tb=line -k 'marker or owner or hot_path'"
  - id: cp3
    criterion: "Archive/history, memory-bank, runtime and graphify paths are excluded from the active corpus."
    verify: "bin/pytest harness/hooks/tests/test_workflow_hot_path_consolidation.py -q --tb=line -k 'archive or history or excluded'"
  - id: cp4
    criterion: "The doctor remains fail-closed for an invalid active corpus and green for a valid redundant-edge removal."
    verify: "bin/pytest loop/tests/test_pack_graph_doctor.py -q --tb=line -k 'doctor or redundant or fail_closed'"

verify:
  - "bin/pytest loop/tests/test_pack_graph_doctor.py harness/hooks/tests/test_workflow_hot_path_consolidation.py -q --tb=line -k 'active_corpus or marker or archive'"

tdd:
