schema: epic-decompose/v1
role: back
step_id: s05
plan_id: T-HUB-084-workflow-reference-graph-hygiene
title: "Gate the active corpus while preserving priority mode markers and archive exclusions"
next_phase: BACK IMPLEMENT
needs_creative: "no"

goal: |
  Подключить bounded active-corpus scan к production workflow-pack doctor:
  duplicate/transitive/dangling edges и повторный mode owner делают gate
  красным, а archive/history paths не участвуют в active graph. Проверка
  сохраняет точные PLAN/DECOMPOSE/ANALYZE markers и не превращает архивную
  историю в объект переписывания.

plan_contract:
  fr_ids: [FR-001, FR-002, FR-003, FR-004]
  nouns:
    - active corpus validator
    - loop/workflow/pack_graph.py production gate
    - harness/hooks/tests/test_workflow_hot_path_consolidation.py
    - PLAN marker
    - DECOMPOSE marker
    - ANALYZE marker
    - archive/history exclusion set
    - workflow-pack doctor fail-closed result
  layout_paths:
    - loop/workflow/pack_graph.py
    - loop/tests/test_pack_graph_doctor.py
    - harness/hooks/tests/test_workflow_hot_path_consolidation.py
    - harness/cursor/rules/back_developer/workflow-plan.mdc
    - harness/cursor/rules/back_developer/workflow-decompose.mdc
    - harness/cursor/rules/back_developer/workflow-analyze.mdc
  ac_quotes:
    - "Duplicate, dangling or ambiguous edge breaks validation."
    - "PLAN/DECOMPOSE/ANALYZE markers remain."
    - "Archive/history files are excluded from active corpus."
    - "No archive rewrite or blind rg deletion."
  plan_jumps:
    - "memory-bank/back/plan/T-HUB-084-workflow-reference-graph-hygiene/md/plan.md:10-31"
    - "memory-bank/back/plan/T-HUB-084-workflow-reference-graph-hygiene/md/plan.md:33-40"

context:
  consumes:
    - "s01 validator fixtures and s02–s04 owner rewrites"
    - "existing workflow-pack doctor, canonical PLAN/DECOMPOSE/ANALYZE owner files and hot-path corpus tests"
  produces:
    - "check_pack_graph invokes a bounded active-corpus gate and returns source-line diagnostics for invalid edges"
    - "PLAN, DECOMPOSE and ANALYZE markers have one active owner each"
    - "archive/history, memory-bank and graphify output are excluded from active-corpus results"
  plan_refs:
    - "memory-bank/back/plan/T-HUB-084-workflow-reference-graph-hygiene/md/plan.md#fr-001"
    - "memory-bank/back/plan/T-HUB-084-workflow-reference-graph-hygiene/md/plan.md#fr-003"
    - "memory-bank/back/plan/T-HUB-084-workflow-reference-graph-hygiene/md/plan.md#fr-004"
  files:
    - loop/workflow/pack_graph.py
    - loop/tests/test_pack_graph_doctor.py
    - harness/hooks/tests/test_workflow_hot_path_consolidation.py
    - harness/cursor/rules/back_developer/workflow-plan.mdc
    - harness/cursor/rules/back_developer/workflow-decompose.mdc
    - harness/cursor/rules/back_developer/workflow-analyze.mdc

as_built:
  - "loop/workflow/pack_graph.py already has the production check_pack_graph and doctor-facing diagnostic result."
  - "harness/hooks/tests/test_workflow_hot_path_consolidation.py defines canonical hot-path owners and archive exclusion patterns for a bounded corpus."
  - "Canonical PLAN and DECOMPOSE hot-path tests exist, while the new graph contract must also enforce ANALYZE ownership and direct/transitive edge classes through the production gate."

delta:
  - "Wire loop/workflow/pack_graph.py to scan only active rule/workflow roots, report duplicate/transitive/dangling edges, and fail closed through check_pack_graph."
  - "Extend loop/tests/test_pack_graph_doctor.py and harness/hooks/tests/test_workflow_hot_path_consolidation.py for PLAN, DECOMPOSE and ANALYZE markers, one owner, source lines and archive exclusions."
  - "Keep harness/cursor/rules/back_developer/workflow-plan.mdc, workflow-decompose.mdc and workflow-analyze.mdc as canonical mode owners without copying shared policy bodies."

deletes: []

out_of_scope:
  - "Archive/history content is classified and excluded, not rewritten."
  - "The proven-dead back-audit cheatsheet and its loader are removed only in s06 after the caller scan."
  - "TM-084-06 full suite remains a BACK QA outcome after IMPLEMENT."
  - "No compatibility alias or permissive fallback is added to make an invalid active graph pass."

