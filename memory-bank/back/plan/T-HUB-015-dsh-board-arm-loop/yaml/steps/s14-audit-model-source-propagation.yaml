# Source: BACK AUDIT finding F4 in audit-20260829-dsh-board-arm-loop.yaml.
goal: |
  Закрыть finding F4 / source_ref FR-015, SC-008 и NFR model precedence:
  phase env PROJECT_LOOP_<PHASE>_MODEL должен оставаться выше preset, а
  effective model source должен проходить через CLI/Host execution result до
  BoardControls. При env override UI показывает явное предупреждение
  «env overrides»; при preset/default/bare источник также не теряется. Не
  разрешать browser free-text model и не использовать task.mode.

context:
