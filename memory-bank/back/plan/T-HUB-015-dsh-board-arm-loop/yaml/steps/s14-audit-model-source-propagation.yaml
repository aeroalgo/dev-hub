  - "loop/board_launch/loop_run.py"
  - "loop/board_sync/cli.py"
  - "dsh/plugins/mb-bridge/src/python-bridge.ts"
  - "dsh/plugins/mb-bridge/src/board-controls.tsx"
  - "loop/tests/test_board_launch_argv.py"
  - "loop/tests/test_board_launch_ui_filter.py"

as_built:
  - "build_loop_argv returns model_source=env|preset|default|bare, but CLI/HostExecutionResult does not carry it."
  - "BoardControls accepts modelSource as a static prop and only renders the env badge from that prop."
  - "python-bridge.ts validates preset tokens and uses a select-compatible config, but does not expose the effective source in its result."

delta:
  - "Extend the launch result contract with model_source and, where useful, the effective phase env key."
  - "Propagate the value through CLI/Host bridge responses and update BoardControls after Arm+Run/Run completion."
  - "Render the env override warning from actual result state while retaining preset whitelist validation and no task.mode path."
  - "Add tests for env, preset, default, and bare source propagation without changing argv precedence."

deletes: []

out_of_scope:
  - "Changing the precedence order or allowing arbitrary browser model strings."
  - "Editing product .claude/project.env from the board."
  - "Adding a second model resolver outside build_loop_argv."

skills:
  code_surface: service
  impl:
    - ".agents/skills/tdd/SKILL.md"
    - ".agents/skills/python-testing-patterns/SKILL.md"
    - ".agents/skills/python-type-safety/SKILL.md"
    - ".agents/skills/python-error-handling/SKILL.md"

checkpoints:
  - id: cp1
    criterion: "Env > preset > default > bare remains unchanged and each branch emits model_source."
    verify: "timeout 300s .venv/bin/pytest loop/tests/test_board_launch_argv.py -q --tb=line"
  - id: cp2
    criterion: "Host/UI result carries model_source=env and BoardControls updates the env-overrides badge after launch."
    verify: "rg -n 'model_source|modelSource|env overrides' loop/board_launch dsh/plugins/mb-bridge/src"
  - id: cp3
    criterion: "No task.mode or free-text model input becomes part of the mb launch path."
    verify: |
      if rg -n 'task\.mode|input type="text".*model|free.*text.*model' loop/board_launch dsh/plugins/mb-bridge/src; then exit 1; fi

verify:
  - "Effective source is not lost between Python argv construction and UI state."
  - "Env override is visible and preset remains a whitelist selection."
  - "Product files are never edited by runtime/model toggle handling."

tdd:
