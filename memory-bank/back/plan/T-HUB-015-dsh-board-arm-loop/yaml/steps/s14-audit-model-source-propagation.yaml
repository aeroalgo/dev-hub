    - "dsh/plugins/mb-bridge/src/python-bridge.ts — HostExecutionResult source fields"
    - "dsh/plugins/mb-bridge/src/board-controls.tsx — state update from launch result"
    - "loop/tests/test_board_launch_argv.py and source-contract tests — propagation coverage"
  plan_refs:
