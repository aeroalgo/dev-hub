    - "loop/board_sync/cli.py — launch result printing"
    - "dsh/plugins/mb-bridge/src/python-bridge.ts — HostExecutionResult"
    - "dsh/plugins/mb-bridge/src/board-controls.tsx — modelSource prop and env badge"
    - "plan §Model precedence"
    - "plan §FR-015 / SC-008 / AC−8 / AC−9"
  produces:
