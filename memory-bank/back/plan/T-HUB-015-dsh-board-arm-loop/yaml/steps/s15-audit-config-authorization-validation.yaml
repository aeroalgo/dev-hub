  Закрыть finding F5 / source_ref FR-008, AC−3 и Constitution MUST-5:
  validated BridgeConfig.allowRoadmapAdvance должен реально участвовать в
  авторизации arm. Значение false по умолчанию сохраняет fail-closed denial;
  значение true разрешает ROADMAP только при явном конфигурационном opt-in и
  корректных metadata. TypeScript mount должен валидировать/применять enabled,
  allowRoadmapAdvance и связанные config-поля, а не делать небезопасный cast
  сырого объекта.

