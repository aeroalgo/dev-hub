  - "Allow ROADMAP advancement only for explicit true opt-in plus valid explicit authorization; keep non-ROADMAP gate and step behavior unchanged."
  - "Make TypeScript mount honor disabled configuration and validate the supported config shape before registering routes/injections."
  - "Add tests for default denial, explicit opt-in success, malformed config failure, and disabled mount."

