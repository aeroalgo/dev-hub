  - "rg '@reviewer[^-]|\"reviewer\"' .claude/ .cursor/ — 0 жёстких ссылок"
  - "delete .claude/agents/verify.md if callers=0"
  - "delete .claude/agents/reviewer.md if callers=0"
  - "delete dsh/presets/verify.prompt.md if callers=0"
  - "delete dsh/presets/reviewer.prompt.md if callers=0"
  - "confirm: нет dead expected_verify_agent assign в pretool (после s04)"

deletes:
