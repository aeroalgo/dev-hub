skills:
  code_surface: api
  impl: []

sunset_inventory:
  - surface: ".claude/agents/verify.md"
    kind: A
    replacement: ".claude/agents/verify-implement.md"
    delete_step: s10
    fallback: "yes (alias stub)"
    grep_control: "rg '@verify[^-]|subagent_type.*verify[^-]' .claude/ .cursor/"
  - surface: ".claude/agents/reviewer.md"
    kind: A
    replacement: ".claude/agents/verify-qa.md"
    delete_step: s10
    fallback: "yes (alias stub)"
    grep_control: "rg '@reviewer[^-]|subagent_type.*reviewer' .claude/ .cursor/"
  - surface: "dsh/presets/verify.prompt.md"
    kind: B
    replacement: "dsh/presets/verify-implement.prompt.md"
    delete_step: s10
    fallback: "yes (alias stub)"
    grep_control: "rg 'verify\\.prompt' dsh/ .claude/"
  - surface: "dsh/presets/reviewer.prompt.md"
    kind: B
    replacement: "dsh/presets/verify-qa.prompt.md"
    delete_step: s10
    fallback: "yes (alias stub)"
    grep_control: "rg 'reviewer\\.prompt' dsh/ .claude/"
  - surface: "agent-pretool.py dead assign expected_verify_agent"
    kind: A
    replacement: "enforce branch в s04"
    delete_step: s04
    fallback: "no"
    grep_control: "rg 'expected_verify_agent' .claude/hooks/agent-pretool.py"

checkpoints:
