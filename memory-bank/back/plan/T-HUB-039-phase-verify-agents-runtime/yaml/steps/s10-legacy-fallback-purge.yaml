    - ".claude/agents/verify.md (alias stub after s01)"
    - ".claude/agents/reviewer.md (alias stub after s02)"
    - "dsh/presets/verify.prompt.md (alias stub after s06)"
    - "dsh/presets/reviewer.prompt.md (alias stub after s06)"
    - "sunset_inventory: все A/B/C surfaces"
  produces:
    - "удалены: .claude/agents/verify.md (если нет callers кроме alias contract)"
    - "удалены: .claude/agents/reviewer.md"
    - "удалены: dsh/presets/verify.prompt.md"
    - "удалены: dsh/presets/reviewer.prompt.md"
    - "подтверждено: нет мёртвых assign / dual-path leftovers в hooks"
  plan_refs:
    - "FR-019: Purge dead expected_verify_agent unused pattern"
    - "FR-020: Legacy T-HUB-029 surfaces purge"
    - "TM-010: Dead assign regression — purge"
    - "Replacement cleanup: alias stubs Kind=A"
    - "Brownfield: финальный шаг legacy-fallback-purge"
    - "§C. Fallbacks / soft-fail: Silent skip when agent file missing → delete in-epic"
  files:
    - ".claude/agents/verify.md"
    - ".claude/agents/reviewer.md"
    - "dsh/presets/verify.prompt.md"
    - "dsh/presets/reviewer.prompt.md"

as_built:
  - "(after s01) .claude/agents/verify.md = alias stub"
  - "(after s02) .claude/agents/reviewer.md = alias stub"
  - "(after s06) dsh/presets/verify.prompt.md = alias stub"
  - "(after s06) dsh/presets/reviewer.prompt.md = alias stub"

delta:
