    criterion: "rg @verify (non-dash) = 0 в .claude/ после всех docs updates"
    verify: "rg '@verify[^-]' .claude/ .cursor/ | grep -v 'alias\\|backward\\|compat\\|legacy' | wc -l"
  - id: cp2
    criterion: "verify.md / reviewer.md удалены"
    verify: "test ! -f .claude/agents/verify.md && test ! -f .claude/agents/reviewer.md"
  - id: cp3
    criterion: "dsh stubs удалены"
    verify: "test ! -f dsh/presets/verify.prompt.md && test ! -f dsh/presets/reviewer.prompt.md"
  - id: cp4
    criterion: "hooks regression suite зелёная после purge"
    verify: ".venv/bin/pytest loop/tests/test_phase_verify_gates.py -q --tb=line"

verify: []
tdd:
  - "test_legacy_stubs_removed: verify.md / reviewer.md / verify.prompt.md / reviewer.prompt.md absent after purge"
  - "test_no_hard_verify_refs: rg '@verify[^-]' non-alias contexts = 0"
