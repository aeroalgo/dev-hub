  Удалить alias-stubs verify.md / reviewer.md после ≥1-release отработки алиасов.
  Удалить alias-stubs verify.prompt.md / reviewer.prompt.md из dsh/presets.
  Подтвердить rg что нет мёртвых callers на old paths.
  Выполнить sunset_inventory_scan по всем A/B/C surfaces из плана.
  User/system outcome: нет shim-файлов без callers; инвентаризация пустых legacy_surfaces_remaining.

context:
