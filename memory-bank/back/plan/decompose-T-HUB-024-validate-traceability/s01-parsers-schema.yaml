  - "traceability.py ADD parse_plan_requirements(plan_md_path: Path) -> list[str] — re.findall FR-/SC-/US- из markdown таблицы; robust to missing table (return [])"
  - "traceability.py ADD parse_decompose_refs(decompose_dir: Path) -> dict[str, ShardTrace] — glob sNN-*.yaml, yaml.safe_load, collect plan_refs + out_of_scope; missing key → empty list (no crash)"
