schema: epic-decompose/v1
role: back
step_id: s01
plan_id: T-HUB-024-validate-traceability
title: Parsers + report schema — plan/decompose/implement readers + TraceReport dataclass
next_phase: BACK IMPLEMENT
needs_creative: "no"

goal: |
  Реализовать три парсера: (1) plan-parser — извлечь FR/SC/US из plan.md (markdown таблица Requirements);
  (2) decompose-parser — собрать все sNN.plan_refs + out_of_scope из shard YAML;
  (3) implement-parser — собрать evidence (files, tests, status) из shard YAML.
  Определить TraceReport dataclass (findings[], coverage_pct, critical_count, matrix[]).
  Эта ступень — data layer без I/O кроме yaml.safe_load + re; все остальные шаги импортируют отсюда.

context:
  consumes:
    - ".claude/hooks/epic/core.py — get_shard_paths, load_yaml helpers"
    - "loop/YAML-CONTRACT.md — shard schema plan_refs/out_of_scope/evidence"
    - "plan-T-HUB-024 §FR-001–FR-004, §Сигнатуры ключевых функций"
  produces:
    - ".claude/hooks/epic/traceability.py — parse_plan_requirements(plan_md_path) -> list[ReqID]"
    - ".claude/hooks/epic/traceability.py — parse_decompose_refs(decompose_dir) -> dict[sNN, ShardTrace]"
    - ".claude/hooks/epic/traceability.py — parse_implement_evidence(implement_dir) -> dict[sNN, Evidence]"
    - ".claude/hooks/epic/traceability.py — TraceReport, Finding, ShardTrace, Evidence dataclasses"
    - "loop/tests/fixtures/traceability/ — minimal plan.md + shard YAMLs for unit tests"
  plan_refs:
    - "plan-T-HUB-024 FR-001"
    - "plan-T-HUB-024 FR-002"
    - "plan-T-HUB-024 FR-003"
    - "plan-T-HUB-024 FR-004"
    - "plan-T-HUB-024 FR-006"
    - "plan-T-HUB-024 FR-008"
  files:
    - ".claude/hooks/epic/traceability.py"
    - "loop/tests/fixtures/traceability/plan.md"
    - "loop/tests/fixtures/traceability/decompose/s01-example.yaml"
    - "loop/tests/fixtures/traceability/decompose/s02-example.yaml"
    - "loop/tests/fixtures/traceability/implement/s01-example.yaml"
    - "loop/tests/test_traceability_parsers.py"

