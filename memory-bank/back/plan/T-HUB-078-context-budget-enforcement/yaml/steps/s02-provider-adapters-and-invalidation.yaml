  - "manifest.yaml registers provider hooks, but registration is not yet a context-ledger enforcement boundary."

delta:
  - "ADD a provider-neutral normalizer and wire Claude PreToolUse/PostToolUse plus SubagentStart/SubagentStop payloads to s01 ContextLedger."
  - "ADD Codex bridge normalization for Read/read, Edit/Write, NotebookEdit, rename/delete and missing-range events; map response status without changing policy."
  - "WIRE root-session and invocation lineage into every provider request, generating deterministic derived_identity when provider invocation id is absent."
  - "WIRE all supported write boundaries to hash refresh/invalidation and reject provider payload divergence rather than falling back locally."
  - "EDIT harness/hooks/context_ledger_adapters.py, harness/hooks/agent-pretool.py, harness/hooks/write-pretool.py, harness/hooks/subagent-start.py and harness/hooks/agent-posttool.py so every provider boundary calls the shared normalizer."
  - "EDIT loop/runtime_adapters/claude.py, loop/runtime_adapters/codex.py, loop/runtime_materializers/hooks_json.py and loop/runtime_materializers/codex_policy_mapping.yaml only for transport mapping and parity metadata."
  - "ADD parity fixtures in harness/hooks/tests/test_context_ledger_adapters.py and loop/tests/test_context_ledger_provider_parity.py asserting identical normalized receipts and reason codes for Claude and Codex equivalents."

