    criterion: "Kind A sunset inventory: every untracked/ad-hoc counter has zero live production callers; obsolete symbols are deleted or rewritten to shared ledger."
    verify: "rg -n 'duplicate_reads|unique_reads|context.*count|ReadRecord|ContextLedger|provider.*counter' harness/hooks loop tests --glob '*.py'"
  - id: cp2
    criterion: "Kind B sunset inventory: raw plan injection is absent from runtime entrypoints; only bounded plan-jump projection remains."
    verify: |
      rg -n 'plan\.md|plan_jumps|bounded|whole.*plan|read.all' harness loop CLAUDE.md AGENTS.md DSH.md --glob '*.py' --glob '*.md' --glob '*.yaml'
  - id: cp3
    criterion: "Kind C anti-fallback scan: broad read/search, silent full-memory recovery and soft dual paths are absent; old boundary denies or emits typed exception."
    verify: "rg -n 'read.all|read-all|all.*memory|fallback|soft|optional|preferred|broad.*search|graphify' harness/hooks loop harness/instructions CLAUDE.md AGENTS.md DSH.md --glob '*.py' --glob '*.md' --glob '*.yaml'"
  - id: cp4
    criterion: "Kind I instruction scan: canonical and generated instructions no longer treat prose-only reread/graphify guidance as sole control and all obsolete machine format references are rewritten."
    verify: "rg -n 'context ledger|plan_jumps|graphify|derived_identity|DecisionReceipt|reread|read.*again' harness/instructions/main.md CLAUDE.md AGENTS.md DSH.md .cursor/hooks.json .claude/agents .codex/agents"
  - id: cp5
    criterion: "Obsolete tests/counters are deleted or rewritten and targeted epic regression is green without restoring sunset behavior."
    verify: ".venv/bin/pytest harness/hooks/tests loop/tests -q --tb=line -k 'context or hook or prompt or codex or agent'"
  - id: cp6
    criterion: "Final shared SoT enforcement evidence confirms every boundary FR routes through ledger and old path DENY/HALT is tested, with no second hook registration."
    verify: "rg -n 'ContextLedger|DecisionReceipt|permissionDecision.*deny|fail.closed|hooks_json|PreToolUse|SubagentStart|SubagentStop' harness loop .cursor .claude --glob '*.py' --glob '*.yaml' --glob '*.json' --glob '*.md'"

