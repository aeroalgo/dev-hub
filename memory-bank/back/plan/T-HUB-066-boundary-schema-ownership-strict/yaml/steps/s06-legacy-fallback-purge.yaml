    expect: 0 tests asserting bypass as success (fail-closed)
  - id: inv-b-01
    kind: B
    symbol: validate-boundary keep
    command: 'rg -n "validate-boundary" harness/hooks/epic_resolve.py loop/tests/test_validate_boundary.py'
    expect: CLI still present; no dual parser CLI
  - id: inv-c-01
