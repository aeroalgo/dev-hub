sunset_inventory:
  - symbol: if fence_data is not None or not data.get("verdict")
    kind: A
    replacement: fence_data is not None
    policy: delete in-epic
    rg_scope: harness/hooks/subagent-stop.py
    expect: bypass absent
  - symbol: extra=ignore collab fence
    kind: A
    replacement: extra=forbid + canonical parse
    policy: delete in-epic
    rg_scope: loop/codex_collab_verdict.py
    expect: extra=ignore absent on fence model
  - symbol: schema optional/default on wire
    kind: A
    replacement: required discriminator / Wire*
    policy: delete in-epic
    rg_scope: loop/schemas/gate_verdict.py loop/schemas/repair_result.py loop/validate_boundary.py
    expect: missing schema invalid on external
  - symbol: tests treating missing schema or payload verdict as valid SoT
    kind: A
    replacement: rewrite asserts
    policy: delete in-epic
    rg_scope: loop/tests/ harness/hooks/tests/
    expect: case absent or rewritten
  - symbol: validate-boundary CLI
    kind: B
    replacement: same validate-boundary
    policy: keep
    rg_scope: harness/hooks/epic_resolve.py loop/tests/test_validate_boundary.py
    expect: CLI still validate-boundary; no new dual CLI
  - symbol: payload verdict as SoT
    kind: C
    replacement: fence only
    policy: delete in-epic
    rg_scope: harness/hooks/subagent-stop.py
    expect: data.verdict without fence cannot record PASS
  - symbol: ownership retried as schema
    kind: C
    replacement: escalate / no schema retry
    policy: delete in-epic
    rg_scope: harness/hooks/subagent-stop.py harness/hooks/_lib.py
    expect: semantic_ownership_mismatch not in schema retry path
  - symbol: repair done leftover remaining
    kind: C
    replacement: validator invalid
    policy: delete in-epic
    rg_scope: loop/schemas/repair_result.py
    expect: done+remaining rejected
  - symbol: prompts fence required vs runtime bypass
    kind: I
    replacement: runtime matches prompt
    policy: enforce
    rg_scope: harness/agents/verify-implement.md harness/hooks/subagent-stop.py
    expect: no-fence FAIL both prompt and runtime
  - symbol: schemas README lie verdict.py SKIP
    kind: I
    replacement: GateVerdictRecord PASS/FAIL/BLOCKED
    policy: delete in-epic
    rg_scope: loop/schemas/README.md
    expect: no verdict.py / SKIP as current SoT

