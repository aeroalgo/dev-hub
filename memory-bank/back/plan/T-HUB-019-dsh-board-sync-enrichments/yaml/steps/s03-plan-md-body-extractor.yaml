  - "loop/board_sync/diff.py: gate_card вызывает compose_description(None, card) — body пустой"
  - "loop/board_sync/body_loaders.py: load_gate_body — не существует (добавляется в s02-файл)"

delta:
  - "ADD plan_rel: str | None = None в GateWorkItem dataclass"
  - "EDIT scan_gates: при формировании GateWorkItem glob `memory-bank/{role}/plan/plan-{epic_id}-*.md`; первый hit → plan_rel"
  - "ADD load_gate_body(plan_path: Path | None, reason_code: str | None) -> str | None в body_loaders.py"
  - "load_gate_body: если plan_path is None → reason_code как тело или None"
  - "load_gate_body: читает plan .md; ищет H1 `# [T-HUB-NNN...]`; секции ## Цель, ## Контекст, ## User Stories (или аналоги)"
  - "load_gate_body: собирает: H1-строка + весь раздел Цель + первый абзац Контекст + таблица UserStories ≤5 строк"
  - "load_gate_body: fail-soft при OSError/parse → reason_code fallback или None"
  - "POST_PHASES (AUDIT/QA/BUGFIX/REFLECT): load_gate_body не вызывается (body=None)"
  - "EDIT diff.gate_card: plan_path = project_root / item.plan_rel if item.plan_rel else None; calls load_gate_body для pre-impl phases"

