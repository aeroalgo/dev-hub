  - "loop/board_sync/card_model.py: parse_metadata(description) парсит всю строку как YAML"
  - "loop/board_sync/diff.py: work_item_card и gate_card — description=serialize_metadata(card)"

delta:
  - "ADD константу _FOOTER_DELIMITER = '\\n---\\nmb-board-card/v1\\n' в card_model.py"
  - "EDIT serialize_metadata → строит footer-only строку: delimiter + YAML (без body; обратная совместимость — пустой body)"
  - "ADD compose_description(body: str | None, card) -> str → '{body or \"\"}\\n{delimiter}{yaml}'"
  - "EDIT parse_metadata: split по delimiter; если delimiter отсутствует — пробует весь текст как YAML (legacy fallback)"
  - "EDIT diff._without_generation: работает через parse_metadata + serialize_metadata (без изменений если footer корректен)"
  - "EDIT diff.work_item_card и gate_card: description=compose_description(None, card) (body=None пока s02/s03)"

