schema: epic-decompose/v1
role: back
plan_id: T-HUB-020-dsh-board-epic-loop
step_id: s03
title: "Resolver post-implement + plan-next override validation"
next_phase: BACK IMPLEMENT
needs_creative: "no"

goal: |
  Resolver покрывает post-implement фазы (QA, AUDIT, REFLECT, BUGFIX).
  После всех steps completed — reduce_epic_lifecycle определяет следующую post-impl фазу.
  plan-next override валидируется fail-closed: конфликт (команда=DECOMPOSE, plan missing) → diagnostic, не silent.
  Roadmap queue + post-implement = epic перемещается в todo (завершён).

as_built:
  - "loop/board_sync/scan_gates.py: post-implement gates через reduce_epic_lifecycle (только 1 GateWorkItem, нет EpicNextAction)"
  - ".claude/hooks/epic/core.py: reduce_epic_lifecycle существует — используется в scan_gates"
  - "Нет интеграции plan-next override в post-implement resolver"
  - "Нет fail-closed diagnostic для override конфликта"

delta:
  - "EDIT loop/board_sync/epic_resolver.py: ADD _resolve_post_implement(project, role, epic_id, steps, override) -> EpicNextAction"
  - "IMPL post-implement matrix: all steps completed + QA done? → REFLECT; REFLECT done? → epic done (todo)"
  - "EDIT resolve_epic_next_action: добавить post-implement branch; делегировать reduce_epic_lifecycle"
  - "EDIT validate_plan_next: extend для post-implement phase — conflict если post-impl команда + pending steps"
  - "ADD _epic_done(project, role, epic_id) -> bool — нет pending post-impl gates → epic в todo"
  - "ADD reason_code='epic_done' → board_sync mapped → todo column"

