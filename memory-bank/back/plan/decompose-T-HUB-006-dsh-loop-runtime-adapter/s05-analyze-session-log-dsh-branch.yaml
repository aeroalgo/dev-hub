goal: |
  `session_resilience.py::analyze_session_log` получает ветку для DSH logs:
  exit 0 без признака FINISH → aborted (как Claude); HTTP 4xx/5xx → transient;
  fatal patterns → permanent. `record_abort` (context_loop.py) пробрасывает runtime.
  Fixtures из s02 используются как тест-вход. FR-7, FR-8, NFR-3, AC+4.

