  с fail-closed при невалидном значении (exit 2 + diagnostics `invalid_runtime_config`).
  Default = `claude` (unset → claude); NFR-1 zero regression; AC+2, AC+3, FR-1.

context:
  consumes:
    - .claude/hooks/_lib.py  # RuntimeConfig dataclass + resolve_runtime_config, RuntimeConfigError
    - loop/tests/test_runtime_config.py  # существующие тесты — regression baseline
  produces:
    - .claude/hooks/_lib.py  # RuntimeConfig.epic_runtime field; resolve_runtime_config ветка
    - loop/tests/test_runtime_config.py  # новые параметризованные кейсы EPIC_RUNTIME
  plan_refs:
    - FR-1
    - NFR-1
    - NFR-4
    - AC+2
    - AC+3
  files:
    - .claude/hooks/_lib.py
    - loop/tests/test_runtime_config.py

as_built:
  - .claude/hooks/_lib.py:RuntimeConfig — frozen dataclass с полями session_timeout_sec, permission_mode и др.;
    НЕТ поля epic_runtime
  - .claude/hooks/_lib.py:resolve_runtime_config — читает EPIC_SESSION_TIMEOUT_SEC,
    EPIC_PERMISSION_MODE и др.; EPIC_RUNTIME не проверяется и не экспортируется
  - .claude/hooks/_lib.py:runtime_config_status — возвращает dict effective/sources;
    EPIC_RUNTIME отсутствует в выводе
  - loop/tests/test_runtime_config.py — покрывает существующие поля (PERMISSION_MODE, bounds);
    нет тестов для EPIC_RUNTIME

delta:
  - _lib.py::RuntimeConfig: добавить поле `epic_runtime: str = "claude"` (frozen dataclass)
  - _lib.py::_RUNTIME_ENUM_FIELDS: новый dict `{"EPIC_RUNTIME": frozenset({"claude","dsh"})}` —
    проверка допустимых значений enum
  - _lib.py::resolve_runtime_config: ветка для EPIC_RUNTIME после bounds-loop;
    invalid value → diagnostics.append({code: "invalid_runtime_config", key: "EPIC_RUNTIME",
    reason: "unsupported_runtime"}) → raise RuntimeConfigError
  - _lib.py::RuntimeConfig: unset EPIC_RUNTIME → default "claude"
  - _lib.py::runtime_config_status: добавить "EPIC_RUNTIME" в effective dict
  - test_runtime_config.py: test_epic_runtime_defaults_to_claude (unset env → config.epic_runtime=="claude")
  - test_runtime_config.py: test_epic_runtime_dsh (EPIC_RUNTIME=dsh → config.epic_runtime=="dsh")
  - test_runtime_config.py: test_epic_runtime_invalid_fails_closed (EPIC_RUNTIME=foo →
    RuntimeConfigError с code=invalid_runtime_config, key=EPIC_RUNTIME, reason=unsupported_runtime)
  - test_runtime_config.py: test_epic_runtime_status_included (config_status["effective"]["EPIC_RUNTIME"])
  - test_runtime_config.py: test_epic_runtime_project_env_override (EPIC_RUNTIME в project.env файле)

