    criterion: >
      dsh/README.md существует и содержит секции: DEEPSEEK_API_KEY, EPIC_RUNTIME=dsh, Node version
    verify: >
      test -f dsh/README.md &&
      grep -q 'DEEPSEEK_API_KEY' dsh/README.md &&
      grep -q 'EPIC_RUNTIME=dsh' dsh/README.md &&
      grep -q 'Node' dsh/README.md && echo 'README ok'
  - id: cp2
    criterion: >
      dsh/bin/which-dsh.sh исполняем; bash -n проходит
    verify: >
      test -x dsh/bin/which-dsh.sh &&
      bash -n dsh/bin/which-dsh.sh && echo 'which-dsh.sh ok'
  - id: cp3
    criterion: >
      dsh/profiles/.gitkeep и dsh/profiles/stub/.gitkeep существуют
    verify: >
      test -f dsh/profiles/.gitkeep &&
      test -f dsh/profiles/stub/.gitkeep && echo 'profiles ok'

verify:
  - "test -f dsh/README.md && grep -q 'DEEPSEEK_API_KEY' dsh/README.md"
  - "test -x dsh/bin/which-dsh.sh && bash -n dsh/bin/which-dsh.sh"

