goal: |
  Создать минимальный scaffold `dsh/` для landing zone T-HUB-007:
  `dsh/README.md` (Node version, DEEPSEEK_API_KEY, EPIC_RUNTIME=dsh),
  `dsh/bin/which-dsh.sh` (resolver npx/global/DSH_BIN),
  `dsh/profiles/.gitkeep` (landing pad для profile YAML).
  FR-9, AC+5.

context:
  consumes:
    - loop/loop.sh              # resolve_dsh_bin логика (s04) — README документирует то же
    - memory-bank/back/plan/plan-T-HUB-006-dsh-loop-runtime-adapter.md  # §DSH invoke contract
  produces:
    - dsh/README.md
    - dsh/bin/which-dsh.sh
    - dsh/profiles/.gitkeep
    - dsh/profiles/stub/.gitkeep  # stub subdir для T-HUB-007 placeholder
  plan_refs:
    - FR-9
    - AC+5
  files:
    - dsh/README.md
    - dsh/bin/which-dsh.sh
    - dsh/profiles/.gitkeep
    - dsh/profiles/stub/.gitkeep

as_built:
  - dsh/ — директория НЕ существует в репо

delta:
  - |
      CREATE dsh/README.md:
      Секция "Installation": Node ≥ 18; npm install -g @deepseek-ai/dsh@VERSION
      Секция "Environment": DEEPSEEK_API_KEY=sk-...; EPIC_RUNTIME=dsh; DSH_BIN (optional override)
      Секция "Profiles": dsh/profiles/<name>.json — структура описывается в T-HUB-007
      Секция "Running": PROJECT_ROOT=... EPIC_RUNTIME=dsh make loop ARGS=gpt
      Секция "Stub profile": до T-HUB-007 → epic-implement profile не загружается; loop вызывает dsh с --profile stub/epic-implement
      Секция "Version pinning": зафиксировать @deepseek-ai/dsh@VERSION в README; предупреждение об unstable CLI
  - |
      CREATE dsh/bin/which-dsh.sh (executable, chmod +x):
      #!/usr/bin/env bash
      set -euo pipefail
      # 1. DSH_BIN override
      if [[ -n "${DSH_BIN:-}" && -x "$DSH_BIN" ]]; then echo "$DSH_BIN"; exit 0; fi
      # 2. global dsh
      if command -v dsh >/dev/null 2>&1; then command -v dsh; exit 0; fi
      # 3. npx fallback
      if command -v npx >/dev/null 2>&1; then echo "npx -y @deepseek-ai/dsh"; exit 0; fi
      echo "dsh not found: install via npm install -g @deepseek-ai/dsh or set DSH_BIN" >&2
      exit 127
  - CREATE dsh/profiles/.gitkeep — пустой файл
  - CREATE dsh/profiles/stub/.gitkeep — пустой файл (stub subdir for T-HUB-007)

deletes: []
# Greenfield: нет существующих файлов для удаления

out_of_scope:
  - "Реальные DSH profiles (T-HUB-007)"
  - "Cordis plugin mounting (T-HUB-008)"
  - "dsh/bin/which-dsh.sh unit test — тест bash скриптов вне scope TDD (bash shebang testing)"

skills:
  code_surface: infra
  impl: []
  # docs-only + shell script scaffold; нет Python-кода → impl пустой (per workflow-decompose §Core)

checkpoints:
