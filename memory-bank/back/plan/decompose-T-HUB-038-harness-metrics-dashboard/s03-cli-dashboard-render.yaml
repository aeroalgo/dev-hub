needs_creative: "no"

goal: |
  Добавить subcommand dashboard-render в context_loop.py и опциональный alias bin/loop dashboard.
  Subcommand принимает --days 7 (default) и --format html|json|both (default html), вызывает
  collect(cwd) -> render_html/render_json, записывает в runtime/<slug>/reports/dashboard-<date>.html
  или .json. Operator запускает одну команду и получает файл без ручного jq.
  Связь FR-003, FR-005, AC-1, US-001, US-002.

