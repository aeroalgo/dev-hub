    - "loop/dashboard/collect.py — collect (s01)"
    - "loop/dashboard/render.py — render_html, render_json (s02)"
    - "loop/context_loop.py — existing subcommand patterns"
    - "bin/loop — existing shell script alias mechanism"
  produces:
    - "loop/context_loop.py — +dashboard-render subcommand handler"
    - "bin/loop — +dashboard alias block"
  plan_refs:
    - FR-003
    - FR-005
    - AC-1
    - US-001
    - US-002
  files:
