    criterion: "Active callers point to canonical workflow Hot path guidance and preserve the generic non-recursive load/FINISH discipline."
    verify: |
      rg -n 'workflow-(decompose|implement|plan)\.mdc(#Hot path)?|## Hot path|FINISH|non-recursive|не рекурсивный' harness/cursor/rules/mainrule.mdc harness/claude/skills/role-command/SKILL.md harness/cursor/rules
  - id: cp3
    criterion: "FRONT and INTEG IMPLEMENT have no dangling reference after BACK IMPLEMENT source rewire."
    verify: |
      ! rg -n 'shared/cheatsheets/back-implement\.mdc' harness/cursor/rules/front_developer/workflow-implement.mdc harness/cursor/rules/integration_developer/workflow-implement.mdc
  - id: cp4
    criterion: "Corpus test catches old caller injection and keeps archive/history outside the active set."
    verify: "bin/pytest harness/hooks/tests/test_workflow_hot_path_consolidation.py -k 'dangling or archive' -q --tb=line"

