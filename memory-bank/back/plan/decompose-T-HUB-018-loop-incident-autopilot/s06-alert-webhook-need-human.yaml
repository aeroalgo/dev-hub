schema: epic-decompose/v1
role: back
plan_id: T-HUB-018-loop-incident-autopilot
step_id: s06
title: "Escalation + alert — alert.py + NEED_HUMAN file + webhook loop-alert/v1"
next_phase: BACK IMPLEMENT
needs_creative: "no"

goal: |
  При repair_exhausted (tier1 max failed или tier1 disabled + tier0 failed) loop:
  1. Записывает NEED_HUMAN flag file в runtime/<slug>/epic/NEED_HUMAN
  2. Выводит stderr banner с incident_id и ссылкой на runbook
  3. Опционально: POST JSON loop-alert/v1 на EPIC_ALERT_WEBHOOK_URL (fail-closed если 4xx/5xx)
  Payload не содержит secrets; incident escalated в store.

as_built:
  - "loop.sh пишет NEED_HUMAN при stop-gate через epic_resolve.py"
  - "нет специализированного incident-alert пути"
  - "нет webhook механизма"
delta:
  - "ADD loop/incidents/alert.py — функция escalate_incident(incident: IncidentRecord, epic_dir: Path, project_root: Path): (1) resolve_incident(store, 'escalated', tier='escalation'); (2) write_need_human_file(epic_dir, incident); (3) print_stderr_banner(incident); (4) post_webhook(incident) if EPIC_ALERT_WEBHOOK_URL"
  - "ADD loop/incidents/alert.py — функция write_need_human_file(epic_dir, incident): пишет runtime/<slug>/epic/NEED_HUMAN с содержимым NEED_HUMAN: incident_<code> + incident_id + runbook_rel"
  - "ADD loop/incidents/alert.py — функция post_webhook(incident, url): POST loop-alert/v1 JSON: {schema, incident_id, diagnostic_codes, epic_id, step_id, project_root, timestamp}; timeout=5s; не включает secrets (env vars, tokens); fail-closed (log error, не падать)"
  - "ADD loop/incidents/alert.py — функция print_stderr_banner(incident): stderr multi-line banner с NEED_HUMAN marker + runbook path"
  - "loop-alert/v1 schema зафиксирована в loop/incidents/alert_schema.py (dataclass)"
  - "MODIFY loop/incidents/tier1_runner.py — при repair_exhausted: вызывать escalate_incident"
  - "ADD loop/tests/test_incidents_alert.py — unit: write_need_human_file создаёт файл; post_webhook с mock httpx/urllib; fail-closed при webhook 500; banner на stderr; payload без secrets"
