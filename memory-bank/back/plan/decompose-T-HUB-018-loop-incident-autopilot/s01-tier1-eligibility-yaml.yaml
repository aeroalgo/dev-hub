  code_surface: service
  impl:
    - ".agents/skills/tdd/SKILL.md"
    - ".agents/skills/python-testing-patterns/SKILL.md"
    - ".agents/skills/modern-python/SKILL.md"
    - ".agents/skills/python-type-safety/SKILL.md"

checkpoints:
  - id: cp1
    criterion: "orchestration-only diagnostic code (e.g. active_context_shape_invalid) → is_tier1_eligible=True"
    verify: "`.venv/bin/pytest loop/tests/test_incidents_tier1_eligibility.py -k orchestration_eligible -q --tb=line`"
  - id: cp2
    criterion: "product_test_failed=true в metadata → is_tier1_eligible=False"
    verify: "`.venv/bin/pytest loop/tests/test_incidents_tier1_eligibility.py -k product_test_not_eligible -q --tb=line`"
  - id: cp3
    criterion: "unknown diagnostic_code → is_tier1_eligible=False (fail-closed)"
    verify: "`.venv/bin/pytest loop/tests/test_incidents_tier1_eligibility.py -k unknown_code_false -q --tb=line`"
  - id: cp4
    criterion: "mixed codes (одна orchestration + один product_test_failed) → False"
    verify: "`.venv/bin/pytest loop/tests/test_incidents_tier1_eligibility.py -k mixed_codes_false -q --tb=line`"

verify:
  - "`.venv/bin/pytest loop/tests/test_incidents_tier1_eligibility.py -q --tb=line`"

tdd:
