schema: epic-decompose/v1
role: back
plan_id: T-HUB-018-loop-incident-autopilot
step_id: s01
title: "Whitelist + classifier — tier1-eligibility.yaml + is_tier1_eligible()"
next_phase: BACK IMPLEMENT
needs_creative: "no"

goal: |
  Loop может корректно определить, допустимо ли запускать Tier-1 сессию для данного инцидента.
  Orchestration-only инциденты (active_context_shape_invalid, index_step_missing и т.д.) → eligible=true.
  Product-тесты / application-бaги → eligible=false (не запускать tier1, сразу эскалация).

as_built:
  - "loop/incidents/tier1.py не существует"
  - "loop/incidents/ пакет создан T-HUB-017, есть schema.py + store.py"
  - "diagnostic_codes живут в loop/incidents/registry.yaml (017)"
  - "нет whitelist orchestration-only кодов"
delta:
  - "ADD loop/incidents/tier1_eligibility.yaml — YAML whitelist orchestration-only diagnostic_codes с полем tier1_eligible: true/false и rationale"
  - "ADD loop/incidents/tier1.py — функция is_tier1_eligible(incident: IncidentRecord) -> bool: читает whitelist, проверяет все diagnostic_codes инцидента против него; product_test_failed в metadata → False; unknown code → False (fail-closed)"
  - "ADD loop/incidents/tier1.py — функция load_eligibility_config(path=None) -> dict: загружает tier1_eligibility.yaml из loop/incidents/, override через EPIC_TIER1_ELIGIBILITY_PATH"
  - "ADD loop/tests/test_incidents_tier1_eligibility.py — unit-тесты: orchestration code → True; product_test_failed → False; unknown code → False; mixed codes (one product + one orchestration) → False"
  - "tier1_eligibility.yaml включает коды из 017: active_context_shape_invalid, index_step_missing, checkpoint_not_found, implement_shard_corrupt, epic_dir_missing, session_context_stale, status_payload_malformed"
deletes: []
