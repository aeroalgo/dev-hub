  - "test_product_test_failed_not_eligible"
  - "test_unknown_code_fail_closed_false"
  - "test_mixed_codes_with_product_fail_returns_false"
  - "test_load_eligibility_config_reads_yaml"
  - "test_eligibility_config_override_env_path"

