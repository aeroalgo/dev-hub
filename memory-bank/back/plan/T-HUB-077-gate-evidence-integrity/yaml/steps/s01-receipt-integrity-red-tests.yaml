schema: epic-decompose/v1
role: back
step_id: s01
plan_id: T-HUB-077-gate-evidence-integrity
title: "Red tests — manual, forged, stale and real verifier evidence"
next_phase: BACK IMPLEMENT
needs_creative: "no"

goal: |
  TDD red фиксирует границу доверия до реализации: mutable state, manual authority,
  изменённый receipt, старый epoch и TaskStop не могут завершить workflow, а валидный
  receipt независимого verifier продолжает полный finish path. Outcome — тесты вызывают
  stop/finish entrypoints, а не проверяют наличие поля в JSON.

plan_contract:
  fr_ids: [FR-001, FR-002, FR-004, FR-005, AC+1, AC+2, AC+4, AC+5, AC−1, AC−2, TM-077-02, TM-077-03, TM-077-04, TM-077-05]
  nouns: [verifier receipt, immutable provenance, session_id, phase_epoch, projection digest, verifier identity, receipt digest, GATE_INFRASTRUCTURE_FAILURE, mb-finish, finalize-step]
  layout_paths:
    - harness/hooks/tests/test_subagent_stop_receipt_integrity.py
    - harness/hooks/tests/test_stop_gate_receipt_integrity.py
    - loop/tests/test_finish_receipt_integrity.py
  ac_quotes:
    - "Manual last_verify_verdict='PASS' или evidence с authority=manual не позволяют mb-finish/finalize-step завершить шаг."
    - "Изменение любого signed/hashed поля receipt после создания обнаруживается до finish."
    - "Stale/TaskStop оставляет диагностируемую запись и переводит flow в stop/repair, а не в verifier retry loop."
    - "Настоящий verifier PASS по действующему shard продолжает успешно проходить весь finish path."
  plan_jumps:
    - memory-bank/back/plan/T-HUB-077-gate-evidence-integrity/md/plan.md:33-61
    - memory-bank/back/plan/T-HUB-077-gate-evidence-integrity/md/plan.md:65-86
    - memory-bank/back/plan/T-HUB-077-gate-evidence-integrity/md/plan.md:117-139
    - memory-bank/back/plan/T-HUB-077-gate-evidence-integrity/md/plan.md:142-150

context:
  consumes:
    - plan.md §AC and §AC−
    - plan.md §Failure matrix
    - plan.md §QA consumes TM-077-02…05
  produces:
    - red receipt-integrity tests through subagent-stop, stop-gate and mb-finish entrypoints
