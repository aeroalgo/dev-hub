    - harness/hooks/tests/test_stop_gate_receipt_integrity.py
    - loop/tests/test_finish_receipt_integrity.py

as_built:
  - subagent-stop constructs verdict evidence then mirrors it through epic_lib into mutable epic state.
  - stop-gate and mb_finish import current gate evidence helpers but state last_verify fields remain an available authority surface.
  - existing finish and stop-gate tests cover integrity fragments without the complete manual/forged/stale/real receipt matrix.

delta:
  - add failing tests for authority=manual and state-only PASS rejected by direct mb-finish/finalize-step path.
  - add failing mutation and wrong session/epoch/role/step fixtures that require named diagnostics and preserve forensic state.
  - add TaskStop/no receipt fixture that requires infrastructure_failure and no implicit retry.
  - add a positive valid verifier receipt fixture that reaches the production finish path successfully.

deletes: []

out_of_scope:
  - receipt schema and runtime emitter implementation (s02)
  - stop/finish production enforcement (s03)
  - write boundary and operator repair implementation (s04)
  - all legacy and instruction purge (s05)
  - full suite → QA

