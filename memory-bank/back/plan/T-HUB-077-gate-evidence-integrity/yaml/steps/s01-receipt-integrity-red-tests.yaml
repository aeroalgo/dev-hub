checkpoints:
  - id: cp1
    criterion: Manual authority and state-only PASS fixtures fail through mb-finish/finalize-step, not merely a pure helper.
    verify: "bin/pytest loop/tests/test_finish_receipt_integrity.py -q --tb=line -k 'manual or state_only'"
  - id: cp2
    criterion: Mutated receipt and old epoch/session/role/step fixtures fail with a named integrity diagnostic.
    verify: "bin/pytest harness/hooks/tests/test_subagent_stop_receipt_integrity.py loop/tests/test_finish_receipt_integrity.py -q --tb=line -k 'mutated or digest or epoch or identity'"
  - id: cp3
    criterion: TaskStop or absent receipt produces infrastructure_failure, retains forensic evidence and does not request retry.
    verify: "bin/pytest harness/hooks/tests/test_stop_gate_receipt_integrity.py -q --tb=line -k 'taskstop or stale or absent'"
  - id: cp4
    criterion: A valid current verifier receipt reaches finish success without a compatibility branch.
    verify: "bin/pytest loop/tests/test_finish_receipt_integrity.py -q --tb=line -k 'valid and verifier'"

verify:
  - "bin/pytest harness/hooks/tests/test_subagent_stop_receipt_integrity.py harness/hooks/tests/test_stop_gate_receipt_integrity.py loop/tests/test_finish_receipt_integrity.py -q --tb=line"
tdd:
