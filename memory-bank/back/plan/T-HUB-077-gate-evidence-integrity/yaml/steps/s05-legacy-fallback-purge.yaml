as_built:
  - Direct agent writes to load_epic_state/save_epic_state last_verify fields are an identified sunset code surface.
  - Permissive manual mirror remains an identified alternate authority path.
  - Worker shell recipes manipulating spawn-gate JSON and prompts suggesting runtime state edits are identified B/I sunset surfaces.
  - Clearing stale marker and retrying or force-PASS is an identified Kind C soft-fail.

delta:
  - delete production manual-evidence helpers and compatibility branches that accept manual authority, empty receipt or state-only PASS.
  - delete agent-facing shell recipes that modify spawn-gate state and replace surviving lifecycle guidance with await/status plus explicit failure handoff.
  - delete silent stale clear/retry/force-PASS behavior; retain only typed failure and separately authorized operator repair.
  - rewrite/delete obsolete tests and instructions that require mutable verifier authority; keep bounded test fixture receipt builders only.

deletes:
  - "A: direct production writes to load_epic_state/save_epic_state for last_verify_* authority; permissive manual mirror path."
  - "B: worker shell recipes manipulating .claude/runtime/spawn-gate/*.json."
  - "C: clear stale marker, implicit retry and force-PASS fallback paths."
  - "I: prompts/rules/instructions suggesting inspection or edit of runtime gate state."

