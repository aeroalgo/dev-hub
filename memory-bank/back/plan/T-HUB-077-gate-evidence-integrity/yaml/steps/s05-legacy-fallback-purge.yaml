checkpoints:
  - id: cp1
    criterion: Kind A — no production manual mirror or direct last_verify authority writer remains; obsolete tests do not import or assert the removed contract.
    verify: "rg -n 'authority[=:\\x27\"]manual|last_verify_(verdict|evidence).*PASS|mirror_.*verdict.*evidence' harness/hooks loop/mb_finish --glob '*.py'"
  - id: cp2
    criterion: Kind B — no worker-facing shell recipe mutates spawn-gate JSON; parent path exposes await/status only.
    verify: "rg -n 'spawn-gate/.*json|spawn-gate.*(write|edit|rm|clear)' .claude harness loop --glob '!**/tests/**'"
  - id: cp3
    criterion: Kind C — no silent stale clear, implicit retry or force-PASS fallback survives in production lifecycle paths.
    verify: "rg -n 'clear_in_flight|force.?PASS|retry.*verif|last_verify_verdict.*PASS' harness/hooks loop/mb_finish loop/context_loop.py --glob '*.py'"
  - id: cp4
    criterion: Kind I — agent-facing prompts and instructions no longer teach runtime-gate edits; retained text permits wait/status or explicit failure handoff only.
    verify: "rg -n 'edit.*runtime|write.*runtime|clear.*in_flight|spawn-gate.*json' CLAUDE.md .claude harness/claude loop --glob '*.md' --glob '*.py'"

verify:
  - "bin/pytest harness/hooks/tests/test_agent_pretool_gate_write_boundary.py harness/hooks/tests/test_subagent_stop_receipt_integrity.py harness/hooks/tests/test_stop_gate_receipt_integrity.py harness/hooks/tests/test_operator_gate_repair.py loop/tests/test_finish_receipt_integrity.py -q --tb=line"
  - "rg -n 'authority[=:\\x27\"]manual|force.?PASS|clear.*in_flight' harness/hooks loop/mb_finish --glob '*.py'"
tdd:
