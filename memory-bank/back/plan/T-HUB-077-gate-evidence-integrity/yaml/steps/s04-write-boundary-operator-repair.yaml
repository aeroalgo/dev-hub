  - id: cp2
    criterion: TaskStop/stale path creates immutable forensic evidence and leaves gate state available for diagnosis rather than silently clearing it.
    verify: "bin/pytest harness/hooks/tests/test_operator_gate_repair.py harness/hooks/tests/test_stop_gate_receipt_integrity.py -q --tb=line -k 'forensic or stale or taskstop'"
