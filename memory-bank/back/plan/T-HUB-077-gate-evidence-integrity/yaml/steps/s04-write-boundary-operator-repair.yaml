as_built:
  - agent-pretool validates Agent spawning but does not provide a complete deny boundary for shell/edit/write targeting runtime gate state.
  - runtime spawn-gate state can be cleared or mutated outside a dedicated operator authority flow.
  - subagent-stop and lifecycle code record mutable verdict state rather than a dedicated stale/TaskStop forensic event contract.

delta:
  - deny and log agent-originated write/edit/shell-write attempts against runtime gate files, spawn-gate state and last_verify authority fields before execution where supported.
  - record an immutable forensic event for stale/TaskStop and leave the marker intact until operator repair.
  - add a separately named operator-only repair command requiring explicit authority and reason; it may re-arm/restart verification but cannot set or mirror PASS.
  - ensure test fixtures use bounded test-only builders rather than exempting general runtime writes.

