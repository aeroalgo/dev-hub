goal: |
  Закрыть источник подделки на agent tool boundary: parent/worker не может write/edit/shell-write
  runtime-gate, spawn-gate или last_verify fields. Stale/TaskStop сохраняет forensic event и
  требует отдельного operator-authorized repair с причиной и audit trail; repair может заново
  запустить verifier, но никогда не изготовляет PASS.

