as_built:
  - stop-gate reads spawn-gate and epic state to determine whether verify evidence permits FINISH.
  - mb-finish owns final activeContext and decompose validation but receives legacy gate evidence through epic core helpers.
  - parent-facing loop instructions can observe runtime status but do not expose a receipt-only typed projection contract.

delta:
  - wire the shared receipt validator into stop-gate before it permits FINISH and into mb-finish/finalize-step before it changes completion state.
  - require receipt session, epoch, projection/event digest, role, step, verifier identity and receipt digest to match current identity at both boundaries.
  - project only passed, failed, stale or infrastructure_failure to parent lifecycle prompt construction; omit mutable receipt internals.
  - classify TaskStop/no receipt/stale receipt and identity mismatch as GATE_INFRASTRUCTURE_FAILURE with preserved forensic marker and no implicit verifier retry.

