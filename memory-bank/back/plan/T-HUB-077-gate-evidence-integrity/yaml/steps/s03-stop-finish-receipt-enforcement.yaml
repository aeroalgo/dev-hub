plan_id: T-HUB-077-gate-evidence-integrity
title: "Enforce current verifier receipt at stop and finish boundaries"
next_phase: BACK IMPLEMENT
needs_creative: "no"

goal: |
  Сделать валидный current receipt единственным разрешением продолжать workflow: stop-gate
  и mb-finish/finalize-step независимо проверяют identity, epoch, projection и digest.
  Parent получает только read-only typed status; отсутствующий, stale или mismatched receipt
  останавливает flow с GATE_INFRASTRUCTURE_FAILURE и не запускает скрытый retry.

plan_contract:
  fr_ids: [FR-002, FR-004, AC+1, AC+2, AC+3, AC+4, AC+5, AC−1, AC−2, TM-077-02, TM-077-03, TM-077-04, TM-077-05]
  nouns: [stop-gate, mb-finish, finalize-step, receipt validator, current projection, passed, failed, stale, infrastructure_failure, GATE_INFRASTRUCTURE_FAILURE, await_gate]
  layout_paths:
