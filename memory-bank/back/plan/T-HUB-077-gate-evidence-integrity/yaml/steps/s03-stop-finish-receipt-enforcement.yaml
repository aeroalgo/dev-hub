    - plan.md §Stage 2
  produces:
    - one shared pure current-receipt validator used by stop-gate and mb-finish/finalize-step
    - read-only typed status projection for parent prompt/lifecycle consumers
    - fail-closed stale and abnormal-verifier diagnostics with retained forensic state
  plan_refs: [plan.md#failure-matrix, plan.md#stages]
  files:
