    - loop/context_loop.py
    - harness/hooks/tests/test_stop_gate_receipt_integrity.py
    - loop/tests/test_finish_receipt_integrity.py
  ac_quotes:
    - "Parent может только ждать/читать typed status gate; не может очистить in_flight или редактировать runtime JSON."
    - "Stale/TaskStop оставляет диагностируемую запись и переводит flow в stop/repair, а не в verifier retry loop."
    - "Настоящий verifier PASS по действующему shard продолжает успешно проходить весь finish path."
