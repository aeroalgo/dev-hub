checkpoints:
  - id: cp1
    criterion: Receipt schema validates all provenance fields and recomputes canonical digest; any post-issue mutation is detected.
    verify: "bin/pytest harness/hooks/tests/test_subagent_stop_receipt_integrity.py -q --tb=line -k 'schema or digest or mutated'"
  - id: cp2
    criterion: Only subagent-stop accepted verifier/reviewer completion emits a receipt; direct mirror caller cannot supply authority=manual evidence.
    verify: "bin/pytest harness/hooks/tests/test_subagent_stop_receipt_integrity.py -q --tb=line -k 'emitter or manual or mirror'"
  - id: cp3
    criterion: Persisted mirror state carries receipt reference/digest only and legacy receipt-less PASS is a named rejection.
    verify: "bin/pytest harness/hooks/tests/test_subagent_stop_receipt_integrity.py loop/tests/test_finish_receipt_integrity.py -q --tb=line -k 'reference or receipt_less or legacy'"

verify:
  - "bin/pytest harness/hooks/tests/test_subagent_stop_receipt_integrity.py loop/tests/test_finish_receipt_integrity.py -q --tb=line"
tdd:
  - "red: s01 matrix stays red until receipt issuance and validation exist"
  - "green: schema, emitter and mirror reference satisfy forged/mutated evidence cases without a second authority path"
