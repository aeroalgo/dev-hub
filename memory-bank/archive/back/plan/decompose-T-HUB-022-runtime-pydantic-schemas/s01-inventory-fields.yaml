  - "_state_diagnostics() — проверяет state_schema_version; при ошибке → state_schema_invalid"
  - "epic_events.EVENT_SCHEMA — dict schema loop-event/v1"
  - "loop/board_sync/card_model.py — StepCard/GateCard как dataclasses без Pydantic"
  - "drift_counters — отсутствует в state (нет поля в default_state)"

delta:
