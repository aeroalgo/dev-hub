schema: epic-decompose/v1
role: back
step_id: s01
plan_id: T-HUB-022
title: "Inventory all state/checkpoint/event/handoff/gate fields from code + tests"
next_phase: BACK IMPLEMENT
needs_creative: "no"

goal: |
  Произвести полный статический инвентарь всех machine-readable границ loop:
  поля state.json, checkpoint.json, events.jsonl, activeContext frontmatter, gate sidecar.
  Зафиксировать as-built в `memory-bank/back/plan/refs/T-HUB-022-field-inventory.md`.
  Вычислить расхождения между spike-schemas (loop/schemas/*.py) и реальными dict-ключами
  в epic/core.py `default_state()`, `save_epic_state()`, `validate_checkpoint()`.
  Итог: coverage matrix US-001…US-009 vs. конкретные файлы/функции. FR-001–FR-007.

context:
  consumes:
    - ".claude/hooks/epic/core.py — load_epic_state, save_epic_state, validate_checkpoint, default_state, repair_*"
    - ".claude/hooks/epic_events.py — EVENT_SCHEMA, build_event, append_event"
    - ".claude/hooks/stop-gate.py — extract_verdict, finalize_step"
    - "loop/schemas/handoff.py — LoopHandoffFrontmatter (spike)"
    - "loop/schemas/gate_verdict.py — GateVerdictRecord (spike)"
    - "loop/schemas/active_context.py — parse_frontmatter, extract_handoff_phase"
    - "loop/gate_verdict_store.py — read_gate_verdict, write_gate_verdict"
    - "loop/board_sync/card_model.py — StepCard, GateCard (dataclasses)"
    - ".claude/hooks/epic_yaml.py — EpicDecomposeIndex, EpicDecomposeShard (pattern ref)"
    - "loop/tests/test_*.py — fixture field sets"
  produces:
    - "memory-bank/back/plan/refs/T-HUB-022-field-inventory.md"
  plan_refs:
    - "plan-T-HUB-022 §Зафиксированные решения"
    - "plan-T-HUB-022 US-001–US-009"
    - "plan-T-HUB-022 FR-001–FR-007"
  files:
    - "memory-bank/back/plan/refs/T-HUB-022-field-inventory.md"

as_built:
  - "loop/schemas/ — 3 spike files: handoff.py, gate_verdict.py, active_context.py"
  - "epic/core.py default_state() — dict без Pydantic, ключи: active, status, phase, epic_id, step_id, ..."
  - "validate_checkpoint() — dict schema: schema (loop-checkpoint/v1), status, action, resume_policy, ..."
