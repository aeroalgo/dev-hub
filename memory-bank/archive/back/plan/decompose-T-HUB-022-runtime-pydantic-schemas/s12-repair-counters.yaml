  - `repair_fingerprint_stall` → counter `fingerprint_stall_repair`
  - `repair_finish_desync` → counter `handoff_projected` (deprecated name)
  - `extract_verdict` regex-path (cwd!=None, sidecar miss) → counter `gate_verdict_regex_fallback`
  Добавить `PROJECT_LOOP_REPAIR_LEGACY=1` env guard: если =0 → repair_* только log warning, не rewrite.
  US-008, FR-003.

