schema_version: "runtime-registry/v1"
runtimes:
  claude:
    id: claude
    adapter_module: "loop.runtime_adapters.claude"
    binary_env: "CLAUDE_PATH"
    capabilities:
      - stream_json
      - session_resume
      - raw_exec
  codex:
    id: codex
    adapter_module: "loop.runtime_adapters.codex"
    binary_env: "CODEX_BIN"
    capabilities:
      - headless
      - bridge_subagents
