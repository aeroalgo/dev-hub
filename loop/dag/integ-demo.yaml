schema: "loop-dag/v2"

pipeline:
  id: "integ-demo"

execution:
  autonomous: false

source:
  kind: "manifest"
  artifacts:
    - "loop/dag/integ-demo.yaml"

nodes:
  - id: "gap_close"
    role: "INTEG"
    action: "close"
    completion:
      type: "artifact"
    artifact: "memory-bank/integration/gap/portal/gap-close.yaml"
    depends_on: []

  - id: "back_impl"
    role: "BACK"
    action: "implement"
    completion:
      type: "decompose"
      decompose: "memory-bank/back/plan/demo-back/yaml/decompose-index.yaml"
    depends_on:
      - "gap_close"

  - id: "front_impl"
    role: "FRONT"
    action: "implement"
    completion:
      type: "decompose"
      decompose: "memory-bank/front/plan/demo-front/yaml/decompose-index.yaml"
    depends_on:
      - "gap_close"

  - id: "integ_verify"
    role: "INTEG"
    action: "implement"
    completion:
      type: "decompose"
      decompose: "memory-bank/integration/plan/demo-verify/yaml/decompose-index.yaml"
    depends_on:
      - "back_impl"
      - "front_impl"
