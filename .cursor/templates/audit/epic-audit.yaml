schema: epic-audit/v2
role: back
epic_id: <epic_id>
plan_id: <plan_id>
date: YYYY-MM-DD
auditor: BACK AUDIT

summary:
  total_steps: 0
  implemented: 0
  not_implemented: 0
  deviations: 0
  findings: 0

# Intent coverage metrics. Keep the values explicit even when a source is skipped.
intent_checked:
  fr_total: 0
  fr_satisfied: 0
  sc_checked: 0
  constitution_checked: false

# Findings are ordered CRITICAL, HIGH, MEDIUM, LOW, then by stable id.
# Dual-write legacy mapping: actionable missing findings → not_implemented[];
# partial/contradicts findings → deviations[]; unrequested findings stay here only.
findings:
  - id: F1
    gap_type: missing | partial | contradicts | unrequested
    severity: CRITICAL | HIGH | MEDIUM | LOW
    source_ref: FR-###
    evidence: <file/area observed>
    remaining_work: <actionable remediation or review decision>

converged: false

implemented:
  - step_id: sNN
    implement_file: implement-<epic_id>/sNN-<slug>.yaml

not_implemented:
  - step_id: sNN
    plan_title: <title from plan>
    new_shard: decompose-<epic_id>/sNN-audit-<slug>.yaml

deviations:
  - step_id: sNN
    implement_file: implement-<epic_id>/sNN-<slug>.yaml
    plan_intent: <what plan said>
    actual: <what was actually done>
    impact: low | medium | high

# Brownfield replace / cutover (shared/workflow-legacy-fallback-cleanup.mdc §4):
# HARD: sunset_inventory_scan обязателен при sunset ≠ n/a; legacy_surfaces_remaining: []
# только после scan с result: pass на всех rows. Пустые массивы без scan = audit FAIL.
sunset_inventory_scan:
  scanned_at: YYYY-MM-DD
  plan_ref: plan-<epic_id>.md#replacement--sunset
  rows:
    - symbol: path/or/FunctionName
      kind: A
      command: 'rg -n "FunctionName" <scope> --glob "*.py" | rg -v "test_|/archive/"'
      result: pass | fail
      prod_callers: []
      notes: ""
legacy_surfaces_remaining: []   # каждый scan row result:fail + prod callers; shim без follow-up in queue
fallback_remaining: []          # kind C scan fails
instruction_remaining: []       # kind I scan fails
purge_step_present: true        # false только если sunset весь n/a (greenfield)
# Boundary FR: sole SoT enforce (shared/workflow-legacy-fallback-cleanup.mdc §4–§5)
sot_enforce_scan:
  scanned_at: YYYY-MM-DD
  rows:
    - boundary: <boundary-id>
      enforce_evidence: 'rg / test command…'
      result: pass | fail
      notes: ""

blocked_reason: ""  # заполнить если blocked, иначе пусто
